<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Karbantartás</title>
    <style>
        /* Teljes sötét téma a StakeForge stílusában */
        body {
            background-color: #0b0e11; /* Sötét, modern háttér */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* A "neon" hatás, ami utal a StakeForge technikai hátterére */
        .highlight {
            color: #00e5ff; 
            font-weight: 600;
        }

        p {
            color: #888;
            font-size: 1rem;
        }

        /* Mobilos finomhangolás */
        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>A weboldal <span class="highlight">karbantartás</span> alatt áll.</h1>
        <p>Próbálkozz újra később!</p>
    </div>

</body>
</html>
