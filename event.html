<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge - Esemény részletei</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --meta-text: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .back-link {
            color: var(--primary);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .event-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.5rem; }
        
        .event-meta {
            color: var(--meta-text);
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .pool-value { color: var(--primary); font-weight: bold; }

        .odds-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-bet {
            background: #334155;
            border: 2px solid transparent;
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .btn-bet:hover {
            border-color: var(--primary);
            background: #475569;
        }
        .team-name { display: block; font-size: 0.9rem; opacity: 0.7; margin-bottom: 5px; }
        .odds-value { font-weight: bold; color: var(--primary); font-size: 1.2rem; }

        /* Szelvény animáció */
        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Vissza a piacokhoz</a>

        <div class="event-card">
            <h1 id="teams">Esemény betöltése...</h1>

            <div class="event-meta">
                <div id="event-deadline">⌛ Határidő: --</div>
                <div>
                    Host: <span id="event-host">--</span> | 
                    Pool: <span id="event-pool" class="pool-value">--</span>
                </div>
            </div>
            
            <div class="odds-grid">
                <button class="btn-bet" onclick="placeBet('home')">
                    <span id="home-name" class="team-name">Hazai</span>
                    <span id="home-odds" class="odds-value">--</span>
                </button>
                
                <button class="btn-bet" onclick="placeBet('away')">
                    <span id="away-name" class="team-name">Vendég</span>
                    <span id="away-odds" class="odds-value">--</span>
                </button>
            </div>
        </div>
    </div>

    <!-- EZ HIÁNYZOTT: A JOBB ALSÓ SZELVÉNY MODUL -->
    <div id="bet-slip" style="display: none; position: fixed; bottom: 20px; right: 20px; width: 280px; background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 15px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); z-index: 1000; animation: slideIn 0.3s ease-out; text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin: 0; font-size: 1rem; color: #38bdf8;">Fogadószelvény</h3>
            <button onclick="document.getElementById('bet-slip').style.display='none'" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.5rem; line-height: 1;">&times;</button>
        </div>
        
        <div style="background: #334155; padding: 10px; border-radius: 6px; margin-bottom: 12px;">
            <div id="slip-team" style="font-weight: bold; margin-bottom: 4px; font-size: 0.95rem;">--</div>
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                <span>Odds:</span>
                <span id="slip-odds" style="color: #38bdf8; font-weight: bold;">--</span>
            </div>
        </div>

        <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 0.75rem; margin-bottom: 4px; opacity: 0.7;">Tét összege (DEMO):</label>
            <input type="number" id="bet-amount" value="100" style="width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 8px; border-radius: 4px; box-sizing: border-box; outline: none;">
        </div>

        <button onclick="confirmBet()" style="width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;">
            FOGADÁS MEGTÉTELE
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="event.js"></script>
</body>
</html>
