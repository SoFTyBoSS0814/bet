<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Adminisztrációs Központ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #00e701; /* Stake zöld */
            --danger: #ff4646;
            --bg-dark: #0f212e;
            --card-bg: #1a2c38;
            --text-main: #b1bad3;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 { color: white; border-bottom: 2px solid #2f4553; padding-bottom: 10px; }
        h2 { color: var(--text-main); margin-top: 40px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Kártya stílusok */
        .admin-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #2f4553;
            transition: transform 0.2s;
        }

        .admin-card:hover { transform: translateX(5px); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info strong { font-size: 1.1rem; color: white; }
        .user-info span { color: #8a96a3; font-size: 0.85rem; }

        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active { background: rgba(0, 231, 1, 0.1); color: var(--primary); }
        .status-banned { background: rgba(255, 70, 70, 0.1); color: var(--danger); }

        /* Gombok */
        .actions {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #2f4553;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-ban { background: var(--danger); color: white; }
        .btn-ban:hover { background: #d33232; }

        .btn-unban { background: var(--primary); color: #071824; }
        .btn-unban:hover { background: #00b300; }

        .btn-bonus { background: #2f4553; color: white; }
        .btn-bonus:hover { background: #405a6d; }

        /* Kifizetés speciális */
        .withdrawal-card { border-left-color: #f1c40f; }
        code { background: #071824; color: #f1c40f; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem; }

        /* Tiltott állapot vizuális visszajelzése az adminban */
        .is-restricted {
            opacity: 0.6;
            filter: grayscale(0.5);
            border-left-color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ StakeForge Vezérlőpult</h1>

        <section id="withdrawals-section">
            <h2>💰 Függő kifizetési kérelmek</h2>
            <div id="withdrawal-list-container">
                <p style="color: #557086;">Betöltés...</p>
            </div>
        </section>

        <section id="users-section">
            <h2>👥 Felhasználók kezelése</h2>
            <div id="user-list-container">
                <p style="color: #557086;">Betöltés...</p>
            </div>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
