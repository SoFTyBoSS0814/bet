<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #00e701;
            --danger: #ff4646;
            --bg-dark: #0f212e;
            --card-bg: #1a2c38;
            --text-main: #b1bad3;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }
        
        .admin-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #2f4553;
        }

        /* Ha a felhasználó ki van tiltva */
        .is-restricted {
            border-left-color: var(--danger);
            opacity: 0.7;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #2f4553;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-approve { background: var(--primary); color: #000; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-bonus { background: #2f4553; color: #fff; }
        
        /* Kitiltás/Feloldás gombok */
        .btn-ban { background: #ff4646; color: white; }
        .btn-unban { background: #00e701; color: black; }

        code { background: #000; color: #f1c40f; padding: 5px; display: block; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ StakeForge Adminisztráció</h1>

        <section>
            <h2>💰 Függő kifizetések</h2>
            <div id="withdrawal-list-container">Betöltés...</div>
        </section>

        <section>
            <h2>👥 Felhasználók kezelése</h2>
            <div id="user-list-container">Betöltés...</div>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
