<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Liquidity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }
        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }
        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .btn-bet:disabled { opacity: 0.4; cursor: not-allowed; border-color: #222; }
        .btn-create { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .settled-badge { position: absolute; top: 15px; left: 15px; background: #555; color: #fff; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .history-type { position: absolute; top: 15px; right: 15px; font-weight: 900; font-size: 14px; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); margin-top: 5px; border-radius: 8px; font-size: 13px; border-left: 3px solid transparent; }
        .history-item.winner-row { border-left-color: var(--success); background: rgba(40, 167, 69, 0.1); }
        .reward-box { background: linear-gradient(145deg, rgba(255, 204, 0, 0.1), rgba(0,0,0,0.4)); border: 1px dashed var(--demo); padding: 25px; border-radius: 16px; margin-top: 20px; text-align: center; }
        #reward-msg { font-size: 18px; font-weight: bold; color: var(--success); margin: 10px 0; min-height: 24px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-create" onclick="openCreateModal()">+ Create</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>
    <div id="section-history" class="section">
        <h2>Settled Markets</h2>
        <div id="history-list"></div>
    </div>
    <div id="section-wallet" class="section">
        <div class="market-card" style="max-width:500px; margin:auto; text-align:center;">
            <h2>Balances</h2>
            <div style="display:flex; gap:10px; margin:20px 0;">
                <div style="flex:1; padding:20px; border:1px solid var(--border); border-radius:15px;">
                    <small>REAL</small><h2 id="w-real" style="color:var(--primary)">0.00 €</h2>
                </div>
                <div style="flex:1; padding:20px; border:1px solid var(--border); border-radius:15px;">
                    <small>DEMO</small><h2 id="w-demo" style="color:var(--demo)">0.00 D</h2>
                </div>
            </div>
            <div class="reward-box">
                <h3 style="margin:0; color:var(--demo)">Daily Mystery Box</h3>
                <div id="reward-msg"></div>
                <button id="btn-claim-reward" class="btn-primary" style="background:var(--demo)" onclick="claimDailyDemo()">TRY MY LUCK</button>
            </div>
        </div>
    </div>
    <div id="section-account" class="section">
        <div class="market-card" style="max-width:450px; margin:auto;">
            <h2 style="text-align:center">Account Profile</h2>
            <div style="background:rgba(0,0,0,0.2); padding:20px; border-radius:12px; margin:20px 0;">
                <p style="margin:5px 0; color:#aaa">Username</p>
                <p id="acc-username" style="font-weight:bold; font-size:18px; margin-bottom:15px;">-</p>
                <p style="margin:5px 0; color:#aaa">Email Address</p>
                <p id="acc-email" style="font-weight:bold; margin-bottom:15px;">-</p>
                <p style="margin:5px 0; color:#aaa">Account ID</p>
                <p id="acc-id" style="font-family:monospace; font-size:12px; color:var(--primary)">-</p>
            </div>
            <button class="btn-bet" onclick="logout()" style="color:var(--danger); border-color:var(--danger); font-weight:bold;">LOG OUT</button>
        </div>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10" oninput="calcWin()">
        <p id="bet-win-text">Payout: 0.00</p>
        <button class="btn-primary" onclick="placeBet()">PLACE BET</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')">Cancel</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h3>New Market</h3>
            <span id="create-balance-display" style="font-size:12px; font-weight:bold; color:var(--primary)">Balance: 0.00</span>
        </div>
        <select id="m-type" onchange="updateCreateBalanceDisplay()">
            <option value="DEMO">DEMO</option>
            <option value="REAL">REAL</option>
        </select>
        <input id="m-name" placeholder="Event Name">
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Initial Liquidity Pool">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px; border-style:dashed">+ Add Category</button>
        <button class="btn-primary" style="margin-top:20px" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="settle-title"></h3>
        <div id="settle-area"></div>
        <button class="btn-primary" style="margin-top:20px; background:var(--success)" onclick="finalSubmitSettle()">FINALIZE</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('settleModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let activeBet = null;
    let currentSettleId = null;
    let currentSettleGroups = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
        setInterval(checkDeadlines, 1000);
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("w-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("w-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("acc-username").innerText = currentUser.username;
        document.getElementById("acc-email").innerText = currentUser.email || "N/A";
        document.getElementById("acc-id").innerText = currentUser.id;
        updateCreateBalanceDisplay();
    }

    function updateCreateBalanceDisplay() {
        if(!userProfile) return;
        const type = document.getElementById('m-type').value;
        const bal = type === 'REAL' ? userProfile.real_balance.toFixed(2) + " €" : userProfile.demo_balance.toFixed(2) + " D";
        document.getElementById('create-balance-display').innerText = "Balance: " + bal;
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list');
        const hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            const typeColor = m.type === 'DEMO' ? 'var(--demo)' : 'var(--primary)';
            const isExpired = new Date(m.deadline) < new Date();

            if(m.status === 'active') {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.innerHTML = `
                    <div class="market-header">
                        <div>
                            <h2 style="margin:0;">${m.title}</h2>
                            <small style="color:#aaa">Host: ${m.creator_name} | <b>Available Pool: ${parseFloat(m.take).toFixed(2)} ${m.type}</b> | Deadline: ${new Date(m.deadline).toLocaleString()}</small>
                        </div>
                        ${m.creator_name === currentUser.username ? `<button onclick="openSettle('${m.id}','${m.title}')" class="btn-create">SETTLE</button>` : ''}
                    </div>
                    ${groups.map(g => `<div class="market-group"><small>${g.title}</small><div class="outcomes-grid">
                        ${g.outcomes.map(o => `
                            <button class="btn-bet" data-deadline="${m.deadline}" onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}','${m.deadline}')" ${isExpired ? 'disabled' : ''}>
                                ${o.n}<br><b>${o.o}</b>
                            </button>`).join('')}
                    </div></div>`).join('')}`;
                mList.appendChild(card);
            } else {
                const card = document.createElement('div');
                card.className = 'market-card';
                const sDate = m.start_time ? new Date(m.start_time) : new Date(m.created_at);
                card.innerHTML = `
                    <div class="settled-badge">Settled</div>
                    <div class="history-type" style="color:${typeColor}">${m.type}</div>
                    <div style="margin-top:15px;">
                        <h3 style="margin:0;">${m.title}</h3>
                        <p style="margin:5px 0; font-size:12px; color:#aaa;">Host: ${m.creator_name} | Final Pool: ${m.take}</p>
                    </div>
                    ${groups.map(g => `<div class="market-group"><small style="color:var(--primary)">${g.title}</small>
                        ${g.outcomes.map(o => `<div class="history-item ${o.status==='win' ? 'winner-row' : ''}">
                                <span>${o.n}</span>
                                <b style="color:${o.status==='win'?'var(--success)':'var(--danger)'}">${o.status.toUpperCase()}</b>
                            </div>`).join('')}
                    </div>`).join('')}`;
                hList.appendChild(card);
            }
        });
    }

    function checkDeadlines() {
        document.querySelectorAll('.btn-bet').forEach(btn => {
            const dl = new Date(btn.dataset.deadline);
            if(dl < new Date()) btn.disabled = true;
        });
    }

    function openBet(mId, oName, odds, type, deadline) {
        if(new Date(deadline) < new Date()) return;
        activeBet = { mId, oName, odds, type };
        document.getElementById('bet-on').innerText = oName;
        document.getElementById('bet-odds').innerText = odds;
        document.getElementById('betModal').classList.remove('hidden');
        calcWin();
    }

    function calcWin() {
        const amt = document.getElementById('bet-amount').value;
        document.getElementById('bet-win-text').innerText = "Payout: " + (amt * activeBet.odds).toFixed(2);
    }

    async function placeBet() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        if(amt <= 0) return;
        const balField = activeBet.type === 'REAL' ? 'real_balance' : 'demo_balance';
        if(userProfile[balField] < amt) return alert("Insufficient balance!");

        const profit = amt * (activeBet.odds - 1);
        const { data: mData } = await _supabase.from('markets').select('take').eq('id', activeBet.mId).single();
        if(mData.take < profit) return alert("Market liquidity exceeded!");

        await _supabase.from('bets').insert({
            market_id: activeBet.mId,
            user_id: currentUser.id,
            user_name: currentUser.username,
            outcome_name: activeBet.oName,
            amount: amt,
            odds: activeBet.odds,
            type: activeBet.type
        });

        await _supabase.from('profiles').update({ [balField]: userProfile[balField] - amt }).eq('id', currentUser.id);
        await _supabase.from('markets').update({ take: mData.take - profit }).eq('id', activeBet.mId);

        location.reload();
    }

    function openSettle(mId, title) {
        currentSettleId = mId;
        _supabase.from('markets').select('*').eq('id', mId).single().then(({data}) => {
            currentSettleGroups = JSON.parse(data.note);
            document.getElementById('settle-title').innerText = title;
            let html = "";
            currentSettleGroups.forEach((g, gi) => {
                html += `<div class='market-group'><p>${g.title}</p>`;
                g.outcomes.forEach((o, oi) => {
                    html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                        <span>${o.n}</span>
                        <select class="settle-select" data-gi="${gi}" data-oi="${oi}" style="width:100px;">
                            <option value="lose">Lose</option>
                            <option value="win">Win</option>
                        </select>
                    </div>`;
                });
                html += `</div>`;
            });
            document.getElementById('settle-area').innerHTML = html;
            document.getElementById('settleModal').classList.remove('hidden');
        });
    }

    async function finalSubmitSettle() {
        let winName = "";
        document.querySelectorAll('.settle-select').forEach(s => {
            const gi = s.dataset.gi; const oi = s.dataset.oi;
            currentSettleGroups[gi].outcomes[oi].status = s.value;
            if(s.value === 'win') winName = currentSettleGroups[gi].outcomes[oi].n;
        });
        
        if(!winName) return alert("Select a winner!");

        try {
            const { data: mData } = await _supabase.from('markets').select('*').eq('id', currentSettleId).single();
            const hostName = mData.creator_name;
            const balField = mData.type === 'REAL' ? 'real_balance' : 'demo_balance';
            const { data: allBets } = await _supabase.from('bets').select('*').eq('market_id', currentSettleId);
            
            // JAVÍTOTT MATEK: Alapból a teljes stake jár vissza
            let hostRefundAmount = parseFloat(mData.stake);

            if (allBets) {
                allBets.forEach(bet => {
                    if (bet.outcome_name === winName) {
                        const playerProfit = bet.amount * (bet.odds - 1);
                        hostRefundAmount -= playerProfit;
                    } else {
                        hostRefundAmount += parseFloat(bet.amount);
                    }
                });
            }

            const { data: hostProf } = await _supabase.from('profiles').select('*').eq('username', hostName).single();

            if (hostProf && hostRefundAmount > 0) {
                await _supabase.from('profiles')
                    .update({ [balField]: hostProf[balField] + hostRefundAmount })
                    .eq('id', hostProf.id);
            }

            await _supabase.from('markets').update({ 
                note: JSON.stringify(currentSettleGroups), status: 'settled', winner: winName, start_time: new Date().toISOString()
            }).eq('id', currentSettleId);

            await _supabase.rpc('settle_market_payouts', { m_id: currentSettleId });
            
            location.reload();
        } catch (err) {
            console.error(err);
            alert("Error during settlement!");
        }
    }

    function showSection(s) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-links span').forEach(link => link.classList.remove('active'));
        document.getElementById('section-' + s).classList.add('active');
        document.getElementById('link-' + s).classList.add('active');
    }

    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); addGroup(); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); if(id==='createModal') document.getElementById('groups-container').innerHTML=""; }

    // --- EREDETI CREATE LOGIKA VISSZAÁLLÍTVA ---
    function addGroup() {
        const container = document.getElementById('groups-container');
        const id = "g-" + Date.now();
        const d = document.createElement('div'); d.className = 'market-group'; d.id = id;
        const isFirst = container.children.length === 0;
        const delBtn = !isFirst ? `<button onclick="this.parentElement.remove()" style="position:absolute;right:10px;top:10px;background:none;border:none;color:var(--danger);cursor:pointer">✕</button>` : '';
        d.innerHTML = `${delBtn}<input class="gt" placeholder="Category Name"><div id="o-cont-${id}"></div><button class="btn-bet" onclick="addO('${id}')" style="font-size:10px;margin-top:5px;border-style:dashed">+ Add Option</button>`;
        container.appendChild(d); addO(id); addO(id);
    }

    function addO(groupId) {
        const cont = document.getElementById('o-cont-' + groupId);
        const count = cont.children.length;
        const d = document.createElement('div'); d.style.display="flex"; d.style.gap="5px"; d.style.marginTop="5px"; d.style.alignItems="center";
        const delBtn = count >= 2 ? `<button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button>` : '';
        d.innerHTML = `<input class="on" placeholder="Outcome"><input class="oo" type="number" step="0.1" value="2.0" style="width:70px">${delBtn}`;
        cont.appendChild(d);
    }

    async function saveMarket() {
        const type = document.getElementById('m-type').value;
        const title = document.getElementById('m-name').value;
        const dl = document.getElementById('m-deadline').value;
        const budget = parseFloat(document.getElementById('m-budget').value);
        const balField = type === 'REAL' ? 'real_balance' : 'demo_balance';

        if(!title || !dl || budget <= 0) return alert("Fill everything!");
        if(userProfile[balField] < budget) return alert("Insufficient balance!");

        const groups = [];
        document.querySelectorAll('#groups-container .market-group').forEach(g => {
            const outcomes = [];
            g.querySelectorAll('div[style*="flex"]').forEach(row => {
                outcomes.push({ n: row.querySelector('.on').value, o: parseFloat(row.querySelector('.oo').value), status: 'pending' });
            });
            groups.push({ title: g.querySelector('.gt').value, outcomes });
        });

        await _supabase.from('markets').insert({
            title, deadline: new Date(dl).toISOString(), type,
            stake: budget, take: budget, creator_name: currentUser.username,
            note: JSON.stringify(groups), status: 'active'
        });

        await _supabase.from('profiles').update({ [balField]: userProfile[balField] - budget }).eq('id', currentUser.id);
        location.reload();
    }

    async function claimDailyDemo() {
        const btn = document.getElementById('btn-claim-reward');
        btn.disabled = true;
        const amount = Math.floor(Math.random() * 450) + 50;
        await _supabase.from('profiles').update({ demo_balance: userProfile.demo_balance + amount }).eq('id', currentUser.id);
        document.getElementById('reward-msg').innerText = `+${amount} Demo Coins added!`;
        setTimeout(() => location.reload(), 2000);
    }

    function logout() { localStorage.removeItem("user"); location.href="login.html"; }
</script>
</body>
</html>
