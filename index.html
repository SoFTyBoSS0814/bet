<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | P2P Cloud Betting</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --modal-bg: #f4f7f9; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        
        /* NAVBAR */
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 100; height: 70px; }
        .nav-left-group { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 15px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; text-decoration: none; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-info { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 15px; font-weight: bold; }
        
        .btn-logout { background: none; border: 1px solid #ff4444; color: #ff4444; padding: 0 15px; border-radius: 6px; cursor: pointer; font-size: 13px; height: 40px; transition: 0.2s; font-weight: bold; }

        /* MARKETS HEADER */
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-create-trigger { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }

        /* MARKET CARD */
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid var(--primary); position: relative; }
        .card-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; display: block; }
        .btn-edit-card { position: absolute; top: 15px; right: 15px; background: #334756; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        .odds-row { display: flex; gap: 12px; margin-top: 15px; }
        .odd-box { flex: 1; background: rgba(255,255,255,0.05); padding: 15px; text-align: center; border-radius: 8px; }
        .odd-box span { font-size: 12px; color: #888; display: block; }
        .odd-box b { font-size: 22px; color: var(--primary); }

        /* MODAL DESIGN (Based on image_6e3547.png) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal-box { background: var(--modal-bg); color: #333; padding: 30px; border-radius: 12px; width: 850px; max-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
        .modal-btn { padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 500; }
        .m-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        
        .settings-bar { background: #fff; border: 1px solid #e1e8ed; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 25px; margin-bottom: 25px; }
        .bar-item { display: flex; flex-direction: column; gap: 4px; }
        .bar-item label { font-size: 11px; color: #999; text-transform: uppercase; margin: 0; }
        
        .outcome-container { background: #fff; border: 1px solid #e1e8ed; border-radius: 10px; padding: 20px; }
        .outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .outcome-box { background: #f8f9fa; border: 1px solid #edf2f7; padding: 15px; border-radius: 8px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left-group">
        <a href="#" class="logo">STAKEFORGE</a>
        <div class="nav-links">
            <a id="link-markets" onclick="showSection('markets')" class="active">Markets</a>
            <a id="link-wallet" onclick="showSection('wallet')">Wallet</a>
            <a id="link-account" onclick="showSection('account')">Account</a>
            <a id="link-settings" onclick="showSection('settings')">Settings</a>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-info">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets">
        <div class="section-header">
            <h2>Live P2P Markets</h2>
            <button class="btn-create-trigger" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Töltés...</div>
    </div>
    </div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-header">
            <button class="modal-btn" style="background: #ececf1; color: #555;">📋 Beillesztés</button>
            <button class="modal-btn" style="background: #2c5282; color: white;" onclick="handleMarketSubmit()">💾 Mentés</button>
            <button class="modal-btn" style="background: #e53e3e; color: white;" onclick="closeModals()">❌ Mégse</button>
        </div>

        <input type="hidden" id="edit-id">
        
        <div style="display: flex; gap: 20px;">
            <div style="flex: 2;" class="input-group">
                <label>Esemény címe *</label>
                <input id="m-title" class="m-input" placeholder="pl. Gerwyn Price vs Luke Littler">
            </div>
            <div style="flex: 1;" class="input-group">
                <label>Határidő *</label>
                <input id="m-deadline" type="datetime-local" class="m-input">
            </div>
        </div>

        <div class="input-group">
            <label>Leírás / Szabályok</label>
            <textarea id="m-note" class="m-input" rows="3" placeholder="Például: Csak rendes játékidő..."></textarea>
        </div>

        <div class="settings-bar">
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="m-full-bal" style="width: 18px; cursor: pointer;">
                <span style="font-size: 14px; color: #444;">Teljes egyenleg</span>
            </div>
            <div class="bar-item">
                <label>Költségvetés</label>
                <input id="m-vol" type="number" style="width: 90px; padding: 5px; border: 1px solid #ccc; border-radius: 4px;" value="1000">
            </div>
            <div class="bar-item">
                <label>Számla típusa</label>
                <select id="m-type" onchange="refreshBalances()" style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="REAL">Valódi pénz (€)</option>
                    <option value="DEMO" selected>DEMO számla (D)</option>
                </select>
            </div>
            <div style="flex-grow: 1; text-align: right;">
                <span id="m-max-display" style="font-size: 13px; font-weight: bold; color: #2c5282;">Egyenleg: 0.00</span>
            </div>
        </div>

        <div class="outcome-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-weight: bold; color: #2c5282;">Mérkőzés győztese</span>
                <button style="background: #f0f4f8; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">➕ Új csoport</button>
            </div>
            
            <div class="outcome-grid">
                <div class="outcome-box">
                    <label style="font-size: 11px; color: #999;">Kimenetel (1)</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input id="m-o1-name" class="m-input" style="padding: 8px;" value="Hazai">
                        <input id="m-o1" type="number" step="0.01" class="m-input" style="width: 80px; padding: 8px; text-align: center;" placeholder="1.00">
                    </div>
                </div>
                <div class="outcome-box" id="box-x">
                    <label style="font-size: 11px; color: #999;">Kimenetel (X)</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input id="m-ox-name" class="m-input" style="padding: 8px;" value="Döntetlen">
                        <input id="m-ox" type="number" step="0.01" class="m-input" style="width: 80px; padding: 8px; text-align: center;" placeholder="0">
                    </div>
                </div>
                <div class="outcome-box">
                    <label style="font-size: 11px; color: #999;">Kimenetel (2)</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input id="m-o2-name" class="m-input" style="padding: 8px;" value="Vendég">
                        <input id="m-o2" type="number" step="0.01" class="m-input" style="width: 80px; padding: 8px; text-align: center;" placeholder="1.00">
                    </div>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; border: 2px dashed #e1e8ed; border-radius: 8px; cursor: pointer; color: #aaa;">
                    ➕ Még több
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));
    let balances = { REAL: 0, DEMO: 0 };

    window.onload = async () => {
        if(!currentUser) return window.location.href="login.html";
        await refreshBalances();
        fetchMarkets();
    };

    function showSection(id) {
        // Egyszerűsített váltó logika
        alert("Szekció váltás: " + id);
    }

    async function refreshBalances() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            balances.REAL = data.real_balance;
            balances.DEMO = data.demo_balance;
            document.getElementById("nav-real").innerText = balances.REAL.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = balances.DEMO.toFixed(2) + " D";
            const type = document.getElementById("m-type").value;
            document.getElementById("m-max-display").innerText = "Egyenleg: " + (type === 'REAL' ? balances.REAL.toFixed(2) + ' €' : balances.DEMO.toFixed(2) + ' D');
        }
    }

    function openCreateModal() {
        document.getElementById("createModal").classList.remove("hidden");
        refreshBalances();
    }

    function closeModals() { document.getElementById("createModal").classList.add("hidden"); }

    async function handleMarketSubmit() {
        const vol = parseFloat(document.getElementById("m-vol").value);
        const type = document.getElementById("m-type").value;
        const currentBal = balances[type];

        if(vol > currentBal) return alert("Nincs elég fedezet a számlán!");

        const payload = {
            title: document.getElementById("m-title").value,
            note: document.getElementById("m-note").value,
            odd_1: parseFloat(document.getElementById("m-o1").value),
            odd_x: parseFloat(document.getElementById("m-ox").value) || null,
            odd_2: parseFloat(document.getElementById("m-o2").value),
            start_time: new Date(document.getElementById("m-deadline").value).toISOString(),
            creator_name: currentUser.username,
            type: type,
            max_stake: vol
        };

        const { error } = await _supabase.from('markets').insert([payload]);
        if(error) alert("Hiba: " + error.message);
        else location.reload();
    }

    async function fetchMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById("market-list");
        list.innerHTML = "";
        data.forEach(m => {
            const isMe = m.creator_name === currentUser.username;
            list.innerHTML += `
                <div class="card">
                    ${isMe ? `<button class="btn-edit-card">EDIT</button>` : ''}
                    <span class="card-title">${m.title}</span>
                    <span style="font-size:12px; color:#888;">Létrehozta: ${m.creator_name} | Típus: ${m.type}</span>
                    <div class="odds-row">
                        <div class="odd-box"><span>1</span><b>${m.odd_1}</b></div>
                        ${m.odd_x ? `<div class="odd-box"><span>X</span><b>${m.odd_x}</b></div>` : ''}
                        <div class="odd-box"><span>2</span><b>${m.odd_2}</b></div>
                    </div>
                </div>`;
        });
    }

    function logout() { localStorage.removeItem("user"); location.reload(); }
</script>
</body>
</html>
