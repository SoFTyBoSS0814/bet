<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; text-decoration: none; letter-spacing: 1px; }
        .nav-links span { color: #aaa; text-decoration: none; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; }
        .nav-links span.active { color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-meta { display: flex; gap: 15px; font-size: 11px; color: #8899a6; margin-top: 5px; text-transform: uppercase; }
        .market-meta span b { color: var(--primary); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid #2c4f60; }
        
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; }

        .market-group { background: rgba(255,255,255,0.03); border: 1px solid #2c4f60; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .outcome-item { background: #14212b; padding: 12px; border-radius: 8px; border: 1px solid #253948; position: relative; }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: none; border: 1px dashed #444; color: #888; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; }
        
        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; }
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-bet:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.1); }
        
        .wallet-card { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #2c4f60; text-align: center; }
        .warning-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--demo); color: var(--demo); padding: 20px; border-radius: 10px; margin-top: 30px; font-weight: bold; }
        
        .hidden { display: none !important; }
        .max-badge { background: #334756; color: var(--primary); padding: 2px 6px; border-radius: 4px; cursor: pointer; margin-left: 10px; font-size: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <div class="logo" onclick="window.location.reload()">STAKEFORGE</div>
        <div class="nav-links">
            <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
            <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
            <span id="link-account" onclick="showSection('account')">Account</span>
            <span id="link-settings" onclick="showSection('settings')">Settings</span>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button id="logout-btn" class="btn-danger" style="background:#441111" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Betöltés...</div>
    </div>

    <div id="section-wallet" class="section">
        <div class="wallet-card">
            <h2>Egyenlegek</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px;">
                <div style="background: rgba(0, 212, 255, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--primary);">
                    <small style="color: var(--primary); font-weight: bold;">REAL WALLET</small>
                    <h1 id="wallet-real" style="color: var(--primary); margin: 10px 0;">0.00 €</h1>
                </div>
                <div style="background: rgba(255, 204, 0, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--demo);">
                    <small style="color: var(--demo); font-weight: bold;">DEMO WALLET</small>
                    <h1 id="wallet-demo" style="color: var(--demo); margin: 10px 0;">0.00 D</h1>
                </div>
            </div>
            <div class="warning-box">⚠️ Magyarország területén a BE/KI-fizetés tiltva van.</div>
        </div>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0; color:var(--primary);">New Event</h2>
            <div style="display:flex; gap:10px;">
                <button class="btn-primary" id="final-save-btn" onclick="saveMarket()">💾 Save & Pay</button>
                <button class="btn-danger" onclick="closeModal()">Cancel</button>
            </div>
        </div>
        <label>Event Name</label><input id="m-name" placeholder="Pl: Madrid - City">
        <label>Deadline</label><input id="m-date" type="datetime-local">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; margin-bottom:20px;">
            <div>
                <label>Type</label>
                <select id="m-type" onchange="updateAvailableDisplay()">
                    <option value="DEMO">DEMO</option>
                    <option value="REAL">REAL</option>
                </select>
            </div>
            <div>
                <label>Budget (Liquidity) <span class="max-badge" onclick="setMaxBudget()">MAX</span></label>
                <input id="m-budget" type="number" value="1000">
                <small id="available-info" style="display:block; margin-top:-10px; font-weight:bold;"></small>
            </div>
        </div>
        
        <div id="groups-container"></div>
        <button class="btn-outline" onclick="addGroup()">+ Add Market Group</button>
    </div>
</div>

<script>
    // --- KONFIGURÁCIÓ ---
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let groupIdx = 0;

    // --- PROFIL ÉS EGYENLEG ---
    async function fetchProfile() {
        if(!currentUser) return;
        const { data, error } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            userProfile = data;
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
            if(document.getElementById("wallet-real")) {
                document.getElementById("wallet-real").innerText = data.real_balance.toFixed(2) + " €";
                document.getElementById("wallet-demo").innerText = data.demo_balance.toFixed(2) + " D";
            }
            updateAvailableDisplay();
        }
    }

    function updateAvailableDisplay() {
        const info = document.getElementById('available-info');
        const type = document.getElementById('m-type').value;
        if(!userProfile || !info) return;
        
        if(type === 'REAL') {
            info.innerText = `Max: ${userProfile.real_balance.toFixed(2)} €`;
            info.style.color = 'var(--primary)';
        } else {
            info.innerText = `Max: ${userProfile.demo_balance.toFixed(2)} D`;
            info.style.color = 'var(--demo)';
        }
    }

    function setMaxBudget() {
        if(!userProfile) return;
        const type = document.getElementById('m-type').value;
        document.getElementById('m-budget').value = (type === 'REAL' ? userProfile.real_balance : userProfile.demo_balance);
    }

    // --- PIAC MENTÉSE ---
    async function saveMarket() {
        const btn = document.getElementById('final-save-btn');
        if(!currentUser || !userProfile) return alert("Hiba: Nincs bejelentkezett felhasználó!");

        const name = document.getElementById('m-name').value;
        const budgetVal = parseFloat(document.getElementById('m-budget').value);
        const type = document.getElementById('m-type').value;
        const deadline = document.getElementById('m-date').value;

        if(!name) return alert("Adj nevet az eseménynek!");
        if(isNaN(budgetVal) || budgetVal <= 0) return alert("Érvénytelen büdzsé!");

        const balanceField = (type === 'REAL' ? 'real_balance' : 'demo_balance');
        if (budgetVal > userProfile[balanceField]) {
            return alert("Nincs elég egyenleged!");
        }

        btn.disabled = true;
        btn.innerText = "Saving...";

        // 1. Csoportok összeszedése
        const groups = [];
        document.querySelectorAll('.market-group').forEach(g => {
            const outcomes = [];
            g.querySelectorAll('.outcome-item').forEach(i => {
                outcomes.push({ 
                    n: i.querySelector('.o-n').value || "Névtelen", 
                    o: parseFloat(i.querySelector('.o-o').value) || 1.0 
                });
            });
            groups.push({ title: g.querySelector('.g-title').value || "Csoport", outcomes });
        });

        try {
            // 2. Levonás a profilból
            const { error: upErr } = await _supabase.from('profiles')
                .update({ [balanceField]: userProfile[balanceField] - budgetVal })
                .eq('id', currentUser.id);

            if(upErr) throw upErr;

            // 3. Piac beszúrása
            const { error: insErr } = await _supabase.from('markets').insert([{
                title: name,
                type: type,
                take: budgetVal,
                note: JSON.stringify(groups),
                creator_name: currentUser.username,
                created_at: deadline || new Date().toISOString()
            }]);

            if(insErr) throw insErr;

            alert("Sikeres mentés és fizetés!");
            closeModal();
            await fetchProfile();
            loadMarkets();

        } catch (err) {
            alert("Hiba történt: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "💾 Save & Pay";
        }
    }

    // --- UI FUNKCIÓK ---
    async function loadMarkets() {
        const { data, error } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        list.innerHTML = "";
        
        data?.forEach(m => {
            let groups = JSON.parse(m.note || "[]");
            const dateStr = new Date(m.created_at).toLocaleString('hu-HU', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <div style="padding:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <h3 style="margin:0;">${m.title}</h3>
                            <div class="market-meta"><span>Host: <b>${m.creator_name}</b></span><span>Kezdés: <b>${dateStr}</b></span></div>
                        </div>
                        <div style="text-align:right;">
                            <b style="color:${m.type==='REAL'?'var(--primary)':'var(--demo)'}">${m.type}</b>
                            <div style="font-size:13px; font-weight:bold; margin-top:5px;">Budget: <span style="color:var(--primary)">${m.take} ${m.type==='REAL'?'€':'D'}</span></div>
                        </div>
                    </div>
                </div>`;
            list.appendChild(card);
        });
    }

    function addGroup() {
        groupIdx++;
        const div = document.createElement('div');
        div.className = 'market-group';
        div.innerHTML = `<input class="g-title" placeholder="Piac csoport (pl. Szögletek)"><div id="grid-${groupIdx}" class="outcomes-grid"></div><button class="btn-outline" onclick="addOutcome(${groupIdx})">+ Új kimenetel</button>`;
        document.getElementById('groups-container').appendChild(div);
        addOutcome(groupIdx);
    }

    function addOutcome(id) {
        const div = document.createElement('div');
        div.className = 'outcome-item';
        div.innerHTML = `<input class="o-n" placeholder="Név"><input class="o-o" type="number" step="0.01" value="1.50">`;
        document.getElementById(`grid-${id}`).appendChild(div);
    }

    function openCreateModal() { 
        document.getElementById("createModal").classList.remove("hidden"); 
        document.getElementById('groups-container').innerHTML = ""; 
        addGroup(); 
        updateAvailableDisplay();
    }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links span').forEach(l => l.classList.remove('active'));
        document.getElementById('section-'+id).classList.add('active');
        document.getElementById('link-'+id).classList.add('active');
    }
    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }

    window.onload = () => { fetchProfile(); loadMarkets(); };
</script>
</body>
</html>
