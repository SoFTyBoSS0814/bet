<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Cloud P2P Betting</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #2c4f60;
            --dark: #1a2a33;
            --bg: #0f171e;
            --text: #ffffff;
            --card-bg: #1d2d3a;
            --success: #00ff88;
            --error: #ff4444;
            --warning: #ffa500;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .navbar { background: var(--dark); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--secondary); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 26px; color: var(--primary); text-transform: uppercase; cursor: pointer; }
        .logo span { color: #fff; font-weight: 300; }
        .nav-buttons { display: flex; align-items: center; gap: 12px; }
        button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-top: 15px; border-left: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .odds { display: flex; gap: 12px; margin-top: 15px; }
        .odd { flex: 1; background: #2a3e4d; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #3d5a6d; }
        .odd:hover { border-color: var(--primary); background: #344a5c; }
        .odd b { color: var(--primary); font-size: 20px; display: block; margin-top: 5px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; z-index: 1000; }
        .hidden { display:none; }
        .modal-box { background: var(--card-bg); padding: 35px; border-radius: 15px; width: 420px; border: 1px solid var(--secondary); }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0f171e; border: 1px solid #334756; color: white; border-radius: 8px; box-sizing: border-box; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .badge-real { background: rgba(0, 212, 255, 0.15); color: var(--primary); }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">STAKE<span>FORGE</span></div>
    <div class="nav-buttons">
        <div id="guestButtons">
            <button class="btn-outline" onclick="openModal('loginModal')">Login</button>
            <button class="btn-primary" onclick="openModal('registerModal')">Register</button>
        </div>
        <div id="userArea" style="display:none;">
            <span id="navUsername" style="margin-right:15px; font-weight:bold; color:var(--primary);"></span>
            <button class="btn-outline" onclick="logout()">Logout</button>
        </div>
    </div>
</div>

<div class="container">
    <h2>Live P2P Markets</h2>
    <div id="market-list">Betöltés a felhőből...</div>
</div>

<div id="registerModal" class="modal hidden">
    <div class="modal-box">
        <h3>Regisztráció</h3>
        <input id="regUser" placeholder="Felhasználónév">
        <input id="regEmail" placeholder="Email cím">
        <input id="regPass" type="password" placeholder="Jelszó">
        <button class="btn-primary" style="width:100%" onclick="handleRegister()">Fiók létrehozása</button>
        <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModals()">Mégse</button>
    </div>
</div>

<div id="loginModal" class="modal hidden">
    <div class="modal-box">
        <h3>Bejelentkezés</h3>
        <input id="loginEmail" placeholder="Email cím">
        <input id="loginPass" type="password" placeholder="Jelszó">
        <button class="btn-primary" style="width:100%" onclick="handleLogin()">Belépés</button>
        <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModals()">Bezár</button>
    </div>
</div>

<script>
    // --- SUPABASE KAPCSOLAT (MINDEN KITÖLTVE) ---
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; //
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; //
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let user = JSON.parse(localStorage.getItem("user"));

    window.onload = () => {
        if(user) updateUI();
        loadMarkets();
    };

    // REGISZTRÁCIÓ A FELHŐBE
    async function handleRegister() {
        const u = document.getElementById('regUser').value;
        const e = document.getElementById('regEmail').value;
        const p = document.getElementById('regPass').value;

        const { data, error } = await _supabase.from('profiles').insert([
            { username: u, email: e, password: p, real_balance: 0, demo_balance: 5000 }
        ]);

        if (error) {
            alert("Hiba: " + error.message);
        } else {
            alert("Sikeres regisztráció a felhőben! Most már bejelentkezhetsz.");
            closeModals();
        }
    }

    // BEJELENTKEZÉS
    async function handleLogin() {
        const e = document.getElementById('loginEmail').value;
        const p = document.getElementById('loginPass').value;

        const { data, error } = await _supabase
            .from('profiles')
            .select('*')
            .eq('email', e)
            .eq('password', p)
            .single();

        if (data) {
            user = data;
            localStorage.setItem("user", JSON.stringify(user));
            updateUI();
            closeModals();
            location.reload();
        } else {
            alert("Hiba: Helytelen email vagy jelszó!");
        }
    }

    // PIACOK BETÖLTÉSE (HOGY MINDENKI LÁSSA)
    async function loadMarkets() {
        const { data, error } = await _supabase.from('markets').select('*'); //
        const list = document.getElementById('market-list');
        
        if (error) {
            list.innerHTML = "Szerver hiba a piacok betöltésekor.";
            return;
        }

        list.innerHTML = data.length ? "" : "Jelenleg nincsenek aktív piacok.";
        data.forEach(m => {
            const isOwner = user && m.creator_name === user.username;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between">
                    <div>
                        <b style="font-size:18px;">${m.title}</b><br>
                        <small style="color:#888">Készítő: ${m.creator_name} ${isOwner ? '(TE)' : ''}</small>
                    </div>
                    <span class="badge badge-real">Pool: ${m.stake} €</span>
                </div>
                <div class="odds" style="${isOwner ? 'opacity:0.5; pointer-events:none;' : ''}">
                    <div class="odd" onclick="placeBet('${m.title}', ${m.odd_1})">1<b>${m.odd_1}</b></div>
                    <div class="odd" onclick="placeBet('${m.title}', ${m.odd_x})">X<b>${m.odd_x}</b></div>
                    <div class="odd" onclick="placeBet('${m.title}', ${m.odd_2})">2<b>${m.odd_2}</b></div>
                </div>
                ${isOwner ? '<p style="color:var(--error); font-size:12px; margin-top:10px; font-weight:bold;">Saját eseményre nem fogadhatsz!</p>' : ''}
            `;
            list.appendChild(card);
        });
    }

    function placeBet(title, odd) {
        if(!user) return openModal('loginModal');
        alert(`Fogadás elküldve a központi adatbázisba!\nEsemény: ${title}\nOdds: ${odd}`);
    }

    function updateUI() {
        document.getElementById("guestButtons").style.display = "none";
        document.getElementById("userArea").style.display = "flex";
        document.getElementById("navUsername").innerText = user.username;
    }

    function logout() { localStorage.removeItem("user"); location.reload(); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }
</script>
</body>
</html>
