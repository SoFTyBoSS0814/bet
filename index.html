<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | P2P Betting Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1a2a33; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .odds { display: flex; gap: 10px; margin-top: 15px; }
        .odd { flex: 1; background: #2a3e4d; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .odd:hover { border-color: var(--primary); background: #344a5c; }
        .odd b { color: var(--primary); font-size: 20px; display: block; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 9px 19px; border-radius: 6px; cursor: pointer; }
        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 15px; width: 400px; border: 1px solid #2c4f60; }
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 12px; color: #888; font-weight: bold; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">STAKEFORGE</div>
    <div id="logged-out-ui">
        <button onclick="openModal('loginModal')" style="background:none; color:white; border:none; cursor:pointer; margin-right:15px;">Login</button>
        <button class="btn-primary" onclick="openModal('regModal')">Register</button>
    </div>
    <div id="logged-in-ui" class="hidden">
        <button class="btn-primary" onclick="openModal('createModal')" style="margin-right:15px;">+ Create Market</button>
        <span id="user-display" style="font-weight: bold; color: var(--primary); margin-right: 15px;"></span>
        <button onclick="logout()" style="background:none; border: 1px solid #ff4444; color:#ff4444; padding:5px 10px; border-radius:4px; cursor:pointer;">Logout</button>
    </div>
</div>

<div class="container">
    <h2>Live P2P Markets</h2>
    <div id="market-list">Kapcsolódás a felhőhöz...</div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>Új Piac Létrehozása</h3>
        <label>Esemény neve</label>
        <input id="m-title" placeholder="pl. Taktaszada vs Taktaharkány">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>Típus</label>
                <select id="m-type">
                    <option value="REAL">REAL Account</option>
                    <option value="DEMO">DEMO Account</option>
                </select>
            </div>
            <div style="flex:1;">
                <label>Max Tét (€)</label>
                <input id="m-max" type="number" value="1000">
            </div>
        </div>

        <label>Fogadási határidő (Deadline)</label>
        <input id="m-deadline" type="datetime-local">
        
        <label>Oddsok (1 - X - 2)</label>
        <div style="display:flex; gap:5px;">
            <input id="m-o1" type="number" step="0.01" placeholder="1.5">
            <input id="m-ox" type="number" step="0.01" placeholder="3.2">
            <input id="m-o2" type="number" step="0.01" placeholder="2.1">
        </div>
        
        <button class="btn-primary" style="width:100%; margin-top:10px;" onclick="handleCreateMarket()">Piac Megnyitása</button>
        <p onclick="closeModals()" style="text-align:center; cursor:pointer; color:#888; margin-top:15px; font-size:14px;">Mégse</p>
    </div>
</div>

<div id="regModal" class="modal hidden">
    <div class="modal-box">
        <h3>Regisztráció</h3>
        <input id="r-user" placeholder="Felhasználónév">
        <input id="r-email" placeholder="Email cím">
        <input id="r-pass" type="password" placeholder="Jelszó">
        <button class="btn-primary" style="width:100%" onclick="handleRegister()">Fiók létrehozása</button>
        <p onclick="closeModals()" style="text-align:center; cursor:pointer; color:#888; margin-top:15px;">Bezár</p>
    </div>
</div>

<div id="loginModal" class="modal hidden">
    <div class="modal-box">
        <h3>Bejelentkezés</h3>
        <input id="l-email" placeholder="Email">
        <input id="l-pass" type="password" placeholder="Jelszó">
        <button class="btn-primary" style="width:100%" onclick="handleLogin()">Belépés</button>
        <p onclick="closeModals()" style="text-align:center; cursor:pointer; color:#888; margin-top:15px;">Bezár</p>
    </div>
</div>

<script>
    // --- SUPABASE KONFIGURÁCIÓ ---
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));

    window.onload = () => {
        updateUI();
        fetchMarkets();
    };

    function updateUI() {
        if (currentUser) {
            document.getElementById("logged-out-ui").classList.add("hidden");
            document.getElementById("logged-in-ui").classList.remove("hidden");
            document.getElementById("user-display").innerText = currentUser.username;
        } else {
            document.getElementById("logged-out-ui").classList.remove("hidden");
            document.getElementById("logged-in-ui").classList.add("hidden");
        }
    }

    // PIACOK BETÖLTÉSE
    async function fetchMarkets() {
        const list = document.getElementById("market-list");
        const { data, error } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        
        if (error) {
            list.innerHTML = "Hiba a kapcsolódáskor. Ellenőrizd az RLS beállításokat!";
            return;
        }

        list.innerHTML = data.length ? "" : "Jelenleg nincsenek aktív piacok. Hozz létre egyet!";
        
        data.forEach(m => {
            const isMe = currentUser && m.creator_name === currentUser.username;
            const deadline = m.start_time ? new Date(m.start_time).toLocaleString('hu-HU') : "Nincs megadva";
            
            list.innerHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div>
                            <b style="font-size:18px;">${m.title}</b><br>
                            <small style="color:#888">Deadline: ${deadline}</small>
                        </div>
                        <div style="text-align:right;">
                            <span style="background:var(--primary); color:#000; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">MAX: ${m.max_stake}€</span><br>
                            <small style="color:var(--primary); font-weight:bold;">${m.type}</small>
                        </div>
                    </div>
                    <div class="odds" style="${isMe ? 'opacity:0.3; pointer-events:none;' : ''}">
                        <div class="odd" onclick="bet('${m.title}', ${m.odd_1})">1<b>${m.odd_1}</b></div>
                        <div class="odd" onclick="bet('${m.title}', ${m.odd_x})">X<b>${m.odd_x}</b></div>
                        <div class="odd" onclick="bet('${m.title}', ${m.odd_2})">2<b>${m.odd_2}</b></div>
                    </div>
                    ${isMe ? '<small style="color:#ff4444; display:block; margin-top:10px; font-weight:bold;">Saját piacaidat csak nézheted.</small>' : ''}
                </div>`;
        });
    }

    // ÚJ PIAC MENTÉSE
    async function handleCreateMarket() {
        const title = document.getElementById("m-title").value;
        const deadline = document.getElementById("m-deadline").value;
        const maxStake = document.getElementById("m-max").value;

        if(!title || !deadline || !currentUser) {
            alert("Hiányzó adatok!");
            return;
        }

        const { error } = await _supabase.from('markets').insert([{
            title: title,
            creator_name: currentUser.username,
            type: document.getElementById("m-type").value,
            stake: 0, 
            max_stake: parseFloat(maxStake),
            start_time: new Date(deadline).toISOString(),
            odd_1: parseFloat(document.getElementById("m-o1").value) || 1.0,
            odd_x: parseFloat(document.getElementById("m-ox").value) || 1.0,
            odd_2: parseFloat(document.getElementById("m-o2").value) || 1.0
        }]);

        if (error) alert("Hiba: " + error.message);
        else { 
            closeModals(); 
            fetchMarkets(); 
            alert("Piac sikeresen létrehozva!");
        }
    }

    // AUTH FUNKCIÓK
    async function handleRegister() {
        const u = document.getElementById("r-user").value;
        const e = document.getElementById("r-email").value;
        const p = document.getElementById("r-pass").value;

        const { error } = await _supabase.from('profiles').insert([{ username: u, email: e, password: p }]);
        if (error) alert(error.message);
        else { alert("Sikeres regisztráció! Jelentkezz be."); closeModals(); }
    }

    async function handleLogin() {
        const e = document.getElementById("l-email").value;
        const p = document.getElementById("l-pass").value;

        const { data, error } = await _supabase.from('profiles').select('*').eq('email', e).eq('password', p).single();
        if (data) {
            currentUser = data;
            localStorage.setItem("user", JSON.stringify(data));
            location.reload();
        } else alert("Hiba: Helytelen adatok!");
    }

    function bet(title, odd) {
        if (!currentUser) return openModal('loginModal');
        alert("Fogadás rögzítve: " + title + " (" + odd + ")");
    }

    function logout() { localStorage.removeItem("user"); location.reload(); }
    function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
    function closeModals() { document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden")); }
</script>

</body>
</html>
