<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Liquidity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; cursor: pointer; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }

        .settled-badge { position: absolute; top: 15px; left: 15px; background: #555; color: #fff; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); margin-top: 5px; border-radius: 8px; font-size: 13px; }
        .history-item.winner-row { border-left: 3px solid var(--success); background: rgba(40, 167, 69, 0.1); color: var(--success); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-primary" style="width:auto; padding:10px 25px;" onclick="openCreateModal()">+ CREATE MARKET</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>

    <div id="section-history" class="section">
        <h2>Settled Markets</h2>
        <div id="history-list"></div>
    </div>

    <div id="section-wallet" class="section">
        <div class="market-card" style="max-width:500px; margin:auto; text-align:center;">
            <h2>Wallet Balances</h2>
            <div style="display:flex; gap:10px; margin:20px 0;">
                <div style="flex:1; padding:20px; border:1px solid var(--border); border-radius:15px;">
                    <small>REAL</small><h2 id="w-real" style="color:var(--primary)">0.00 €</h2>
                </div>
                <div style="flex:1; padding:20px; border:1px solid var(--border); border-radius:15px;">
                    <small>DEMO</small><h2 id="w-demo" style="color:var(--demo)">0.00 D</h2>
                </div>
            </div>
            <button id="btn-claim-reward" class="btn-primary" onclick="claimDailyDemo()">CLAIM DAILY REWARD</button>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="market-card" style="max-width:400px; margin:auto;">
            <h2>Account</h2>
            <p>User: <b id="acc-username">-</b></p>
            <button class="btn-bet" onclick="logout()" style="color:var(--danger); border-color:var(--danger); margin-top:20px;">LOG OUT</button>
        </div>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10">
        <button class="btn-primary" onclick="placeBet()">PLACE BET</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')">Cancel</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>Create Market</h3>
        <select id="m-type"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select>
        <input id="m-name" placeholder="Title">
        <input id="m-budget" type="number" placeholder="Liquidity Pool">
        <input id="m-deadline" type="datetime-local">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px">+ Add Group</button>
        <button class="btn-primary" style="margin-top:20px" onclick="saveMarket()">CREATE</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="settle-title"></h3>
        <div id="settle-area"></div>
        <button class="btn-primary" id="finalize-btn" style="margin-top:20px; background:var(--success)" onclick="finalSubmitSettle()">FINALIZE & PAYOUT</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('settleModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co';
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let activeBet = null;
    let currentSettleId = null;
    let currentSettleGroups = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("w-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("w-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("acc-username").innerText = currentUser.username;
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list'), hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            if(m.status === 'active') {
                const card = document.createElement('div'); card.className = 'market-card';
                card.innerHTML = `<div class="market-header"><div><h2>${m.title}</h2><small>Host: ${m.creator_name} | Pool: ${parseFloat(m.take).toFixed(2)}</small></div>
                ${m.creator_name === currentUser.username ? `<button onclick="openSettle('${m.id}','${m.title}')" class="btn-primary" style="width:auto; padding:5px 15px;">SETTLE</button>` : ''}</div>
                ${groups.map(g => `<div class="market-group"><small>${g.title}</small><div class="outcomes-grid">
                ${g.outcomes.map(o => `<button class="btn-bet" onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}')">${o.n}<br><b>${o.o}</b></button>`).join('')}</div></div>`).join('')}`;
                mList.appendChild(card);
            } else {
                const card = document.createElement('div'); card.className = 'market-card';
                card.innerHTML = `<div class="settled-badge">Settled</div><h2 style="margin-top:15px;">${m.title}</h2>
                ${groups.map(g => `<div class="market-group"><small>${g.title}</small>
                ${g.outcomes.map(o => `<div class="history-item ${o.status==='win'?'winner-row':''}"><span>${o.n}</span><b>${o.status.toUpperCase()}</b></div>`).join('')}</div>`).join('')}`;
                hList.appendChild(card);
            }
        });
    }

    // --- LOGIKA JAVÍTÁS START ---

    async function finalSubmitSettle() {
        const btn = document.getElementById('finalize-btn');
        btn.disabled = true;
        btn.innerText = "Processing...";

        let winners = [];
        document.querySelectorAll('.settle-select').forEach(s => {
            currentSettleGroups[s.dataset.gi].outcomes[s.dataset.oi].status = s.value;
            if(s.value === 'win') winners.push(currentSettleGroups[s.dataset.gi].outcomes[s.dataset.oi].n);
        });

        try {
            const { data: mData } = await _supabase.from('markets').select('*').eq('id', currentSettleId).single();
            const field = mData.type === 'REAL' ? 'real_balance' : 'demo_balance';
            
            // A Host profitja alapból a maradék Liquidity Pool
            let hostPayout = parseFloat(mData.take) || 0;

            // Fogadások lekérése
            const { data: bets } = await _supabase.from('bets').select('*').eq('market_id', currentSettleId).eq('status', 'pending');
            
            if(bets && bets.length > 0) {
                // FONTOS: for...of ciklus kell az await-hez!
                for(let bet of bets) {
                    const isWin = winners.includes(bet.outcome_name);
                    
                    if(isWin) {
                        // Ha nyert a fogadó, kifizetjük neki (tét * odds)
                        const payoutAmount = parseFloat(bet.amount) * parseFloat(bet.odds);
                        const { data: p } = await _supabase.from('profiles').select(field).eq('id', bet.user_id).single();
                        await _supabase.from('profiles').update({ [field]: parseFloat(p[field]) + payoutAmount }).eq('id', bet.user_id);
                    } else {
                        // Ha vesztett a fogadó, a tétje visszaszáll a hostra
                        hostPayout += parseFloat(bet.amount);
                    }
                    // Fogadás státuszának frissítése
                    await _supabase.from('bets').update({ status: isWin ? 'win' : 'loss' }).eq('id', bet.id);
                }
            }

            // Host kifizetése (Pool + vesztes tétek)
            const { data: host } = await _supabase.from('profiles').select(field).eq('username', mData.creator_name).single();
            if(host) {
                await _supabase.from('profiles').update({ [field]: parseFloat(host[field]) + hostPayout }).eq('username', mData.creator_name);
            }

            // Piac lezárása
            await _supabase.from('markets').update({ note: JSON.stringify(currentSettleGroups), status: 'settled', take: 0 }).eq('id', currentSettleId);
            
            alert("Settlement Complete!");
            location.reload();

        } catch(e) {
            console.error(e);
            btn.disabled = false;
            btn.innerText = "Error - Try Again";
        }
    }

    async function placeBet() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        const f = activeBet.t === 'REAL' ? 'real_balance' : 'demo_balance';
        const { data: mData } = await _supabase.from('markets').select('take').eq('id', activeBet.mId).single();
        const potentialProfit = amt * (activeBet.o - 1);
        
        if(amt > userProfile[f]) return alert("Insufficient Balance!");
        if(potentialProfit > mData.take) return alert("Pool too small for this bet!");

        // 1. Fogadás rögzítése
        const { error: betErr } = await _supabase.from('bets').insert([{ 
            user_id: currentUser.id, 
            market_id: activeBet.mId, 
            outcome_name: activeBet.n, 
            amount: amt, 
            odds: activeBet.o, 
            status: 'pending' 
        }]);

        if(!betErr) {
            // 2. Egyenleg levonás
            await _supabase.from('profiles').update({ [f]: userProfile[f] - amt }).eq('id', currentUser.id);
            // 3. Pool csökkentése (potenciális profittal)
            await _supabase.from('markets').update({ take: mData.take - potentialProfit }).eq('id', activeBet.mId);
            location.reload();
        }
    }

    // --- LOGIKA VÉGE ---

    function addGroup() {
        const id = "g-" + Date.now();
        const d = document.createElement('div'); d.className = 'market-group'; d.id = id;
        d.innerHTML = `<input class="gt" placeholder="Group Title"><div id="o-cont-${id}"></div><button onclick="addO('${id}')">+ Outcome</button>`;
        document.getElementById('groups-container').appendChild(d); addO(id);
    }
    function addO(gid) {
        const c = document.getElementById('o-cont-'+gid);
        const d = document.createElement('div'); d.style.display="flex"; d.style.gap="5px"; d.style.marginTop="5px";
        d.innerHTML = `<input class="on" placeholder="Name"><input class="oo" type="number" step="0.1" value="2.0" style="width:70px">`;
        c.appendChild(d);
    }
    async function saveMarket() {
        const t = document.getElementById('m-name').value, b = parseFloat(document.getElementById('m-budget').value), dl = document.getElementById('m-deadline').value, type = document.getElementById('m-type').value;
        const f = type === 'REAL' ? 'real_balance' : 'demo_balance';
        if(b > userProfile[f]) return alert("No funds!");
        const grp = Array.from(document.querySelectorAll('#groups-container .market-group')).map(g => ({
            title: g.querySelector('.gt').value,
            outcomes: Array.from(g.querySelectorAll('div[id^="o-cont-"] > div')).map(o => ({ n: o.querySelector('.on').value, o: parseFloat(o.querySelector('.oo').value), status: 'pending' }))
        }));
        await _supabase.from('profiles').update({ [f]: userProfile[f] - b }).eq('id', currentUser.id);
        await _supabase.from('markets').insert([{ title: t, type, take: b, stake: b, deadline: new Date(dl).toISOString(), note: JSON.stringify(grp), creator_name: currentUser.username, status: 'active' }]);
        location.reload();
    }
    function openBet(mId, n, o, t) { activeBet = { mId, n, o, t }; document.getElementById('bet-on').innerText = n; document.getElementById('bet-odds').innerText = "x"+o; document.getElementById('betModal').classList.remove('hidden'); }
    async function openSettle(mId, title) {
        const { data } = await _supabase.from('markets').select('*').eq('id', mId).single();
        currentSettleId = mId; currentSettleGroups = JSON.parse(data.note);
        document.getElementById('settle-title').innerText = title;
        let h = '';
        currentSettleGroups.forEach((g, gi) => {
            h += `<div style="margin-top:15px"><small>${g.title}</small>`;
            g.outcomes.forEach((o, oi) => {
                h += `<div style="display:flex; justify-content:space-between; margin-top:5px"><span>${o.n}</span>
                <select class="settle-select" data-gi="${gi}" data-oi="${oi}"><option value="pending">Pending</option><option value="win">WIN</option><option value="loss">LOSS</option></select></div>`;
            });
            h += `</div>`;
        });
        document.getElementById('settle-area').innerHTML = h; document.getElementById('settleModal').classList.remove('hidden');
    }
    async function claimDailyDemo() {
        const win = Math.floor(Math.random() * 1000 + 500);
        await _supabase.from('profiles').update({ demo_balance: userProfile.demo_balance + win }).eq('id', currentUser.id);
        location.reload();
    }
    function showSection(id) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById('section-'+id).classList.add('active'); document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active')); document.getElementById('link-'+id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); if(!document.getElementById('groups-container').innerHTML) addGroup(); }
    function logout() { localStorage.clear(); window.location.href="login.html"; }
</script>
</body>
</html>
