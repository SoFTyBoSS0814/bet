<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>StakeForge</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef2f5;
}

/* NAVBAR */
.navbar {
  background: #2c4f60;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: bold;
  font-size: 20px;
}

button {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin-left: 5px;
}

/* TABS */
.tabs {
  background: #3b6f85;
  display: flex;
  justify-content: center;
}

.tab {
  padding: 15px;
  color: white;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
}

/* ODDS */
.odds {
  display: flex;
  gap: 10px;
}

.odd {
  flex: 1;
  background: #f0f0f0;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
}

.odd:hover {
  background: #dbeeff;
}

.selected {
  background: #00d4ff !important;
  color: black;
}

/* MODAL */
.modal {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
}

.hidden { display:none; }

.modal-box {
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input {
  width:100%;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">⚡ StakeForge</div>

  <div>
    <button id="createBtn" onclick="openCreate()" style="display:none;">+ Create Market</button>
    <button onclick="openLogin()">Login</button>
    <button onclick="openRegister()">Register</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab">Feed</div>
</div>

<!-- CONTENT -->
<div class="container">
  <div id="events"></div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <h3>Login</h3>
    <input id="loginEmail" placeholder="email">
    <input id="loginPass" type="password">
    <button onclick="login()">Login</button>
    <button onclick="closeModals()">Close</button>
  </div>
</div>

<!-- REGISTER -->
<div id="registerModal" class="modal hidden">
  <div class="modal-box">
    <h3>Register</h3>
    <input id="regEmail" placeholder="email">
    <input id="regPass" type="password">
    <button onclick="register()">Register</button>
    <button onclick="closeModals()">Close</button>
  </div>
</div>

<!-- CREATE MARKET -->
<div id="createModal" class="modal hidden">
  <div class="modal-box">
    <h3>Create Market</h3>

    <input id="title" placeholder="Liverpool vs Arsenal">
    <input id="odd1" placeholder="Odds 1">
    <input id="oddX" placeholder="Odds X">
    <input id="odd2" placeholder="Odds 2">
    <input id="volatility" placeholder="Volatility %">

    <button onclick="createMarket()">Create</button>
    <button onclick="closeModals()">Close</button>
  </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let users = JSON.parse(localStorage.getItem("users") || "[]");
let events = JSON.parse(localStorage.getItem("events") || "[]");

// MODALS
function openLogin() {
  document.getElementById("loginModal").classList.remove("hidden");
}
function openRegister() {
  document.getElementById("registerModal").classList.remove("hidden");
}
function openCreate() {
  document.getElementById("createModal").classList.remove("hidden");
}
function closeModals() {
  document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden"));
}

// REGISTER
function register() {
  const email = regEmail.value;
  const pass = regPass.value;

  users.push({ email, pass, balance: 1000 });
  localStorage.setItem("users", JSON.stringify(users));

  alert("Registered!");
  closeModals();
}

// LOGIN
function login() {
  const email = loginEmail.value;
  const pass = loginPass.value;

  const found = users.find(u => u.email === email && u.pass === pass);
  if (!found) return alert("Wrong login");

  user = found;
  localStorage.setItem("user", JSON.stringify(user));

  document.getElementById("createBtn").style.display = "inline-block";

  closeModals();
  render();
}

// CREATE MARKET
function createMarket() {
  const market = {
    id: Date.now(),
    title: title.value,
    odds: [odd1.value, oddX.value, odd2.value],
    volatility: volatility.value,
    creator: user.email
  };

  events.push(market);
  localStorage.setItem("events", JSON.stringify(events));

  closeModals();
  render();
}

// CLICK ODDS
function selectOdd(el) {
  document.querySelectorAll(".odd").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");

  if (!user) {
    alert("Login first!");
  } else {
    alert("Bet selected (next step: stake)");
  }
}

// RENDER
function render() {
  const container = document.getElementById("events");
  container.innerHTML = "";

  events.forEach(e => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${e.title}</b><br>
      <small>Creator: ${e.creator}</small><br>
      <small>Volatility: ${e.volatility}%</small>

      <div class="odds">
        <div class="odd" onclick="selectOdd(this)">1<br>${e.odds[0]}</div>
        <div class="odd" onclick="selectOdd(this)">X<br>${e.odds[1]}</div>
        <div class="odd" onclick="selectOdd(this)">2<br>${e.odds[2]}</div>
      </div>
    `;

    container.appendChild(div);
  });
}

// INIT
if (user) {
  document.getElementById("createBtn").style.display = "inline-block";
}
render();
</script>

</body>
</html>
