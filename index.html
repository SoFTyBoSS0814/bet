<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>StakeForge</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00d4ff; --bg: #0b1218; --text: #fff; --card: #16212a; 
            --danger: #ff4444; --demo: #ffff00; --border: #2c4f60; 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        /* FEJLÉC ÉS NAVIGÁCIÓ */
        .navbar { background: #111b22; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 24px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #8899a6; text-decoration: none; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .nav-links a.active { color: var(--primary); }

        /* EGYENLEG (Kék/Citromsárga) */
        .wallet-display { display: flex; gap: 20px; font-weight: 800; }
        .bal-real { color: var(--primary); }
        .bal-demo { color: var(--demo); }

        .container { max-width: 900px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        /* MODAL / LÉTREHOZÁS */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: var(--card); width: 100%; max-width: 420px; padding: 30px; border-radius: 15px; border: 1px solid var(--border); }
        
        input, select { background: #0b1218; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 14px; }
        label { display: block; font-size: 11px; color: #8899a6; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }

        .btn { padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; width: 100%; text-transform: uppercase; }
        .btn-primary { background: var(--primary); color: #0b1218; }
        .btn-cancel { background: transparent; color: var(--danger); margin-top: 10px; }
        
        .market-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div style="display:flex; align-items:center; gap:40px;">
        <div class="logo">STAKEFORGE</div>
        <div class="nav-links">
            <a onclick="showSection('markets')" id="l-markets" class="active">Markets</a>
            <a onclick="showSection('wallet')" id="l-wallet">Wallet</a>
            <a onclick="showSection('account')" id="l-account">Account</a>
            <a onclick="showSection('settings')" id="l-settings">Settings</a>
        </div>
    </div>
    <div id="user-balance" class="wallet-display"></div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1 style="margin:0;">PIACOK</h1>
            <button class="btn btn-primary" style="width:auto; padding: 10px 20px;" onclick="toggleModal(true)">+ ÚJ PIAC</button>
        </div>
        <div id="market-list">Piacok betöltése...</div>
    </div>

    <div id="section-wallet" class="section"><h1>WALLET</h1><div class="market-card">Pénztárca funkciók hamarosan.</div></div>
    <div id="section-account" class="section"><h1>ACCOUNT</h1><div id="user-info" class="market-card">Profil adatok...</div></div>
    <div id="section-settings" class="section"><h1>SETTINGS</h1><div class="market-card">Beállítások...</div></div>
</div>

<div id="market-modal" class="modal-bg hidden">
    <div class="modal-box">
        <h2 style="margin-top:0; letter-spacing:-1px;">CREATE MARKET</h2>
        
        <label>EVENT NAME *</label>
        <input id="m-title" placeholder="pl. Man City vs Real Madrid">

        <label>START TIME (DEADLINE) *</label>
        <input id="m-start" type="datetime-local">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label>TYPE</label>
                <select id="m-type"><option value="DEMO">DEMO (D)</option><option value="REAL">REAL (€)</option></select>
            </div>
            <div><label>MAX STAKE</label><input id="m-max" type="number" value="100"></div>
        </div>

        <label>BUDGET (TAKE)</label>
        <input id="m-take" type="number" value="1000">

        <label>ODDS (1 / X / 2)</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
            <input id="o1" type="number" step="0.01" value="2.00">
            <input id="ox" type="number" step="0.01" value="3.00">
            <input id="o2" type="number" step="0.01" value="2.50">
        </div>

        <button class="btn btn-primary" onclick="saveMarket()">SAVE & PUBLISH</button>
        <button class="btn btn-cancel" onclick="toggleModal(false)">CANCEL</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let user = JSON.parse(localStorage.getItem("user"));

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('section-'+id).classList.add('active');
        document.getElementById('l-'+id).classList.add('active');
    }

    // --- MENTÉS FIXÁLVA ---
    async function saveMarket() {
        const title = document.getElementById('m-title').value;
        const start = document.getElementById('m-start').value;

        if(!title || !start) return alert("Kérlek adj meg nevet és kezdési időpontot!");

        const oddsArr = [
            { name: "1", odds: document.getElementById('o1').value },
            { name: "X", odds: document.getElementById('ox').value },
            { name: "2", odds: document.getElementById('o2').value }
        ];

        const { error } = await _supabase.from('markets').insert([{
            title: title,
            start_time: start, //
            take: parseFloat(document.getElementById('m-take').value), //
            stake: 0, //
            type: document.getElementById('m-type').value,
            max_stake: parseFloat(document.getElementById('m-max').value),
            note: JSON.stringify(oddsArr),
            creator_name: user ? user.username : "Admin",
            odd_1: parseFloat(document.getElementById('o1').value)
        }]);

        if(error) alert("Adatbázis hiba: " + error.message);
        else location.reload();
    }

    function updateNav() {
        if(user) {
            document.getElementById('user-balance').innerHTML = `
                <span class="bal-real">${user.real_balance.toFixed(2)} €</span>
                <span class="bal-demo">${user.demo_balance.toFixed(2)} D</span>
            `;
            document.getElementById('user-info').innerText = "Logged in as: " + user.username;
        }
    }

    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*');
        document.getElementById('market-list').innerHTML = data?.map(m => `
            <div class="market-card">
                <div><b>${m.title}</b><br><small style="color:#8899a6;">${new Date(m.start_time).toLocaleString()}</small></div>
                <div style="font-weight:900; color:${m.type=='DEMO' ? 'var(--demo)' : 'var(--primary)'}">${m.type}</div>
            </div>
        `).join('') || "Nincsenek aktív piacok.";
    }

    function toggleModal(s) { document.getElementById('market-modal').classList.toggle('hidden', !s); }
    window.onload = () => { updateNav(); loadMarkets(); };
</script>
</body>
</html>
