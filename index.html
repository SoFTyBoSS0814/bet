<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --warning: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links span { color: #aaa; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; transition: 0.2s; }
        .nav-links span:hover { color: #fff; }
        .nav-links span.active { color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        /* Wallet & Account Kártyák */
        .info-card { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #2c4f60; max-width: 600px; margin: auto; }
        .info-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; text-align: left; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-row label { color: var(--primary); font-size: 12px; letter-spacing: 1px; }
        .info-row span { font-size: 18px; font-weight: 600; color: #eee; }

        .warning-box { background: rgba(255, 204, 0, 0.1); border: 1px solid var(--warning); color: var(--warning); padding: 15px; border-radius: 8px; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; font-size: 14px; text-align: center; }
        .wallet-actions { display: flex; gap: 15px; margin-top: 20px; justify-content: center; }
        .btn-action { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: 1px solid #334756; transition: 0.3s; text-decoration: none; text-align: center; font-size: 14px; }
        .btn-deposit { background: var(--primary); color: #000; border: none; }
        .btn-withdraw { background: transparent; color: var(--text); border-color: var(--primary); }

        /* Modalok */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid #2c4f60; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        
        /* Market Cards */
        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; }
        .market-meta { display: flex; gap: 15px; font-size: 11px; color: #8899a6; margin-top: 5px; text-transform: uppercase; }
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-bet:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.1); }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .edit-badge { background: var(--demo); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <div class="logo" onclick="window.location.reload()">STAKEFORGE</div>
        <div class="nav-links">
            <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
            <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
            <span id="link-account" onclick="showSection('account')">Account</span>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-danger" style="background:#441111" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Betöltés...</div>
    </div>

    <div id="section-wallet" class="section">
        <div class="info-card" style="text-align:center;">
            <h2 style="margin-top:0;">Wallet Balance</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px;">
                <div style="background: rgba(0, 212, 255, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--primary);">
                    <small style="color:var(--primary); font-weight:bold;">REAL</small><h1 id="wallet-real">0.00 €</h1>
                </div>
                <div style="background: rgba(255, 204, 0, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--demo);">
                    <small style="color:var(--demo); font-weight:bold;">DEMO</small><h1 id="wallet-demo">0.00 D</h1>
                </div>
            </div>
            <div id="wallet-dynamic-area"></div>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="info-card">
            <h2 style="margin-top:0; text-align:center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 25px;">Account Settings</h2>
            
            <div class="info-row">
                <label>USERNAME</label>
                <span id="acc-username">---</span>
            </div>

            <div class="info-row">
                <label>EMAIL ADDRESS</label>
                <span id="acc-email">---</span>
            </div>

            <div class="info-row">
                <label>LAST LOGIN</label>
                <span id="acc-last-login">---</span>
            </div>

            <button class="btn-danger" style="width:100%; margin-top:10px;" onclick="logout()">Sign Out of All Sessions</button>
        </div>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 id="modal-title" style="margin:0; color:var(--primary);">Manager</h2>
            <div style="display:flex; gap:10px;">
                <button class="btn-primary" id="final-save-btn" onclick="saveMarket()">💾 Save Changes</button>
                <button class="btn-danger" onclick="closeModal()">Close</button>
            </div>
        </div>
        <div id="meta-inputs">
            <label>Event Name</label><input id="m-name" placeholder="Pl: Team A vs Team B">
            <label>Deadline</label><input id="m-date" type="datetime-local">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div><label>Type</label><select id="m-type"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select></div>
                <div><label>Liquidity Budget</label><input id="m-budget" type="number" value="1000"></div>
            </div>
        </div>
        <div id="groups-container"></div>
        <button id="add-group-btn" class="btn-outline" onclick="addGroup()">+ Add Category</button>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width: 350px;">
        <h3 id="bet-outcome-name" style="margin:0; color:var(--primary);">Outcome</h3>
        <p id="bet-odds-display" style="font-size:32px; font-weight:bold; margin:10px 0; color:#fff;"></p>
        <label>Stake Amount</label><input id="bet-amount" type="number" value="100" oninput="calculateWin()">
        <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #334756;">
            <small>Potential Win:</small><div id="potential-win" style="font-size:20px; font-weight:bold; color:var(--success)">0.00</div>
        </div>
        <button class="btn-primary" style="width:100%; padding:15px;" onclick="placeFinalBet()">PLACE BET</button>
        <button onclick="closeBetModal()" style="background:none; border:none; color:#888; width:100%; cursor:pointer; margin-top:15px;">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let groupIdx = 0;
    let editingMarketId = null;
    let activeBetData = null;

    // IP & Account adatok betöltése
    async function loadAccountData() {
        if (!currentUser) return;
        
        // Username és Email a mentett adatokból
        document.getElementById('acc-username').innerText = currentUser.username || "Unknown User";
        document.getElementById('acc-email').innerText = currentUser.email || "No email provided";
        
        // Utolsó belépés (mostani session kezdete formázva)
        const lastLogin = new Date().toLocaleString('hu-HU');
        document.getElementById('acc-last-login').innerText = lastLogin;
    }

    async function checkLocationAndRenderWallet() {
        const dynamicArea = document.getElementById('wallet-dynamic-area');
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            if (data.country_code === 'HU') {
                dynamicArea.innerHTML = `<div class="warning-box"><span>⚠️</span> Magyarország területéről nem engedélyezett a BE/KI-fizetés.</div>`;
            } else {
                dynamicArea.innerHTML = `<div class="wallet-actions"><a href="#" class="btn-action btn-deposit" onclick="alert('Redirecting...')">DEPOSIT</a><a href="#" class="btn-action btn-withdraw" onclick="alert('Redirecting...')">WITHDRAW</a></div>`;
            }
        } catch (e) {
            dynamicArea.innerHTML = `<div class="warning-box"><span>⚠️</span> Biztonsági korlátozás aktív (HU).</div>`;
        }
    }

    async function fetchProfile() {
        if(!currentUser) return;
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            userProfile = data;
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
            if(document.getElementById("wallet-real")) {
                document.getElementById("wallet-real").innerText = data.real_balance.toFixed(2) + " €";
                document.getElementById("wallet-demo").innerText = data.demo_balance.toFixed(2) + " D";
            }
        }
    }

    // Navigáció vezérlése
    function showSection(id) { 
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); 
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        
        document.getElementById('section-'+id).classList.add('active'); 
        document.getElementById('link-'+id).classList.add('active');

        if(id === 'markets') loadMarkets();
        if(id === 'wallet') checkLocationAndRenderWallet();
        if(id === 'account') loadAccountData();
    }

    // --- Piaci funkciók ---
    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        list.innerHTML = data?.length ? "" : "Nincsenek aktív piacok.";
        
        data?.forEach(m => {
            if(m.status === 'settled') return;
            let groups = JSON.parse(m.note || "[]");
            const isOwner = currentUser && m.creator_name === currentUser.username;
            const startTime = new Date(m.created_at).toLocaleString('hu-HU');

            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <div style="padding:20px;">
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <h3 style="margin:0;">${m.title} ${isOwner ? `<span class="edit-badge" onclick="openEditModal('${m.id}')">EDIT</span>` : ''}</h3>
                            <div class="market-meta"><span>Host: <b>${m.creator_name}</b></span><span>Start: <b>${startTime}</b></span></div>
                        </div>
                        <div style="text-align:right;">
                            <b style="color:${m.type==='REAL'?'var(--primary)':'var(--demo)'}">${m.type}</b>
                            <div style="font-weight:bold;">Budget: ${m.take}</div>
                        </div>
                    </div>
                    ${groups.map(g => `
                        <div style="margin-top:15px; border-top:1px solid #2c4f60; padding-top:10px;">
                            <small style="color:#888; font-weight:bold;">${g.title}</small>
                            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-top:5px;">
                                ${g.outcomes.map(o => `<button class="btn-bet" onclick="handleBet('${m.id}', '${o.n}', ${o.o}, '${m.type}')"><div style="font-size:11px; color:#aaa;">${o.n}</div><div style="font-weight:bold; color:var(--primary); font-size:16px;">${o.o.toFixed(2)}</div></button>`).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>`;
            list.appendChild(card);
        });
    }

    // ... (A többi függvény: saveMarket, placeFinalBet, settleMarket stb. maradjon az előző verzióból!) ...
    // Hogy a kód ne legyen túl hosszú, itt feltételezzük, hogy a placeFinalBet és társai már megvannak.

    async function placeFinalBet() {
        const amount = parseFloat(document.getElementById('bet-amount').value);
        if(!amount || amount <= 0) return alert("Helytelen összeg!");
        const field = activeBetData.mType === 'REAL' ? 'real_balance' : 'demo_balance';
        if(amount > userProfile[field]) return alert("Nincs fedezet!");
        await _supabase.from('profiles').update({ [field]: userProfile[field] - amount }).eq('id', currentUser.id);
        await _supabase.from('bets').insert([{
            market_id: activeBetData.id, user_id: currentUser.id, outcome_name: activeBetData.name,
            odds: activeBetData.odds, amount: amount, type: activeBetData.mType, status: 'pending'
        }]);
        alert("Sikeres fogadás!"); closeBetModal(); fetchProfile();
    }

    async function settleMarket(winnerName) {
        if(!confirm(`Biztosan "${winnerName}" a nyertes?`)) return;
        try {
            await _supabase.from('markets').update({ status: 'settled', winner: winnerName }).eq('id', editingMarketId);
            const { data: allBets } = await _supabase.from('bets').select('*').eq('market_id', editingMarketId).eq('status', 'pending');
            if (allBets) {
                for (const bet of allBets) {
                    if (bet.outcome_name === winnerName) {
                        const winAmount = bet.amount * bet.odds;
                        const balField = bet.type === 'REAL' ? 'real_balance' : 'demo_balance';
                        await _supabase.rpc('increment_balance', { user_id: bet.user_id, amount: winAmount, field: balField });
                        await _supabase.from('bets').update({ status: 'won' }).eq('id', bet.id);
                    } else {
                        await _supabase.from('bets').update({ status: 'lost' }).eq('id', bet.id);
                    }
                }
            }
            alert("Kifizetés kész!"); closeModal(); fetchProfile(); loadMarkets();
        } catch (err) { alert(err.message); }
    }

    async function saveMarket() {
        const btn = document.getElementById('final-save-btn');
        const groups = [];
        document.querySelectorAll('.market-group').forEach(g => {
            const outcomes = [];
            const title = g.querySelector('.g-title').value || "Market";
            g.querySelectorAll('.outcome-item').forEach(i => {
                outcomes.push({ n: i.querySelector('.o-n').value, o: parseFloat(i.querySelector('.o-o').value) || 1.0 });
            });
            groups.push({ title: title, outcomes });
        });
        btn.disabled = true;
        if(editingMarketId) {
            await _supabase.from('markets').update({ note: JSON.stringify(groups) }).eq('id', editingMarketId);
        } else {
            const budgetVal = parseFloat(document.getElementById('m-budget').value);
            const type = document.getElementById('m-type').value;
            const balField = type === 'REAL' ? 'real_balance' : 'demo_balance';
            if(budgetVal > userProfile[balField]) { btn.disabled = false; return alert("Nincs fedezet!"); }
            await _supabase.from('profiles').update({ [balField]: userProfile[balField] - budgetVal }).eq('id', currentUser.id);
            await _supabase.from('markets').insert([{
                title: document.getElementById('m-name').value || "New Event",
                type: type, take: budgetVal, note: JSON.stringify(groups),
                creator_name: currentUser.username, status: 'active',
                created_at: new Date(document.getElementById('m-date').value).toISOString()
            }]);
        }
        btn.disabled = false; closeModal(); fetchProfile(); loadMarkets();
    }

    function addGroup(t="", l=false) {
        groupIdx++;
        const div = document.createElement('div');
        div.className='market-group';
        div.innerHTML = `<input class="g-title" placeholder="Category" value="${t}" ${l?'readonly':''}>
            <div id="grid-${groupIdx}" class="outcomes-grid"></div>
            <button class="btn-outline" onclick="addOutcome(${groupIdx})">+ Outcome</button>`;
        document.getElementById('groups-container').appendChild(div);
    }
    function addOutcome(id, n="", o=1.5, l=false, s=false) {
        const div = document.createElement('div');
        div.className='outcome-item';
        div.innerHTML = `<input class="o-n" placeholder="Name" value="${n}" ${l?'readonly':''}>
            <input class="o-o" type="number" step="0.01" value="${o}">
            ${s ? `<button class="btn-success" onclick="settleMarket('${n}')">SET AS WINNER</button>` : ''}`;
        document.getElementById(`grid-${id}`).appendChild(div);
    }
    async function openEditModal(id) {
        editingMarketId = id;
        const { data } = await _supabase.from('markets').select('*').eq('id', id).single();
        document.getElementById("modal-title").innerText = "Host Panel";
        document.getElementById("meta-inputs").classList.add("hidden");
        document.getElementById("createModal").classList.remove("hidden");
        document.getElementById('groups-container').innerHTML = "";
        JSON.parse(data.note).forEach(g => {
            addGroup(g.title, true);
            g.outcomes.forEach(o => addOutcome(groupIdx, o.n, o.o, true, true));
        });
    }
    function handleBet(id, name, odds, mType) {
        activeBetData = { id, name, odds, mType };
        document.getElementById('bet-outcome-name').innerText = name;
        document.getElementById('bet-odds-display').innerText = odds.toFixed(2);
        document.getElementById('betModal').classList.remove('hidden');
        calculateWin();
    }
    function calculateWin() { 
        const amt = parseFloat(document.getElementById('bet-amount').value) || 0;
        document.getElementById('potential-win').innerText = (amt * (activeBetData?.odds || 0)).toFixed(2);
    }
    function openCreateModal() { editingMarketId=null; document.getElementById("meta-inputs").classList.remove("hidden"); document.getElementById("createModal").classList.remove("hidden"); document.getElementById('groups-container').innerHTML=""; addGroup(); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function closeBetModal() { document.getElementById('betModal').classList.add('hidden'); }
    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }

    window.onload = () => { 
        fetchProfile(); 
        loadMarkets();
        loadAccountData();
    };
</script>
</body>
</html>
