<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; }
        .nav-links a.active { color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }
        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 500px; max-width: 95vw; border: 1px solid #2c4f60; }
        input, select, textarea { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; }
        .market-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .btn-bet { background:#0b1218; border:1px solid #334756; color:#fff; padding:12px; border-radius:10px; cursor:pointer; text-align:center; transition: 0.2s; }
        .btn-bet:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.1); }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <span style="font-weight:900; color:var(--primary); font-size:22px; margin-right:30px;">STAKEFORGE</span>
        <div class="nav-links">
            <a onclick="showSection('markets')" class="active">Markets</a>
            <a onclick="showSection('wallet')">Wallet</a>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-danger" style="background:#441111" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div class="section-header">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Piacok betöltése...</div>
    </div>
    <div id="section-wallet" class="section"><h2>Wallet</h2></div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h2 style="margin-top:0;">Piac Létrehozása</h2>
        <label>Esemény Neve *</label>
        <input id="m-name" placeholder="pl. Manchester City vs Real Madrid">
        
        <label>Határidő *</label>
        <input id="m-date" type="datetime-local">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div>
                <label>Számla típusa</label>
                <select id="m-type"><option value="DEMO">DEMO (D)</option><option value="REAL">REAL (€)</option></select>
            </div>
            <div>
                <label>Költségvetés</label>
                <input id="m-budget" type="number" value="1000">
            </div>
        </div>

        <label>Kimenetelek (Név és Odds)</label>
        <div id="outcomes-container">
            <div class="outcome-row" style="display:flex; gap:10px; margin-bottom:10px;">
                <input class="o-n" placeholder="Név" style="margin:0;">
                <input class="o-o" type="number" step="0.01" placeholder="Odds" style="margin:0; width:100px;">
            </div>
            <div class="outcome-row" style="display:flex; gap:10px; margin-bottom:10px;">
                <input class="o-n" placeholder="Név" style="margin:0;">
                <input class="o-o" type="number" step="0.01" placeholder="Odds" style="margin:0; width:100px;">
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-primary" style="flex:1;" onclick="saveMarket()">💾 Mentés</button>
            <button class="btn-danger" style="flex:1;" onclick="closeModal()">Mégse</button>
        </div>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width: 350px;">
        <h3 id="bet-outcome-name" style="margin:0; color:var(--primary);">Kimenetel</h3>
        <p id="bet-odds-display" style="font-size:20px; font-weight:bold; margin:10px 0;"></p>
        <label>Tét összege</label>
        <input id="bet-amount" type="number" value="100" oninput="calculateWin()">
        <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:5px; margin-bottom:15px;">
            <small>Várható nyeremény:</small>
            <div id="potential-win" style="font-weight:bold; color:var(--demo);">0.00</div>
        </div>
        <button class="btn-primary" style="width:100%;" onclick="placeFinalBet()">Fogadás Megtétele</button>
        <button onclick="closeBetModal()" style="background:none; border:none; color:#888; width:100%; cursor:pointer; margin-top:10px;">Bezár</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));
    let activeBetData = null;

    async function refreshBalances() {
        if(!currentUser) return;
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
            window.userBalances = data;
        }
    }

    async function saveMarket() {
        const name = document.getElementById('m-name').value;
        const date = document.getElementById('m-date').value;
        const budget = parseFloat(document.getElementById('m-budget').value);
        
        const outcomes = [];
        document.querySelectorAll('.outcome-row').forEach(row => {
            const n = row.querySelector('.o-n').value;
            const o = row.querySelector('.o-o').value;
            if(n && o) outcomes.push({ n, o }); // 'n' és 'o' kulcsokat használunk az adatbázisod JSON-je alapján
        });

        // FONTOS: Az adatbázisod 'title' és 'note' oszlopokat vár, az 'odd_x' pedig nem lehet üres!
        const { error } = await _supabase.from('markets').insert([{
            title: name, 
            start_time: date,
            take: budget,
            type: document.getElementById('m-type').value,
            stake: 0,
            note: JSON.stringify(outcomes),
            odd_1: outcomes[0] ? parseFloat(outcomes[0].o) : 0,
            odd_x: 0, // Kényszerített 0, hogy ne kapj "null value" hibát
            odd_2: outcomes[1] ? parseFloat(outcomes[1].o) : 0,
            creator_name: currentUser ? currentUser.username : "Admin"
        }]);

        if(error) alert("Hiba: " + error.message);
        else { alert("Piac elmentve!"); closeModal(); loadMarkets(); }
    }

    async function loadMarkets() {
        const { data, error } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        if(error) return;

        const list = document.getElementById('market-list');
        list.innerHTML = "";

        data?.forEach(m => {
            let outcomes = [];
            try { outcomes = JSON.parse(m.note || "[]"); } catch(e) { outcomes = []; }

            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:start;">
                    <div>
                        <h3 style="margin:0;">${m.title || "Névtelen"}</h3>
                        <small style="color:#888;">${m.start_time ? new Date(m.start_time).toLocaleString('hu-HU') : ''}</small>
                    </div>
                    <b style="color:var(--demo)">${m.type}</b>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
                    ${outcomes.map(o => `
                        <button class="btn-bet" onclick="handleBet('${m.id}', '${o.n}', ${o.o})">
                            <div style="font-size:10px; color:#8899a6;">${o.n}</div>
                            <div style="font-size:16px; font-weight:bold; color:var(--primary);">${o.o}</div>
                        </button>
                    `).join('')}
                </div>
            `;
            list.appendChild(card);
        });
    }

    function handleBet(id, name, odds) {
        activeBetData = { id, name, odds };
        document.getElementById('bet-outcome-name').innerText = name;
        document.getElementById('bet-odds-display').innerText = odds.toFixed(2);
        document.getElementById('betModal').classList.remove('hidden'); // Alert helyett panel
        calculateWin();
    }

    function calculateWin() {
        const amt = parseFloat(document.getElementById('bet-amount').value) || 0;
        document.getElementById('potential-win').innerText = (amt * (activeBetData?.odds || 0)).toFixed(2);
    }

    function placeFinalBet() {
        alert("Fogadás sikeres!");
        closeBetModal();
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        if(id === 'markets') loadMarkets();
    }

    function openCreateModal() { document.getElementById("createModal").classList.remove("hidden"); refreshBalances(); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function closeBetModal() { document.getElementById("betModal").classList.add("hidden"); }
    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }

    window.onload = () => { if(!currentUser) window.location.href="login.html"; refreshBalances(); loadMarkets(); };
</script>
</body>
</html>
