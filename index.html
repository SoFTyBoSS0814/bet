<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .market-type-tag { text-align: right; }
        
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .market-bet-btn:disabled { opacity: 0.15 !important; cursor: not-allowed !important; filter: grayscale(1); }

        .btn-create { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }

        .btn-del-group { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--danger); font-weight: bold; cursor: pointer; opacity: 0.6; }
        .btn-del-outcome { background: none; border: none; color: var(--danger); font-weight: bold; cursor: pointer; padding: 0 5px; width: 25px; font-size: 14px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-create" onclick="openCreateModal()">+ Create</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>
    <div id="section-history" class="section"><h2>Settled Markets</h2><div id="history-list"></div></div>
    <div id="section-wallet" class="section">...</div>
    <div id="section-account" class="section">...</div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10" oninput="calcWin()">
        <p id="bet-win-text">Payout: 0.00</p>
        <button class="btn-primary" onclick="placeBet()">PLACE BET</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')">Cancel</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>New Market</h3>
        <select id="m-type"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select>
        <input id="m-name" placeholder="Event Name">
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Market Balance">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px; border-style:dashed">+ Add Category</button>
        <button class="btn-primary" style="margin-top:20px" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="settle-title">Settle Market</h3>
        <div id="settle-area"></div>
        <button class="btn-primary" style="margin-top:20px; background:var(--success)" onclick="finalSubmitSettle()">FINALIZE</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('settleModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let activeBet = null;
    let currentSettleData = { mId: null, groups: [] };

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
        setInterval(refreshTimers, 1000);
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
    }

    function getSafeTime(dlStr) { if (!dlStr) return 0; let t = dlStr.replace(" ", "T"); if (!t.includes('Z') && !t.includes('+')) t += "Z"; return new Date(t).getTime(); }
    function isExpired(dl) { return new Date().getTime() >= getSafeTime(dl); }

    function refreshTimers() {
        document.querySelectorAll('.market-bet-btn').forEach(btn => {
            if(isExpired(btn.getAttribute('data-dl'))) { btn.disabled = true; btn.onclick = null; }
        });
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list');
        const hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            const isHost = m.creator_name === currentUser.username;
            const isDemo = m.type === 'DEMO';
            const typeColor = isDemo ? 'var(--demo)' : 'var(--primary)';
            const currency = isDemo ? 'D' : '€';
            const deadlineFormatted = m.deadline.replace('T', ' ').split('+')[0];

            if(m.status === 'active') {
                const expired = isExpired(m.deadline);
                const card = document.createElement('div');
                card.className = 'market-card';
                card.innerHTML = `
                    <div class="market-header">
                        <div>
                            <h2 style="margin:0; font-size:22px;">${m.title}</h2>
                            <div style="margin-top:6px; line-height: 1.5;">
                                <small style="color:#aaa; display:block;">⏳ Deadline: ${deadlineFormatted}</small>
                                <small style="color:#fff; display:block;">Host: <b style="color:var(--primary)">${m.creator_name}</b></small>
                                <small style="color:#ccc; display:block;">Balance: <b style="color:${typeColor}">${m.take ? m.take.toFixed(0) : 0} ${currency}</b></small>
                            </div>
                        </div>
                        <div class="market-type-tag">
                            <span style="color:${typeColor}; font-weight:900; letter-spacing:1px; font-size:14px;">${m.type}</span>
                            ${isHost ? `<div style="margin-top:10px;"><button onclick="openSettle('${m.id}','${m.title}')" class="btn-create">SETTLE</button></div>` : ''}
                        </div>
                    </div>
                    ${groups.map(g => `
                        <div class="market-group">
                            <small style="color:var(--primary); font-weight:bold; text-transform:uppercase; font-size:10px;">${g.title}</small>
                            <div class="outcomes-grid">
                                ${g.outcomes.map(o => `<button class="btn-bet market-bet-btn" data-dl="${m.deadline}" ${expired?'disabled':''} onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}','${m.deadline}')">${o.n}<br><b>${o.o}</b></button>`).join('')}
                            </div>
                        </div>`).join('')}`;
                mList.appendChild(card);
            } else {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.innerHTML = `<div style="background:var(--primary); color:#000; font-size:10px; font-weight:900; padding:4px 10px; border-radius:4px; display:inline-block; margin-bottom:10px;">SETTLED</div><h3>${m.title}</h3><small>Host: ${m.creator_name} | Balance: ${m.take} ${currency}</small>`;
                hList.appendChild(card);
            }
        });
    }

    function openBet(mId, n, o, t, dl) {
        if(isExpired(dl)) return;
        activeBet = { mId, n, o, t, dl };
        document.getElementById('bet-on').innerText = n;
        document.getElementById('bet-odds').innerText = "x" + o;
        document.getElementById('betModal').classList.remove('hidden');
        calcWin();
    }

    async function placeBet() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        const f = activeBet.t === 'REAL' ? 'real_balance' : 'demo_balance';
        if(amt > userProfile[f]) { alert("Insufficient balance!"); return; }
        const netWin = amt * (activeBet.o - 1);
        const { error: liqErr } = await _supabase.rpc('decrease_market_liq', { m_id: activeBet.mId, amount: netWin });
        if(liqErr) { alert("Market balance reached!"); return; }
        await _supabase.from('profiles').update({ [f]: userProfile[f] - amt }).eq('id', currentUser.id);
        await _supabase.from('bets').insert([{ user_id: currentUser.id, market_id: activeBet.mId, outcome_name: activeBet.n, amount: amt, odds: activeBet.o, type: activeBet.t, status: 'pending' }]);
        location.reload();
    }

    function openSettle(mId, title) {
        currentSettleData.mId = mId;
        _supabase.from('markets').select('note').eq('id', mId).single().then(({data, error}) => {
            if (error) return;
            currentSettleData.groups = JSON.parse(data.note);
            document.getElementById('settle-title').innerText = "Settle: " + title;
            renderSettleUI();
            document.getElementById('settleModal').classList.remove('hidden');
        });
    }

    function renderSettleUI() {
        const cont = document.getElementById('settle-area'); 
        cont.innerHTML = "";
        currentSettleData.groups.forEach((g, gi) => {
            cont.innerHTML += `<p style="color:var(--primary); margin: 15px 0 5px 0; font-weight:bold; font-size:12px; text-transform:uppercase;">${g.title}</p>`;
            g.outcomes.forEach((o, oi) => {
                const isWin = o.status === 'win';
                const isLoss = o.status === 'loss';
                cont.innerHTML += `
                    <div style="display:flex; gap:10px; margin-bottom:8px; align-items:center; background:rgba(0,0,0,0.2); padding:8px; border-radius:8px;">
                        <span style="flex:1; font-size:14px;">${o.n}</span>
                        <button class="btn-bet" onclick="setResult(${gi},${oi},'win')" style="width:65px; padding:6px; background:${isWin ? 'var(--success)' : '#222'}; border-color:${isWin ? 'var(--success)' : '#334756'}">WIN</button>
                        <button class="btn-bet" onclick="setResult(${gi},${oi},'loss')" style="width:65px; padding:6px; background:${isLoss ? 'var(--danger)' : '#222'}; border-color:${isLoss ? 'var(--danger)' : '#334756'}">LOSS</button>
                    </div>`;
            });
        });
    }

    function setResult(gi, oi, res) {
        currentSettleData.groups[gi].outcomes[oi].status = res;
        renderSettleUI();
    }

    async function finalSubmitSettle() {
        const { mId, groups } = currentSettleData;
        
        // Ellenőrzés: minden kimenetelnek legyen státusza
        let allSet = true;
        groups.forEach(g => g.outcomes.forEach(o => { if(o.status === 'pending') allSet = false; }));
        if(!allSet) { alert("Please set a result for all options!"); return; }

        const { data: mData } = await _supabase.from('markets').select('*').eq('id', mId).single();
        const { data: bets } = await _supabase.from('bets').select('*').eq('market_id', mId).eq('status', 'pending');
        const f = mData.type === 'REAL' ? 'real_balance' : 'demo_balance';

        for (let b of (bets || [])) {
            let win = false;
            groups.forEach(g => g.outcomes.forEach(o => { if(o.n === b.outcome_name && o.status === 'win') win = true; }));
            if(win) {
                const { data: up } = await _supabase.from('profiles').select(f).eq('id', b.user_id).single();
                await _supabase.from('profiles').update({ [f]: up[f] + (b.amount * b.odds) }).eq('id', b.user_id);
                await _supabase.from('bets').update({ status: 'won' }).eq('id', b.id);
            } else { 
                await _supabase.from('bets').update({ status: 'lost' }).eq('id', b.id); 
            }
        }
        await _supabase.from('markets').update({ status: 'closed', note: JSON.stringify(groups) }).eq('id', mId);
        location.reload();
    }

    function addGroup() {
        const container = document.getElementById('groups-container');
        const id = "g-" + Date.now();
        const d = document.createElement('div'); d.className = 'market-group'; d.id = id;
        const delBtn = container.querySelectorAll('.market-group').length > 0 ? `<button class="btn-del-group" onclick="removeEl('${id}')">✕</button>` : '';
        d.innerHTML = `${delBtn}<input class="gt" placeholder="Category Name"><div id="o-cont-${id}"></div><button class="btn-bet" onclick="addO('${id}')" style="font-size:10px; margin-top:5px; border-style:dashed">+ Add Option</button>`;
        container.appendChild(d); addO(id); addO(id);
    }
    
    function addO(groupId) {
        const cont = document.getElementById('o-cont-' + groupId);
        const oid = "o-" + Date.now() + Math.random();
        const d = document.createElement('div'); d.id = oid; d.style.display="flex"; d.style.gap="5px"; d.style.marginTop="5px"; d.style.alignItems="center";
        const delBtn = cont.querySelectorAll('div').length >= 2 ? `<button class="btn-del-outcome" onclick="removeEl('${oid}')">✕</button>` : `<div style="width:25px"></div>`;
        d.innerHTML = `<input class="on" placeholder="Outcome" style="margin:0"><input class="oo" type="number" step="0.1" value="2.0" style="width:70px; margin:0">${delBtn}`;
        cont.appendChild(d);
    }

    async function saveMarket() {
        const t = document.getElementById('m-name').value;
        const b = parseFloat(document.getElementById('m-budget').value);
        const dl = document.getElementById('m-deadline').value;
        const type = document.getElementById('m-type').value;
        const grp = Array.from(document.querySelectorAll('#groups-container .market-group')).map(g => ({
            title: g.querySelector('.gt').value,
            outcomes: Array.from(g.querySelectorAll('div[id^="o-cont-"] > div')).map(o => ({ n: o.querySelector('.on').value, o: parseFloat(o.querySelector('.oo').value), status: 'pending' }))
        }));
        await _supabase.from('markets').insert([{ title: t, type, take: b, deadline: dl, note: JSON.stringify(grp), creator_name: currentUser.username, status: 'active' }]);
        location.reload();
    }

    function removeEl(id) { document.getElementById(id).remove(); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function showSection(id) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById('section-' + id).classList.add('active'); }
    function calcWin() { document.getElementById('bet-win-text').innerText = "Payout: " + (parseFloat(document.getElementById('bet-amount').value) * (activeBet ? activeBet.o : 0)).toFixed(2); }
    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); if(!document.getElementById('groups-container').innerHTML) addGroup(); }
</script>
</body>
</html>
