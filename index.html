<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StakeForge | P2P Betting</title>

<style>
:root {
  --primary: #00d4ff;
  --secondary: #2c4f60;
  --dark: #1a2a33;
  --bg: #0f171e;
  --text: #ffffff;
  --card-bg: #1d2d3a;
}

body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* NAVBAR */
.navbar {
  background: var(--dark);
  padding: 10px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--secondary);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-weight: bold;
  font-size: 24px;
  color: var(--primary);
  letter-spacing: 1px;
}

.nav-buttons {
  display: flex;
  align-items: center;
  gap: 10px;
}

button {
  padding: 10px 18px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.btn-primary { background: var(--primary); color: #000; }
.btn-primary:hover { background: #00b8e6; transform: translateY(-2px); }

.btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
.btn-outline:hover { background: var(--primary); color: #000; }

/* TABS */
.tabs {
  background: var(--dark);
  display: flex;
  justify-content: center;
  gap: 20px;
  border-bottom: 1px solid #334756;
}

.tab {
  padding: 15px 25px;
  cursor: pointer;
  color: #a0aab2;
  font-weight: 500;
  transition: 0.3s;
}

.tab:hover, .tab.active {
  color: var(--primary);
  border-bottom: 3px solid var(--primary);
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.section { display: none; }
.section.active { display: block; }

/* WALLET & PROFILE CARD */
.profile-card {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  border-left: 5px solid var(--primary);
  display: flex;
  justify-content: space-between;
}

.wallet-box {
  background: rgba(0,0,0,0.3);
  padding: 10px 15px;
  border-radius: 8px;
}

.btc-address {
  font-family: monospace;
  font-size: 12px;
  color: var(--primary);
  background: #000;
  padding: 5px;
  margin-top: 5px;
  display: block;
}

/* CARD / MATCHES */
.card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 20px;
  margin-top: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.odds {
  display: flex;
  gap: 15px;
  margin-top: 15px;
}

  background: #2a3e
