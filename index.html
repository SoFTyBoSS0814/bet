<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>StakeForge | Pro Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00d4ff; --bg: #0b1218; --text: #fff; --card: #16212a; 
            --danger: #ff4444; --demo: #ffff00; --border: #2c4f60; 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        /* NAVBAR */
        .navbar { background: #111b22; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border); }
        .nav-left { display: flex; align-items: center; gap: 40px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 24px; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { color: #8899a6; text-decoration: none; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .nav-links a.active, .nav-links a:hover { color: var(--primary); }

        /* EGYENLEGEK */
        .wallet-display { display: flex; gap: 20px; font-weight: 800; font-size: 14px; }
        .bal-real { color: var(--primary); }
        .bal-demo { color: var(--demo); }

        .container { max-width: 1000px; margin: auto; padding: 40px; }
        .section { display: none; }
        .section.active { display: block; }

        /* MARKET CREATOR */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: var(--card); width: 450px; padding: 30px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        input, select { background: #0b1218; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 15px; font-family: 'Inter'; }
        label { display: block; font-size: 10px; color: #8899a6; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

        .btn { padding: 12px 25px; border-radius: 8px; font-weight: 800; cursor: pointer; border: none; transition: 0.2s; text-transform: uppercase; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #0b1218; width: 100%; margin-top: 10px; }
        .btn-cancel { background: transparent; color: var(--danger); width: 100%; margin-top: 5px; }
        
        .market-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <div class="logo">STAKEFORGE</div>
        <div class="nav-links">
            <a onclick="showSection('markets')" id="l-markets" class="active">Markets</a>
            <a onclick="showSection('wallet')" id="l-wallet">Wallet</a>
            <a onclick="showSection('account')" id="l-account">Account</a>
            <a onclick="showSection('settings')" id="l-settings">Settings</a>
        </div>
    </div>
    <div id="nav-right"></div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1 style="margin:0; font-weight:900;">LIVE MARKETS</h1>
            <button class="btn btn-primary" style="width:auto;" onclick="toggleModal(true)">+ NEW MARKET</button>
        </div>
        <div id="market-list">Loading markets...</div>
    </div>
    <div id="section-wallet" class="section"><h1>WALLET</h1></div>
    <div id="section-account" class="section"><h1>ACCOUNT</h1><div id="acc-info" class="market-card"></div></div>
    <div id="section-settings" class="section"><h1>SETTINGS</h1></div>
</div>

<div id="create-modal" class="modal-bg hidden">
    <div class="modal-box">
        <h2 style="margin-top:0; font-weight:900; letter-spacing:-1px;">CREATE MARKET</h2>
        
        <label>Event Name *</label>
        <input id="m-title" placeholder="pl. Luke Littler vs Michael Smith">

        <label>Start Time (Deadline) *</label>
        <input id="m-start" type="datetime-local">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div>
                <label>Type</label>
                <select id="m-type">
                    <option value="DEMO">DEMO (D)</option>
                    <option value="REAL">REAL (€)</option>
                </select>
            </div>
            <div>
                <label>Max Stake</label>
                <input id="m-max" type="number" value="100">
            </div>
        </div>

        <label>Budget (Take)</label>
        <input id="m-take" type="number" value="1000">

        <label>Odds (1 / X / 2)</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
            <input id="o1" type="number" step="0.01" value="2.00">
            <input id="ox" type="number" step="0.01" value="3.00">
            <input id="o2" type="number" step="0.01" value="2.50">
        </div>

        <button class="btn btn-primary" onclick="saveMarket()">Save & Publish</button>
        <button class="btn btn-cancel" onclick="toggleModal(false)">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let user = JSON.parse(localStorage.getItem("user"));

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('section-'+id).classList.add('active');
        document.getElementById('l-'+id).classList.add('active');
    }

    // --- JAVÍTOTT MENTÉS MINDEN MEZŐVEL ---
    async function saveMarket() {
        const title = document.getElementById('m-title').value;
        const startTime = document.getElementById('m-start').value;
        
        if(!title || !startTime) return alert("Hoppá! Az Event Name és a Start Time kötelező.");

        const odds = [
            { name: "1", odds: document.getElementById('o1').value },
            { name: "X", odds: document.getElementById('ox').value },
            { name: "2", odds: document.getElementById('o2').value }
        ];

        // Itt minden oszlopot elküldünk, amire a hibaüzeneteid panaszkodtak!
        const { error } = await _supabase.from('markets').insert([{
            title: title,
            start_time: startTime, //
            type: document.getElementById('m-type').value,
            take: parseFloat(document.getElementById('m-take').value), //
            stake: 0, // Ez javítja a "stake violations" hibát
            max_stake: parseFloat(document.getElementById('m-max').value),
            note: JSON.stringify(odds),
            creator_name: user ? user.username : "System Admin",
            odd_1: parseFloat(document.getElementById('o1').value)
        }]);

        if(error) {
            alert("Hiba történt: " + error.message);
        } else {
            location.reload();
        }
    }

    function updateNav() {
        if(user) {
            document.getElementById('nav-right').innerHTML = `
                <div class="wallet-display">
                    <span class="bal-real">${user.real_balance.toFixed(2)} €</span>
                    <span class="bal-demo">${user.demo_balance.toFixed(2)} D</span>
                </div>
            `;
            document.getElementById('acc-info').innerText = "Logged in as: " + user.username;
        }
    }

    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*');
        document.getElementById('market-list').innerHTML = data?.map(m => `
            <div class="market-card">
                <div>
                    <h3 style="margin:0; font-weight:900;">${m.title}</h3>
                    <small style="color:#8899a6;">${new Date(m.start_time).toLocaleString()}</small>
                </div>
                <div style="font-weight:900; color:${m.type=='DEMO' ? 'var(--demo)' : 'var(--primary)'}">${m.type}</div>
            </div>
        `).join('') || "No active markets found.";
    }

    function toggleModal(s) { document.getElementById('create-modal').classList.toggle('hidden', !s); }
    window.onload = () => { updateNav(); loadMarkets(); };
</script>
</body>
</html>
