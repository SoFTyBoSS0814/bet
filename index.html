<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; border-left: 4px solid var(--primary); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 450px; border: 1px solid #2c4f60; color: white; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-primary:hover { opacity: 0.8; }
        .btn-bet { background:#0b1218; border:1px solid #334756; color:#fff; padding:12px; border-radius:10px; cursor:pointer; text-align:center; transition: 0.2s; }
        .btn-bet:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.1); }
        .hidden { display: none !important; }
        label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="#" class="logo">STAKEFORGE</a>
    <div class="nav-right">
        <button class="btn-primary" style="width:auto;" onclick="openCreateModal()">+ Új Piac</button>
        <button onclick="logout()" style="background:#441111; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Logout</button>
    </div>
</div>

<div class="container">
    <h2>Élő Piacok</h2>
    <div id="market-list">Betöltés...</div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box" style="width: 500px;">
        <h2 style="margin-top:0; color:var(--primary);">Piac Létrehozása</h2>
        <label>Esemény Neve</label>
        <input id="m-name" placeholder="pl. Littler vs Price">
        
        <label>Kezdési Időpont</label>
        <input id="m-date" type="datetime-local">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
                <label>Típus</label>
                <select id="m-type"><option value="DEMO">DEMO (D)</option><option value="REAL">REAL (€)</option></select>
            </div>
            <div>
                <label>Büdzsé (Take)</label>
                <input id="m-budget" type="number" value="1000">
            </div>
        </div>

        <label>Kimenetelek</label>
        <div id="manual-outcomes">
            <div class="outcome-row" style="display:flex; gap:10px; margin-bottom:10px;">
                <input class="o-n" placeholder="Név (pl. Hazai)" style="margin:0;">
                <input class="o-o" type="number" step="0.01" placeholder="Odds" style="margin:0; width:100px;">
            </div>
            <div class="outcome-row" style="display:flex; gap:10px; margin-bottom:10px;">
                <input class="o-n" placeholder="Név (pl. Vendég)" style="margin:0;">
                <input class="o-o" type="number" step="0.01" placeholder="Odds" style="margin:0; width:100px;">
            </div>
        </div>

        <button class="btn-primary" onclick="saveMarket()">Mentés és Publikálás</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#888; width:100%; cursor:pointer; margin-top:10px;">Mégse</button>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width: 320px;">
        <h3 id="bet-outcome-name" style="margin:0; color:var(--primary);">Kimenetel</h3>
        <p id="bet-odds-display" style="font-size:24px; font-weight:bold; margin:10px 0; color:white;"></p>
        
        <label>Tét összege</label>
        <input id="bet-amount" type="number" value="100" oninput="calculateWin()">
        
        <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #334756;">
            <small style="color:#888;">Várható nyeremény:</small>
            <div id="potential-win" style="font-size:18px; font-weight:bold; color:var(--demo);">0.00</div>
        </div>

        <button class="btn-primary" onclick="placeFinalBet()">Fogadás Megtétele</button>
        <button onclick="closeBetModal()" style="background:none; border:none; color:#888; width:100%; cursor:pointer; margin-top:10px;">Mégse</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));
    let activeBetData = null;

    async function saveMarket() {
        const name = document.getElementById('m-name').value;
        const date = document.getElementById('m-date').value;
        const budget = parseFloat(document.getElementById('m-budget').value) || 0;
        
        const outcomes = [];
        document.querySelectorAll('.outcome-row').forEach(div => {
            const n = div.querySelector('.o-n').value;
            const o = div.querySelector('.o-o').value;
            if(n && o) outcomes.push({ n, o }); // Kötelező 'n' és 'o' kulcsok
        });

        if(outcomes.length === 0) return alert("Adj meg legalább egy kimenetelt!");

        // FONTOS: odd_x nem lehet NULL az adatbázisodban
        const { error } = await _supabase.from('markets').insert([{
            title: name,
            start_time: date,
            take: budget,
            type: document.getElementById('m-type').value,
            stake: 0,
            note: JSON.stringify(outcomes),
            odd_1: outcomes[0] ? parseFloat(outcomes[0].o) : 0,
            odd_x: 0, // Ez javítja a "null value in column odd_x" hibát
            odd_2: outcomes[1] ? parseFloat(outcomes[1].o) : 0,
            creator_name: currentUser ? currentUser.username : "Admin"
        }]);

        if(!error) { 
            alert("Sikeres mentés!"); 
            closeModal(); 
            loadMarkets(); 
        } else { 
            alert("Hiba: " + error.message); 
        }
    }

    async function loadMarkets() {
        const { data, error } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        if(error) return console.error(error);

        const list = document.getElementById('market-list');
        list.innerHTML = "";

        data?.forEach(m => {
            let outcomes = [];
            try { 
                // A 'note' oszlopból olvassuk a JSON-t
                outcomes = JSON.parse(m.note || "[]"); 
            } catch(e) { outcomes = []; }

            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:start;">
                    <div>
                        <h3 style="margin:0; color:white;">${m.title || "Névtelen esemény"}</h3>
                        <small style="color:#888;">${m.start_time ? new Date(m.start_time).toLocaleString('hu-HU') : 'Nincs időpont'}</small>
                    </div>
                    <b style="color:var(--demo); font-size:12px;">${m.type}</b>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
                    ${outcomes.map(o => `
                        <button class="btn-bet" onclick="handleBet('${m.id}', '${o.n}', ${o.o})">
                            <div style="font-size:10px; color:#8899a6; margin-bottom:2px;">${o.n}</div>
                            <div style="font-size:16px; font-weight:bold; color:var(--primary);">${o.o}</div>
                        </button>
                    `).join('')}
                </div>
            `;
            list.appendChild(card);
        });
    }

    function handleBet(id, name, odds) {
        activeBetData = { id, name, odds };
        document.getElementById('bet-outcome-name').innerText = name;
        document.getElementById('bet-odds-display').innerText = odds.toFixed(2);
        document.getElementById('betModal').classList.remove('hidden'); // Alert helyett modal
        calculateWin();
    }

    function calculateWin() {
        const amt = parseFloat(document.getElementById('bet-amount').value) || 0;
        document.getElementById('potential-win').innerText = (amt * (activeBetData?.odds || 0)).toFixed(2);
    }

    function placeFinalBet() {
        alert("Fogadás sikeres: " + activeBetData.name + " (" + activeBetData.odds + ")");
        closeBetModal();
    }

    function openCreateModal() { document.getElementById("createModal").classList.remove("hidden"); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function closeBetModal() { document.getElementById("betModal").classList.add("hidden"); }
    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }

    window.onload = () => { if(!currentUser) window.location.href="login.html"; loadMarkets(); };
</script>
</body>
</html>
