<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 15px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; text-decoration: none; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; border-left: 4px solid var(--primary); }
        .group-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-top: 10px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 900px; max-width: 95vw; max-height: 92vh; overflow-y: auto; border: 1px solid #2c4f60; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 12px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; }

        .event-group { background: rgba(255,255,255,0.03); border: 1px solid #2c4f60; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .outcome-item { background: #14212b; padding: 10px; border-radius: 6px; border: 1px solid #253948; }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: none; border: 1px dashed #444; color: #888; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="#" class="logo">STAKEFORGE</a>
        <div class="nav-links">
            <a onclick="showSection('markets')" id="nav-markets" class="active">Markets</a>
            <a onclick="showSection('wallet')" id="nav-wallet">Wallet</a>
            <a onclick="showSection('account')" id="nav-account">Account</a>
            <a onclick="showSection('settings')" id="nav-settings">Settings</a>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-danger" style="background:#441111" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div class="section-header">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Betöltés...</div>
    </div>
    <div id="section-wallet" class="section"><h2>Wallet</h2></div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px;">
             <button class="btn-primary" onclick="saveMarket()">💾 Mentés</button>
             <button class="btn-danger" onclick="closeModal()">Mégse</button>
        </div>
        
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
            <div><label>Esemény Neve *</label><input id="m-name" placeholder="pl. Man City vs Real Madrid"></div>
            <div><label>Határidő *</label><input id="m-date" type="datetime-local" min="2024-01-01T00:00" max="2099-12-31T23:59"></div>
        </div>
        
        <label>Szabályok / Megjegyzés</label>
        <textarea id="m-desc" rows="2"></textarea>

        <div style="display:flex; align-items:center; gap:20px; background:rgba(0,0,0,0.3); padding:15px; border-radius:10px; border:1px solid #334756; margin-bottom:20px;">
            <div style="flex:1;"><label>Költségvetés (Take)</label><input id="m-budget" type="number" value="1000"></div>
            <div style="flex:1;">
                <label>Számla típusa</label>
                <select id="m-type" onchange="updateModalBalance()">
                    <option value="DEMO">DEMO (D)</option>
                    <option value="REAL">REAL (€)</option>
                </select>
            </div>
            <div style="text-align:right; min-width: 140px;">
                <label>Elérhető egyenleg:</label>
                <div id="modal-balance-display" style="font-weight:bold; color:var(--primary); font-size: 16px;">0.00 D</div>
            </div>
        </div>

        <div id="event-types-container"></div>
        <button class="btn-outline" onclick="addEventType()">+ Új Eseménytípus (MAX 8)</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));
    let groupCount = 0;

    async function refreshBalances() {
        if(!currentUser) return;
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
            window.userBalances = data;
            updateModalBalance();
        }
    }

    function updateModalBalance() {
        const type = document.getElementById('m-type').value;
        const display = document.getElementById('modal-balance-display');
        if(!window.userBalances) return;
        if(type === 'REAL') { display.innerText = window.userBalances.real_balance.toFixed(2) + " €"; display.style.color = "var(--primary)"; }
        else { display.innerText = window.userBalances.demo_balance.toFixed(2) + " D"; display.style.color = "var(--demo)"; }
    }

    function addEventType() {
        if(groupCount >= 8) return;
        groupCount++;
        const container = document.getElementById('event-types-container');
        const div = document.createElement('div');
        div.className = 'event-group';
        const gid = groupCount;
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <input class="g-name" style="width:70%; font-weight:bold;" placeholder="pl. Gólszám">
                <button class="btn-danger" style="padding:5px 10px;" onclick="this.parentElement.parentElement.remove(); groupCount--;">Törlés</button>
            </div>
            <div class="outcomes-grid" id="grid-${gid}">
                <div class="outcome-item"><label>Név</label><input class="o-n"><label>Odds</label><input class="o-o" type="number" step="0.01" value="1.00"></div>
                <div class="outcome-item"><label>Név</label><input class="o-n"><label>Odds</label><input class="o-o" type="number" step="0.01" value="1.00"></div>
            </div>
            <button class="btn-outline" style="font-size:11px; padding:5px;" onclick="addOutcomeToGroup(${gid})">+ Új kimenetel (MAX 6)</button>
        `;
        container.appendChild(div);
    }

    function addOutcomeToGroup(gid) {
        const grid = document.getElementById(`grid-${gid}`);
        if(grid.querySelectorAll('.outcome-item').length >= 6) return alert("Max 6 mező!");
        const div = document.createElement('div');
        div.className = 'outcome-item';
        div.innerHTML = `<label>Név</label><input class="o-n"><label>Odds</label><input class="o-o" type="number" step="0.01" value="1.00">`;
        grid.appendChild(div);
    }

    // FIX MENTÉS: Tábla oszlopnevek szinkronizálva
    async function saveMarket() {
        const name = document.getElementById('m-name').value;
        const date = document.getElementById('m-date').value;
        if(!name || !date) return alert("Név és dátum kötelező!");

        const groups = [];
        document.querySelectorAll('.event-group').forEach(g => {
            const outcomes = [];
            g.querySelectorAll('.outcome-item').forEach(o => {
                outcomes.push({ n: o.querySelector('.o-n').value, o: parseFloat(o.querySelector('.o-o').value) });
            });
            groups.push({ title: g.querySelector('.g-name').value, outcomes });
        });

        // Hibaüzenetek alapján javított oszlopok: title, start_time, take, stake, odd_1, note
        const { error } = await _supabase.from('markets').insert([{
            title: name,
            start_time: date,
            take: parseFloat(document.getElementById('m-budget').value),
            type: document.getElementById('m-type').value,
            stake: 0,
            note: JSON.stringify(groups),
            odd_1: groups[0]?.outcomes[0]?.o || 0,
            creator_name: currentUser.username || "Admin",
            max_stake: 100
        }]);

        if(!error) { 
            alert("Sikeres mentés!"); 
            closeModal(); 
            loadMarkets(); 
        } else {
            alert("Hiba: " + error.message);
        }
    }

async function loadMarkets() {
        const { data, error } = await _supabase
            .from('markets')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) return console.error("Hiba:", error);

        const list = document.getElementById('market-list');
        list.innerHTML = "";

        data?.forEach(m => {
            let groups = [];
            try {
                // A 'note' oszlop tartalmazza a manuális kimeneteleket
                groups = JSON.parse(m.note || "[]");
            } catch (e) {
                groups = m.market_data?.groups || [];
            }

            const marketCard = document.createElement('div');
            marketCard.className = 'market-card';
            marketCard.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <h3 style="margin:0; font-size:18px;">${m.title || m.event_name}</h3>
                    <b style="color:${m.type === 'DEMO' ? 'var(--demo)' : 'var(--primary)'}; font-size:12px;">${m.type}</b>
                </div>
                <div style="font-size:11px; color:#888; margin-bottom:15px;">
                    ${m.start_time ? new Date(m.start_time).toLocaleString('hu-HU') : ''}
                </div>
                <div id="groups-container-${m.id}"></div>
            `;

            const groupsContainer = marketCard.querySelector(`#groups-container-${m.id}`);
            
            groups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-box';
                groupDiv.innerHTML = `
                    <div style="font-size:12px; font-weight:bold; margin-bottom:10px; color:#aaa; text-transform:uppercase;">${group.title}</div>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap:10px;">
                        ${(group.outcomes || []).map(o => `
                            <button class="btn-bet" onclick="handleBet('${m.id}', '${o.n || o.name}', ${o.o || o.odds})"
                                    style="background:#0b1218; border:1px solid #334756; color:#fff; padding:12px; border-radius:10px; cursor:pointer; text-align:center; transition:0.2s;">
                                <div style="font-size:10px; color:#8899a6; margin-bottom:4px;">${o.n || o.name}</div>
                                <div style="font-size:16px; font-weight:bold; color:var(--primary);">${o.o || o.odds}</div>
                            </button>
                        `).join('')}
                    </div>
                `;
                groupsContainer.appendChild(groupDiv);
            });

            list.appendChild(marketCard);
        });
    }

    // Ezt a függvényt is add hozzá alá, hogy működjön a gombra kattintás
    function handleBet(marketId, outcomeName, odds) {
        alert("Kiválasztott kimenetel: " + outcomeName + " (" + odds + ")");
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        if(id === 'markets') loadMarkets();
    }

    function openCreateModal() { document.getElementById("createModal").classList.remove("hidden"); refreshBalances(); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }

    window.onload = () => { if(!currentUser) window.location.href="login.html"; refreshBalances(); loadMarkets(); };
</script>
</body>
</html>
