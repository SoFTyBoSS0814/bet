<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | P2P Cloud Betting</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* NAVBAR - EREDETI STÍLUS */
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 100; height: 70px; }
        .nav-left-group { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 15px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; text-decoration: none; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-info { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 15px; font-weight: bold; }
        
        .btn-logout { background: none; border: 1px solid #ff4444; color: #ff4444; padding: 0 15px; border-radius: 6px; cursor: pointer; font-size: 13px; height: 40px; transition: 0.2s; font-weight: bold; }

        /* MARKETS HEADER */
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-create-inline { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }

        /* CARD STYLE */
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 18px; border-left: 5px solid var(--primary); position: relative; }
        .odds { display: flex; gap: 10px; margin-top: 15px; }
        .odd { flex: 1; background: #2a3e4d; padding: 15px; text-align: center; border-radius: 8px; }
        .odd b { color: var(--primary); font-size: 22px; display: block; }
        
        /* ÚJ PIAC LÉTREHOZÁS MODAL - SÖTÉT STÍLUSBAN */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; border: 1px solid #2c4f60; color: #fff; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
        .m-btn { padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 18px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; }
        label { font-size: 12px; color: #888; font-weight: bold; text-transform: uppercase; }
        
        /* HORIZONTÁLIS BEÁLLÍTÁSSÁV */
        .config-row { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 20px; margin-bottom: 20px; border: 1px solid #334756; }
        .config-item { display: flex; flex-direction: column; }
        .config-item label { margin-bottom: 4px; font-size: 10px; }
        .config-item input, .config-item select { margin: 0; padding: 8px; width: auto; }

        /* ODDS CSOPORT */
        .odds-group { border: 1px solid #334756; border-radius: 10px; padding: 20px; background: rgba(255,255,255,0.03); }
        .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .odd-input-card { background: #0b1218; border: 1px solid #334756; padding: 15px; border-radius: 8px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left-group">
        <a href="#" class="logo">STAKEFORGE</a>
        <div class="nav-links">
            <a id="link-markets" onclick="showSection('markets')" class="active">Markets</a>
            <a id="link-wallet" onclick="showSection('wallet')">Wallet</a>
            <a id="link-account" onclick="showSection('account')">Account</a>
            <a id="link-settings" onclick="showSection('settings')">Settings</a>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-info">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets">
        <div class="section-header">
            <h2>Live P2P Markets</h2>
            <button class="btn-create-inline" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Töltés...</div>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-actions">
            <button class="m-btn" style="background: #334756; color: #fff;">📋 Beillesztés</button>
            <button class="m-btn" style="background: var(--primary); color: #000;" onclick="handleMarketSubmit()">💾 Mentés</button>
            <button class="m-btn" style="background: #ff4444; color: #fff;" onclick="closeModals()">❌ Mégse</button>
        </div>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 2;">
                <label>Esemény neve *</label>
                <input id="m-title" placeholder="pl. Gerwyn Price - Michael Smith">
            </div>
            <div style="flex: 1;">
                <label>Határidő *</label>
                <input id="m-deadline" type="datetime-local">
            </div>
        </div>

        <label>Leírás / Megjegyzés</label>
        <textarea id="m-note" rows="2" placeholder="Szabályok..."></textarea>

        <div class="config-row">
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="m-full-bal" style="width: 18px; margin: 0;">
                <label style="margin: 0;">Teljes egyenleg</label>
            </div>
            <div class="config-item">
                <label>Költségvetés</label>
                <input id="m-vol" type="number" style="width: 100px;" value="1000">
            </div>
            <div class="config-item">
                <label>Számla típusa</label>
                <select id="m-type" onchange="refreshBalances()" style="width: 150px;">
                    <option value="REAL">REAL</option>
                    <option value="DEMO" selected>DEMO</option>
                </select>
            </div>
            <div style="flex-grow: 1; text-align: right;">
                <span id="m-max-display" style="color: var(--primary); font-weight: bold;">Egyenleg: 0.00</span>
            </div>
        </div>

        <div class="odds-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <input id="m-group-title" style="margin: 0; width: 60%; background: none; border: none; border-bottom: 1px solid #334756; font-weight: bold; font-size: 16px;" value="Mérkőzés győztese">
                <button class="m-btn" style="background: #2a3e4d; font-size: 12px;">➕ Új csoport</button>
            </div>
            
            <div class="odds-grid">
                <div class="odd-input-card">
                    <label>Kimenetel (1)</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input id="m-o1-name" style="margin: 0;" value="Hazai">
                        <input id="m-o1" type="number" step="0.01" style="width: 80px; margin: 0; text-align: center;" placeholder="1.95">
                    </div>
                </div>
                <div class="odd-input-card">
                    <label>Kimenetel (2)</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input id="m-o2-name" style="margin: 0;" value="Vendég">
                        <input id="m-o2" type="number" step="0.01" style="width: 80px; margin: 0; text-align: center;" placeholder="1.95">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));
    let balances = { REAL: 0, DEMO: 0 };

    window.onload = async () => {
        if(!currentUser) return window.location.href="login.html";
        await refreshBalances();
        fetchMarkets();
    };

    async function refreshBalances() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            balances.REAL = data.real_balance;
            balances.DEMO = data.demo_balance;
            document.getElementById("nav-real").innerText = balances.REAL.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = balances.DEMO.toFixed(2) + " D";
            const type = document.getElementById("m-type").value;
            document.getElementById("m-max-display").innerText = "Egyenleg: " + (type === 'REAL' ? balances.REAL.toFixed(2) + ' €' : balances.DEMO.toFixed(2) + ' D');
        }
    }

    function openCreateModal() { document.getElementById("createModal").classList.remove("hidden"); refreshBalances(); }
    function closeModals() { document.getElementById("createModal").classList.add("hidden"); }

    async function handleMarketSubmit() {
        const vol = parseFloat(document.getElementById("m-vol").value);
        const type = document.getElementById("m-type").value;
        if(vol > balances[type]) return alert("Nincs elég fedezet!");

        const payload = {
            title: document.getElementById("m-title").value,
            group_title: document.getElementById("m-group-title").value,
            odd_1: parseFloat(document.getElementById("m-o1").value),
            odd_2: parseFloat(document.getElementById("m-o2").value),
            start_time: new Date(document.getElementById("m-deadline").value).toISOString(),
            creator_name: currentUser.username,
            type: type,
            max_stake: vol
        };

        const { error } = await _supabase.from('markets').insert([payload]);
        if(error) alert(error.message); else location.reload();
    }

    async function fetchMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById("market-list");
        list.innerHTML = "";
        data.forEach(m => {
            list.innerHTML += `
                <div class="card">
                    <b style="font-size:18px;">${m.title}</b><br>
                    <small style="color:#888;">${m.group_title || 'Market'} | Creator: ${m.creator_name}</small>
                    <div class="odds">
                        <div class="odd">1<b>${m.odd_1}</b></div>
                        <div class="odd">2<b>${m.odd_2}</b></div>
                    </div>
                </div>`;
        });
    }

    function logout() { localStorage.removeItem("user"); location.reload(); }
</script>
</body>
</html>
