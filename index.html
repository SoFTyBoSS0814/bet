<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Liquidity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; --warning: #ffa500; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .btn-bet:disabled { opacity: 0.4; cursor: not-allowed; border-color: #222; }
        .btn-view-bets { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-view-bets:hover { background: var(--primary); color: #000; }
        
        .btn-create { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        .hidden { display: none !important; }

        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; }
        
        /* Table styles for modal */
        .bets-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .bets-table th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: #aaa; }
        .bets-table td { padding: 8px; border-bottom: 1px dotted #333; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-create" onclick="openCreateModal()">+ Create</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>

    <div id="section-history" class="section">
        <h2>Settled Markets</h2>
        <div id="history-list"></div>
    </div>

    <div id="section-wallet" class="section">
        <div class="market-card" style="max-width:500px; margin:auto; text-align:center;">
            <h2>Wallet & Deposits</h2>
            <div id="geo-restriction" style="display:none; color:var(--danger); margin-bottom:15px; font-weight:bold;">⚠️ Region restricted (HU)</div>
            
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <div style="flex:1; padding:15px; border:1px solid var(--border); border-radius:12px;">
                    <small>REAL</small><h2 id="w-real" style="color:var(--primary); margin:5px 0;">0.00 €</h2>
                </div>
                <div style="flex:1; padding:15px; border:1px solid var(--border); border-radius:12px;">
                    <small>DEMO</small><h2 id="w-demo" style="color:var(--demo); margin:5px 0;">0.00 D</h2>
                </div>
            </div>

            <div id="btc-wallet-area"></div>

            <div class="reward-box" style="margin-top:20px; border:1px dashed var(--demo); padding:20px; border-radius:12px;">
                <h3 style="margin:0; color:var(--demo)">Daily Mystery Box</h3>
                <div id="reward-msg" style="margin:10px 0; font-weight:bold;"></div>
                <button id="btn-claim-reward" class="btn-primary" style="background:var(--demo)" onclick="claimDailyDemo()">TRY MY LUCK</button>
            </div>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="market-card" style="max-width:450px; margin:auto;">
            <h2 style="text-align:center">Account Profile</h2>
            <div style="background:rgba(0,0,0,0.2); padding:20px; border-radius:12px; margin:20px 0;">
                <p id="acc-username" style="font-weight:bold; font-size:18px; margin:0;">-</p>
                <p id="acc-email" style="color:#aaa; margin:5px 0;">-</p>
                <p id="acc-id" style="font-family:monospace; font-size:11px; color:var(--primary); margin-top:10px;">-</p>
            </div>
            <button class="btn-bet" onclick="logout()" style="color:var(--danger); border-color:var(--danger);">LOG OUT</button>
        </div>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10" oninput="calcWin()">
        <p id="bet-win-text">Payout: 0.00</p>
        <button class="btn-primary" onclick="placeBet()">PLACE BET</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')">Cancel</button>
    </div>
</div>

<div id="viewBetsModal" class="modal hidden">
    <div class="modal-box" style="width:450px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Market Transparency</h3>
            <span onclick="closeModal('viewBetsModal')" style="cursor:pointer; font-size:24px;">&times;</span>
        </div>
        <p id="transparency-msg" style="font-size:12px; color:#aaa;"></p>
        <div id="bets-table-container"></div>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>New Market</h3>
        <select id="m-type" onchange="updateCreateBalanceDisplay()"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select>
        <input id="m-name" placeholder="Event Name">
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Initial Liquidity Pool">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px; border-style:dashed">+ Add Category</button>
        <button class="btn-primary" style="margin-top:20px" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="settle-title"></h3>
        <div id="settle-area"></div>
        <button class="btn-primary" style="margin-top:20px; background:var(--success)" onclick="finalSubmitSettle()">FINALIZE</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('settleModal')">Cancel</button>
    </div>
</div>

<script src="bitcoin.js"></script>
<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let activeBet = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
        checkIP();
        setInterval(updateRewardUI, 1000);
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        // UI frissítés
        const updateUI = (prefix) => {
            document.getElementById(`${prefix}-real`).innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById(`${prefix}-demo`).innerText = data.demo_balance.toFixed(2) + " D";
        };
        updateUI('nav'); updateUI('w');
        document.getElementById("acc-username").innerText = currentUser.username;
        document.getElementById("acc-email").innerText = currentUser.email || "N/A";
        document.getElementById("acc-id").innerText = currentUser.id;

        // Bitcoin.js inicializálása
        if(typeof checkIPAndRenderWallet === 'function') checkIPAndRenderWallet();
    }

    // --- VIEW ALL BETS LOGIKA ---
    async function viewAllBets(matchId, deadlineISO) {
        const now = new Date();
        const deadline = new Date(deadlineISO);
        const publicTime = new Date(deadline.getTime() + 3600000); // +1 óra
        const isAdmin = userProfile.is_admin === true; // Ha van ilyen meződ

        if (!isAdmin && now < publicTime) {
            const diff = Math.ceil((publicTime - now) / 60000);
            alert(`Transparency protection active. Data will be public in ${diff} minutes (1h after deadline).`);
            return;
        }

        try {
            const { data: bets, error } = await _supabase
                .from('bets')
                .select('username, amount, outcome_name, created_at')
                .eq('market_id', matchId);

            if (error) throw error;

            const container = document.getElementById('bets-table-container');
            document.getElementById('transparency-msg').innerText = isAdmin ? "Admin View Mode" : "Public Audit Data";
            
            if (!bets.length) {
                container.innerHTML = "<p>No bets placed on this market yet.</p>";
            } else {
                container.innerHTML = `
                    <table class="bets-table">
                        <thead><tr><th>User</th><th>Pick</th><th>Stake</th></tr></thead>
                        <tbody>
                            ${bets.map(b => `<tr><td>${b.username}</td><td style="color:var(--primary)">${b.outcome_name}</td><td>${b.amount}</td></tr>`).join('')}
                        </tbody>
                    </table>`;
            }
            document.getElementById('viewBetsModal').classList.remove('hidden');
        } catch (e) { console.error(e); }
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list');
        const hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            const isExpired = new Date(m.deadline) < new Date();
            const symbol = m.type === 'REAL' ? '€' : 'D';

            if(m.status === 'active') {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.innerHTML = `
                    <div class="market-header">
                        <div><h2 style="margin:0;">${m.title}</h2><small>Pool: ${parseFloat(m.take).toFixed(2)} ${symbol}</small></div>
                        ${m.creator_name === currentUser.username ? `<button onclick="openSettle('${m.id}','${m.title}')" class="btn-create">SETTLE</button>` : ''}
                    </div>
                    ${groups.map(g => `<div class="market-group"><small>${g.title}</small>
                        <div class="outcomes-grid">
                            ${g.outcomes.map(o => `<button class="btn-bet" onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}','${m.deadline}')" ${isExpired ? 'disabled' : ''}>${o.n}<br><b>${o.o}</b></button>`).join('')}
                        </div>
                    </div>`).join('')}
                    <button class="btn-view-bets" onclick="viewAllBets('${m.id}', '${m.deadline}')">🔍 VIEW ALL BETS</button>
                `;
                mList.appendChild(card);
            } else {
                // History kártya (leegyszerűsítve)
                const card = document.createElement('div'); card.className = 'market-card';
                card.innerHTML = `<h3>${m.title} (Settled)</h3><button class="btn-view-bets" onclick="viewAllBets('${m.id}', '${m.deadline}')">🔍 AUDIT LOG</button>`;
                hList.appendChild(card);
            }
        });
    }

    // --- SEGÉDFÜGGVÉNYEK ---
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('link-' + id).classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    async function checkIP() {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if(data.country_code === 'HU') document.getElementById('geo-restriction').style.display = 'block';
    }
    function logout() { localStorage.clear(); window.location.href="login.html"; }

    // (A többi funkciót - addGroup, saveMarket, openBet stb. - tartsd meg a korábbi kódodból!)
</script>
</body>
</html>
