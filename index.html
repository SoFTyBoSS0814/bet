
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Professional Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --warning: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links span { color: #aaa; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }
        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; position: relative; }
        .market-meta { display: flex; gap: 15px; font-size: 11px; color: #8899a6; margin-top: 5px; }
        .market-group { background: rgba(255,255,255,0.03); border: 1px solid #2c4f60; border-radius: 10px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; text-align: center; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .btn-outline { background: none; border: 1px solid #334756; color: var(--primary); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .btn-outline:disabled { color: #555 !important; border-color: #222 !important; cursor: not-allowed; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid #2c4f60; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none !important; }

        .balance-badge { background: rgba(0,212,255,0.1); padding: 12px; border-radius: 8px; border: 1px solid var(--primary); margin-bottom: 20px; display: flex; justify-content: space-between; }
        .bets-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .bets-table th, .bets-table td { text-align: left; padding: 12px; border-bottom: 1px solid #334756; font-size: 13px; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <div class="logo" onclick="window.location.reload()">STAKEFORGE</div>
        <div class="nav-links">
            <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
            <span id="link-history" onclick="showSection('history')">History</span>
            <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
            <span id="link-account" onclick="showSection('account')">Account</span>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2>Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Betöltés...</div>
    </div>

    <div id="section-history" class="section">
        <h2>Closed Events</h2>
        <div id="history-list">Nincsenek lezárt események.</div>
    </div>

    <div id="section-wallet" class="section">
        <div class="market-card" style="text-align:center; max-width: 600px; margin: auto;">
            <h2>Wallet</h2>
            <div id="wallet-dynamic-area"></div>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="market-card" style="max-width: 500px; margin: auto;">
            <h2>Account</h2>
            <p id="acc-username"></p>
            <p id="acc-email"></p>
            <button class="btn-danger" style="width:100%" onclick="logout()">Logout</button>
        </div>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h2 style="color:var(--primary)">Create New Market</h2>
        <div class="balance-badge">
            <span>Elérhető egyenleged:</span>
            <b id="modal-balance-display">0.00</b>
        </div>
        <label>Event Name</label>
        <input id="m-name" placeholder="pl. Real Madrid vs Barcelona">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <div>
                <label>Currency</label>
                <select id="m-type" onchange="updateModalBalance()">
                    <option value="DEMO">DEMO</option>
                    <option value="REAL">REAL</option>
                </select>
            </div>
            <div>
                <label>Host Budget (Liquidity)</label>
                <input id="m-budget" type="number" value="100" oninput="checkLiquidity()">
            </div>
        </div>
        <div id="liquidity-warning" style="color:var(--danger); font-size:12px; margin-bottom:10px; display:none;">⚠️ Nincs elég fedezeted!</div>
        <div id="groups-container"></div>
        <button class="btn-outline" style="border-style:dashed; margin-top:10px;" onclick="addGroup()">+ Add Category</button>
        <div style="display:flex; gap:10px; margin-top:30px;">
            <button id="save-market-btn" class="btn-primary" style="flex:2" onclick="saveMarket()">Publish</button>
            <button class="btn-danger" style="flex:1" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'YOUR_SUPABASE_URL'; 
    const SB_KEY = 'YOUR_SUPABASE_KEY'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let groupIdx = 0;
    const MAX_OUTCOMES = 6;

    async function fetchProfile() {
        if(!currentUser) return;
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            userProfile = data;
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
            updateAccountUI();
        }
    }

    function updateModalBalance() {
        const type = document.getElementById('m-type').value;
        const bal = type === 'REAL' ? userProfile.real_balance : userProfile.demo_balance;
        document.getElementById('modal-balance-display').innerText = bal.toFixed(2) + (type === 'REAL' ? ' €' : ' D');
        checkLiquidity();
    }

    function checkLiquidity() {
        const type = document.getElementById('m-type').value;
        const budget = parseFloat(document.getElementById('m-budget').value) || 0;
        const bal = type === 'REAL' ? userProfile.real_balance : userProfile.demo_balance;
        const warning = document.getElementById('liquidity-warning');
        const btn = document.getElementById('save-market-btn');
        const isLow = budget > bal;
        warning.style.display = isLow ? 'block' : 'none';
        btn.disabled = isLow;
        btn.style.opacity = isLow ? '0.5' : '1';
    }

    function addGroup(title = "") {
        groupIdx++;
        const div = document.createElement('div');
        div.className = 'market-group';
        div.innerHTML = `
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input class="g-title" placeholder="Category" value="${title}" style="margin:0;">
                <button class="btn-danger" onclick="this.parentElement.parentElement.remove()">✕</button>
            </div>
            <div id="grid-${groupIdx}" class="outcomes-grid"></div>
            <button id="add-btn-${groupIdx}" class="btn-outline" style="font-size:11px; width:auto;" onclick="addOutcome(${groupIdx})">+ Outcome</button>`;
        document.getElementById('groups-container').appendChild(div);
        addOutcome(groupIdx);
    }

    function addOutcome(id) {
        const grid = document.getElementById(`grid-${id}`);
        if(grid.children.length >= MAX_OUTCOMES) return;
        const div = document.createElement('div');
        div.style.display="flex"; div.style.gap="5px";
        div.innerHTML = `
            <input class="o-n" placeholder="Név" style="margin:0">
            <input class="o-o" type="number" step="0.1" value="2.0" style="width:70px; margin:0">
            <button class="btn-danger" style="padding:5px 10px;" onclick="this.parentElement.remove(); updateOutcomeLimit(${id})">✕</button>`;
        grid.appendChild(div);
        updateOutcomeLimit(id);
    }

    function updateOutcomeLimit(id) {
        const btn = document.getElementById(`add-btn-${id}`);
        const count = document.getElementById(`grid-${id}`).children.length;
        btn.disabled = count >= MAX_OUTCOMES;
        btn.innerText = count >= MAX_OUTCOMES ? "Limit (6/6)" : "+ Outcome";
    }

    async function saveMarket() {
        const title = document.getElementById('m-name').value;
        const type = document.getElementById('m-type').value;
        const budget = parseFloat(document.getElementById('m-budget').value);
        const groups = [];

        document.querySelectorAll('.market-group').forEach(g => {
            const outcomes = [];
            g.querySelectorAll('.outcomes-grid > div').forEach(oDiv => {
                const n = oDiv.querySelector('.o-n').value;
                const o = parseFloat(oDiv.querySelector('.o-o').value);
                if(n) outcomes.push({ n, o });
            });
            if(outcomes.length > 0) groups.push({ title: g.querySelector('.g-title').value || "Piac", outcomes });
        });

        if(!title || groups.length === 0) return alert("Hiba!");

        const balField = type === 'REAL' ? 'real_balance' : 'demo_balance';
        await _supabase.from('profiles').update({ [balField]: userProfile[balField] - budget }).eq('id', currentUser.id);
        await _supabase.from('markets').insert([{ title, type, take: budget, note: JSON.stringify(groups), creator_name: currentUser.username, status: 'active' }]);
        
        closeModal();
        fetchProfile();
        loadMarkets();
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        list.innerHTML = "";
        markets.filter(m => m.status === 'active').forEach(m => {
            let groups = JSON.parse(m.note || "[]");
            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <div><h3>${m.title}</h3><div class="market-meta">Host: ${m.creator_name} | Budget: <b>${m.take}</b></div></div>
                    <b style="color:${m.type==='REAL'?'var(--primary)':'var(--demo)'}">${m.type}</b>
                </div>
                ${groups.map(g => `<div class="market-group"><small>${g.title}</small><div class="outcomes-grid">${g.outcomes.map(o => `<button class="btn-bet"><div>${o.n}</div><b>${o.o.toFixed(2)}</b></button>`).join('')}</div></div>`).join('')}`;
            list.appendChild(card);
        });
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.getElementById('link-' + id).classList.add('active');
        if(id === 'markets') loadMarkets();
    }

    function updateAccountUI() {
        document.getElementById('acc-username').innerText = "User: " + currentUser.username;
        document.getElementById('acc-email').innerText = "Email: " + currentUser.email;
    }

    function openCreateModal() { 
        document.getElementById('groups-container').innerHTML = ""; 
        document.getElementById('createModal').classList.remove('hidden'); 
        addGroup(); 
        updateModalBalance();
    }
    function closeModal() { document.getElementById('createModal').classList.add('hidden'); }
    function logout() { localStorage.clear(); window.location.href="login.html"; }

    window.onload = () => { if(!currentUser) window.location.href="login.html"; fetchProfile(); loadMarkets(); };
</script>
</body>
</html>
