
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>StakeForge | Pro Custom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d4ff; --bg: #0b1218; --text: #fff; --card: #16212a; --danger: #ff4444; --demo: #ffff00; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        .navbar { background: #111b22; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 900; color: var(--primary); font-size: 24px; }
        
        /* EGYENLEG ÉS VOLATILITÁS */
        .wallet-display { display: flex; gap: 20px; font-weight: 800; font-size: 14px; }
        .bal-real { color: var(--primary); }
        .bal-demo { color: var(--demo); }
        .volatility { font-size: 10px; display: block; margin-top: -3px; opacity: 0.8; }

        .container { max-width: 900px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        /* MODAL DESIGN */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: var(--card); width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        
        input, select { background: #0b1218; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 14px; }
        label { display: block; font-size: 11px; color: #8899a6; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }

        .outcome-row { display: grid; grid-template-columns: 1fr 100px 40px; gap: 10px; margin-bottom: 10px; }
        .btn { padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; }
        .btn-primary { background: var(--primary); color: #0b1218; width: 100%; }
        .btn-add { background: rgba(255,255,255,0.05); color: #fff; border: 1px dashed var(--border); margin-bottom: 20px; }
        .btn-cancel { background: transparent; color: var(--danger); width: 100%; }
        
        .market-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">STAKEFORGE</div>
    <div id="user-balance" class="wallet-display"></div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1 style="margin:0; font-weight:900;">LIVE MARKETS</h1>
            <button class="btn btn-primary" style="width:auto; padding: 10px 20px;" onclick="toggleModal(true)">+ ÚJ PIAC</button>
        </div>
        <div id="market-list">Piacok betöltése...</div>
    </div>
</div>

<div id="market-modal" class="modal-bg hidden">
    <div class="modal-box">
        <h2 style="margin-top:0;">PIAC LÉTREHOZÁSA</h2>
        
        <label>Esemény neve *</label>
        <input id="m-title" placeholder="pl. Luke Littler vs Michael Smith">

        <label>Határidő (Deadline) *</label>
        <input id="m-start" type="datetime-local">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div>
                <label>Számla típusa</label>
                <select id="m-type" onchange="updateVolatilityPreview()">
                    <option value="DEMO">DEMO (D)</option>
                    <option value="REAL">REAL (€)</option>
                </select>
            </div>
            <div>
                <label>Költségvetés (Take)</label>
                <input id="m-take" type="number" value="1000" oninput="updateVolatilityPreview()">
            </div>
        </div>

        <div id="volatility-preview" style="font-size: 12px; color: var(--primary); margin-bottom: 15px; font-weight: bold;"></div>

        <label>Kimenetelek (Manuális)</label>
        <div id="outcome-container">
            <div class="outcome-row">
                <input class="o-name" placeholder="Piac neve (pl. Hazai)">
                <input class="o-odds" type="number" step="0.01" value="1.00">
                <button class="btn" style="background:none; color:var(--danger);" onclick="this.parentElement.remove()">✕</button>
            </div>
        </div>
        <button class="btn btn-add" onclick="addOutcomeRow()">+ KIMENETEL HOZZÁADÁSA</button>

        <button class="btn btn-primary" onclick="saveMarket()">MENTÉS ÉS PUBLIKÁLÁS</button>
        <button class="btn btn-cancel" onclick="toggleModal(false)">MÉGSE</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let user = JSON.parse(localStorage.getItem("user"));

    function addOutcomeRow() {
        const div = document.createElement('div');
        div.className = 'outcome-row';
        div.innerHTML = `<input class="o-name" placeholder="Név"><input class="o-odds" type="number" step="0.01" value="1.00"><button class="btn" style="background:none; color:var(--danger);" onclick="this.parentElement.remove()">✕</button>`;
        document.getElementById('outcome-container').appendChild(div);
    }

    // VOLATILITÁS MUTATÁSA KIVÁLASZTÁSKOR
    function updateVolatilityPreview() {
        const type = document.getElementById('m-type').value;
        const take = document.getElementById('m-take').value || 0;
        const currentBal = type === 'REAL' ? user.real_balance : user.demo_balance;
        const suffix = type === 'REAL' ? '€' : 'D';
        
        const preview = document.getElementById('volatility-preview');
        preview.innerHTML = `Várható egyenleg mentés után: ${(currentBal - take).toFixed(2)} ${suffix}`;
        preview.style.color = (currentBal - take) < 0 ? 'var(--danger)' : 'var(--primary)';
    }

    async function saveMarket() {
        const title = document.getElementById('m-title').value;
        const start = document.getElementById('m-start').value;
        const type = document.getElementById('m-type').value;
        const take = parseFloat(document.getElementById('m-take').value);

        if(!title || !start) return alert("Név és határidő kötelező!");

        const outcomes = [];
        document.querySelectorAll('.outcome-row').forEach(row => {
            const n = row.querySelector('.o-name').value;
            const o = row.querySelector('.o-odds').value;
            if(n) outcomes.push({ name: n, odds: parseFloat(o) });
        });

        const { error } = await _supabase.from('markets').insert([{
            title: title,
            start_time: start, //
            take: take, //
            type: type,
            stake: 0, //
            max_stake: 100,
            note: JSON.stringify(outcomes),
            creator_name: user ? user.username : "Admin",
            odd_1: outcomes[0]?.odds || 0
        }]);

        if(error) alert(error.message); else location.reload();
    }

    function updateNav() {
        if(user) {
            document.getElementById('user-balance').innerHTML = `
                <div><span class="bal-real">${user.real_balance.toFixed(2)} €</span><span class="volatility">REAL WALLET</span></div>
                <div><span class="bal-demo">${user.demo_balance.toFixed(2)} D</span><span class="volatility">DEMO WALLET</span></div>
            `;
        }
    }

    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*');
        document.getElementById('market-list').innerHTML = data?.map(m => `
            <div class="market-card">
                <b>${m.title}</b>
                <span style="float:right; color:${m.type=='DEMO' ? 'var(--demo)' : 'var(--primary)'}">${m.type}</span>
            </div>
        `).join('') || "Nincs aktív piac.";
    }

    function toggleModal(s) { document.getElementById('market-modal').classList.toggle('hidden', !s); if(s) updateVolatilityPreview(); }
    window.onload = () => { updateNav(); loadMarkets(); showSection('markets'); };
    function showSection(id) { document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-'+id)); }
</script>
</body>
</html>
