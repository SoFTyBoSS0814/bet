<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --warning: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links span { color: #aaa; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; transition: 0.2s; }
        .nav-links span:hover { color: #fff; }
        .nav-links span.active { color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .info-card { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #2c4f60; max-width: 600px; margin: auto; }
        
        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; position: relative; }
        .market-card.settled { opacity: 0.8; border-color: #444; }
        
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-bet:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.1); }
        
        .view-bets-btn { background: rgba(255,255,255,0.05); color: #88b0c0; padding: 4px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; margin-left: 10px; border: 1px solid #334756; }
        .view-bets-btn:hover { background: var(--primary); color: #000; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid #2c4f60; }
        .hidden { display: none !important; }

        .bet-row { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334756; display: flex; justify-content: space-between; align-items: center; }
        .bet-time { font-size: 10px; color: #666; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <div class="logo" onclick="window.location.reload()">STAKEFORGE</div>
        <div class="nav-links">
            <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
            <span id="link-history" onclick="showSection('history')">History</span>
            <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
            <span id="link-account" onclick="showSection('account')">Account</span>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Betöltés...</div>
    </div>

    <div id="section-history" class="section">
        <h2 style="margin-bottom:25px; color:#aaa;">Settled Events Archive</h2>
        <div id="history-list">Betöltés...</div>
    </div>

    <div id="section-wallet" class="section">
        <div class="info-card" style="text-align:center;">
            <h2>Wallet Balance</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div style="background: rgba(0, 212, 255, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--primary);">
                    <small>REAL</small><h1 id="wallet-real">0.00 €</h1>
                </div>
                <div style="background: rgba(255, 204, 0, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--demo);">
                    <small>DEMO</small><h1 id="wallet-demo">0.00 D</h1>
                </div>
            </div>
            <div id="wallet-dynamic-area"></div>
        </div>
    </div>
    </div>

<div id="viewBetsModal" class="modal hidden">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 id="view-bets-title" style="margin:0; color:var(--primary);">Market Bets</h3>
            <button class="btn-danger" onclick="closeViewBetsModal()">X</button>
        </div>
        <div id="market-bets-list"></div>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;

    async function fetchProfile() {
        if(!currentUser) return;
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            userProfile = data;
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        }
    }

    function showSection(id) { 
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); 
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('section-'+id).classList.add('active'); 
        document.getElementById('link-'+id).classList.add('active');
        if(id==='markets' || id==='history') loadMarkets();
    }

    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const marketList = document.getElementById('market-list');
        const historyList = document.getElementById('history-list');
        
        marketList.innerHTML = "";
        historyList.innerHTML = "";

        data?.forEach(m => {
            const isSettled = m.status === 'settled';
            const isOwner = currentUser && m.creator_name === currentUser.username;
            let groups = JSON.parse(m.note || "[]");

            const card = document.createElement('div');
            card.className = `market-card ${isSettled ? 'settled' : ''}`;
            
            card.innerHTML = `
                <div style="padding:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <h3 style="margin:0;">
                                ${m.title} 
                                <span class="view-bets-btn" onclick="viewMarketBets('${m.id}', '${m.title}')">VIEW ALL BETS</span>
                            </h3>
                            <div style="font-size:11px; color:#888; margin-top:5px;">Host: <b>${m.creator_name}</b> | Type: ${m.type}</div>
                        </div>
                        <div style="text-align:right;">
                            ${isSettled ? `<b style="color:var(--success)">SETTLED: ${m.winner}</b>` : `<b style="color:var(--primary)">ACTIVE</b>`}
                        </div>
                    </div>
                    ${!isSettled ? `
                        <div style="margin-top:15px; border-top:1px solid #2c4f60; padding-top:10px;">
                            ${groups.map(g => `
                                <div style="margin-bottom:10px;">
                                    <small style="color:#666;">${g.title}</small>
                                    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-top:5px;">
                                        ${g.outcomes.map(o => `
                                            <button class="btn-bet" onclick="handleBet('${m.id}', '${o.n}', ${o.o}, '${m.type}')">
                                                <span>${o.n}</span> <b style="color:var(--primary)">${o.o.toFixed(2)}</b>
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `<div style="margin-top:10px; font-size:12px; color:#555;">This event has ended. Check the bets to see winners.</div>`}
                </div>
            `;

            if(isSettled) historyList.appendChild(card);
            else marketList.appendChild(card);
        });
    }

    async function viewMarketBets(marketId, marketTitle) {
        const list = document.getElementById('market-bets-list');
        document.getElementById('view-bets-title').innerText = marketTitle;
        document.getElementById('viewBetsModal').classList.remove('hidden');
        list.innerHTML = "Checking permissions...";

        // 1. Ellenőrizzük a piac állapotát
        const { data: market } = await _supabase.from('markets').select('status').eq('id', marketId).single();
        
        // 2. Jogosultság ellenőrzése (Admin vagy Már lezárult piac)
        const isAdmin = userProfile && userProfile.role === 'ADMIN'; 
        const isSettled = market && market.status === 'settled';

        if (!isAdmin && !isSettled) {
            list.innerHTML = `
                <div style="text-align:center; padding:20px;">
                    <span style="font-size:40px;">🔒</span>
                    <p style="color:var(--danger); font-weight:bold;">Access Restricted</p>
                    <small>You can only view all bets once the event is settled.</small>
                </div>`;
            return;
        }

        // 3. Ha van jogosultság, lekérjük a fogadásokat
        const { data: bets } = await _supabase
            .from('bets')
            .select('*, profiles(username)')
            .eq('market_id', marketId)
            .order('created_at', { ascending: false });

        if(!bets || bets.length === 0) {
            list.innerHTML = "<p style='text-align:center; padding:20px; color:#666;'>No bets found for this market.</p>";
            return;
        }

        list.innerHTML = "";
        bets.forEach(b => {
            const div = document.createElement('div');
            div.className = 'bet-row';
            div.innerHTML = `
                <div>
                    <b style="color:var(--primary);">${b.profiles?.username || 'User'}</b>
                    <div style="font-size:11px;">${b.outcome_name}</div>
                    <div class="bet-time">${new Date(b.created_at).toLocaleString()}</div>
                </div>
                <div style="text-align:right;">
                    <b style="font-size:16px;">${b.amount} ${b.type==='REAL'?'€':'D'}</b>
                    <div style="font-size:10px; color:#888;">@ ${b.odds.toFixed(2)}</div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function closeViewBetsModal() {
        document.getElementById('viewBetsModal').classList.add('hidden');
    }

    // ... Minden más funkció (saveMarket, handleBet, settleMarket stb.) változatlan ...

    window.onload = () => { fetchProfile(); loadMarkets(); };
</script>
</body>
</html>
