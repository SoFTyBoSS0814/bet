<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* NAVBAR */
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left-group { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 15px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; text-decoration: none; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 900px; margin: auto; padding: 40px 20px; }
        .section { display: none; }
        .section.active { display: block; }
        
        /* HEADER GOMB STÍLUS */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-create { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-create:hover { opacity: 0.8; }

        /* MODAL (ÚJ PIACLÉTREHOZÁS) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; border: 1px solid #2c4f60; color: #fff; }
        .hidden { display: none !important; }

        /* TOVÁBBI STÍLUSOK... (marad az előzőek szerint) */
        .card-panel { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #334756; margin-bottom: 20px; }
        .btn-action { background: var(--primary); color: #000; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left-group">
        <a href="#" class="logo">STAKEFORGE</a>
        <div class="nav-links">
            <a onclick="showSection('markets')" id="nav-markets" class="active">Markets</a>
            <a onclick="showSection('wallet')" id="nav-wallet">Wallet</a>
            <a onclick="showSection('account')" id="nav-account">Account</a>
            <a onclick="showSection('settings')" id="nav-settings">Settings</a>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div class="section-header">
            <h2>Live P2P Markets</h2>
            <button class="btn-create" onclick="openCreateModal()">+ Piac Létrehozása</button>
        </div>
        <div id="market-list">Töltés...</div>
    </div>

    <div id="section-wallet" class="section">
        <h2>Saját Tárca</h2>
        <div class="card-panel">
            <div class="info-row"><span class="info-label">REAL</span> <b id="wallet-real-main" style="color:var(--primary)">0.00 €</b></div>
            <div class="info-row"><span class="info-label">DEMO</span> <b id="wallet-demo-main" style="color:var(--demo)">0.00 D</b></div>
            <div id="payment-actions" style="margin-top:20px;">
                <button class="btn-action">Deposit</button>
                <button class="btn-action" style="background:#334756; color:#fff; margin-left:10px;">Withdraw</button>
            </div>
            <div id="geo-notice" class="hidden" style="margin-top:20px; color:#888; font-style:italic;">A befizetés jelenleg nem érhető el az Ön régiójában.</div>
        </div>
    </div>
    
    </div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px;">
             <button class="btn-action" style="background: #334756; color: #fff;">📋 Beillesztés</button>
             <button class="btn-action" onclick="alert('Mentés...')">💾 Piac Mentése</button>
             <button class="btn-danger" onclick="closeModal()">❌ Mégse</button>
        </div>
        <p style="text-align:center; color:#888;">Új horizontális modal tartalom...</p>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));

    async function refreshBalances() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
            if(document.getElementById("wallet-real-main")) {
                document.getElementById("wallet-real-main").innerText = data.real_balance.toFixed(2) + " €";
                document.getElementById("wallet-demo-main").innerText = data.demo_balance.toFixed(2) + " D";
            }
        }
    }

    function openCreateModal() { document.getElementById("createModal").classList.remove("hidden"); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }

    async function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        await refreshBalances();
    }

    window.onload = async () => {
        if(!currentUser) return window.location.href="login.html";
        await refreshBalances();
    };

    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }
</script>
</body>
</html>
