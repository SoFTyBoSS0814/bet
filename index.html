<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Bet Wars Clone</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef2f5;
}

/* NAVBAR */
.navbar {
  background: #2f5f73;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: bold;
  font-size: 20px;
}

.menu {
  display: flex;
  gap: 20px;
}

.menu a {
  color: white;
  text-decoration: none;
}

/* TABS */
.tabs {
  background: #3b6f85;
  display: flex;
  justify-content: center;
}

.tab {
  padding: 15px 25px;
  color: white;
  cursor: pointer;
}

.tab.active {
  border-bottom: 3px solid orange;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
}

/* HEADER */
.card-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

/* ODDS */
.odds {
  display: flex;
  gap: 10px;
}

.odd {
  flex: 1;
  background: #f0f0f0;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
}

.odd:hover {
  background: #dbeeff;
}

/* LOGIN BUTTON */
.login-btn {
  background: white;
  color: #2f5f73;
  padding: 8px 15px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
}

.hidden {
  display: none;
}

.modal-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">BET-WARS</div>

  <div class="menu">
    <a href="#">Kezdőlap</a>
    <a href="#">Felhasználók</a>
    <a href="#">Csoportok</a>
  </div>

  <button class="login-btn" onclick="openLogin()">Login</button>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active">Feed</div>
  <div class="tab">Böngészés</div>
  <div class="tab">Saját események</div>
</div>

<!-- CONTENT -->
<div class="container">

  <div id="events"></div>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <h3>Login</h3>
    <input id="email" placeholder="email">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
  </div>
</div>

<script>
let user = null;

// SAMPLE EVENTS (mint backend helyett)
let events = [
  {
    title: "Liverpool vs Arsenal",
    odds: [2.1, 3.2, 2.8]
  },
  {
    title: "Real Madrid vs Barca",
    odds: [1.9, 3.5, 2.4]
  }
];

// LOGIN
function openLogin() {
  document.getElementById("loginModal").classList.remove("hidden");
}

function login() {
  user = { email: document.getElementById("email").value };
  alert("Logged in!");
  document.getElementById("loginModal").classList.add("hidden");
}

// RENDER EVENTS
function render() {
  const container = document.getElementById("events");
  container.innerHTML = "";

  events.forEach(e => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-header">
        <b>${e.title}</b>
        <span>LIVE</span>
      </div>

      <div class="odds">
        <div class="odd">1<br>${e.odds[0]}</div>
        <div class="odd">X<br>${e.odds[1]}</div>
        <div class="odd">2<br>${e.odds[2]}</div>
      </div>
    `;

    container.appendChild(div);
  });
}

render();
</script>

</body>
</html>
