<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --warning: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links span { color: #aaa; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; transition: 0.2s; }
        .nav-links span:hover { color: #fff; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; position: relative; }
        .market-meta { display: flex; gap: 15px; font-size: 11px; color: #8899a6; margin-top: 5px; text-transform: uppercase; }
        
        .history-badge { background: var(--success); color: white; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; position: absolute; top: 20px; right: 20px; }
        .winner-display { margin-top: 15px; padding: 10px; background: rgba(40, 167, 69, 0.1); border: 1px solid var(--success); border-radius: 8px; color: var(--success); font-weight: bold; text-align: center; margin-bottom: 10px; }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: none; border: 1px solid #334756; color: #aaa; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 5px; font-size: 12px; transition: 0.3s; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* Bets Table Style */
        .bets-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; color: #ccc; }
        .bets-table th { text-align: left; padding: 8px; border-bottom: 1px solid #334756; color: var(--primary); }
        .bets-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid #2c4f60; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <div class="logo" onclick="window.location.reload()">STAKEFORGE</div>
        <div class="nav-links">
            <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
            <span id="link-history" onclick="showSection('history')">History</span>
            <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
            <span id="link-account" onclick="showSection('account')">Account</span>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-danger" style="background:#441111" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>

    <div id="section-history" class="section">
        <h2 style="margin-bottom:25px; color: #888;">Closed Events</h2>
        <div id="history-list">No closed events found.</div>
    </div>

    <div id="section-wallet" class="section">
        <div class="info-card" style="text-align:center; background: var(--card); padding: 30px; border-radius: 15px;">
            <h2>Wallet</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div style="background: rgba(0, 212, 255, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--primary);">
                    <small style="color:var(--primary); font-weight:bold;">REAL</small><h1 id="wallet-real">0.00 €</h1>
                </div>
                <div style="background: rgba(255, 204, 0, 0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--demo);">
                    <small style="color:var(--demo); font-weight:bold;">DEMO</small><h1 id="wallet-demo">0.00 D</h1>
                </div>
            </div>
            <div id="wallet-dynamic-area" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="info-card" style="background: var(--card); padding: 30px; border-radius: 15px;">
            <h2 style="margin-top:0; border-bottom: 2px solid var(--primary); padding-bottom: 10px;">Account</h2>
            <p>Username: <b id="acc-username">---</b></p>
            <p>Email: <b id="acc-email">---</b></p>
            <button class="btn-danger" style="width:100%;" onclick="logout()">Logout</button>
        </div>
    </div>
</div>

<div id="historyBetsModal" class="modal hidden">
    <div class="modal-box" style="width: 600px;">
        <h2 style="color:var(--primary); margin-top:0;">Market Bets</h2>
        <div id="history-bets-content">
            <p>Loading bets...</p>
        </div>
        <button class="btn-danger" style="width:100%; margin-top:20px;" onclick="closeHistoryBetsModal()">Close</button>
    </div>
</div>

<div id="createModal" class="modal hidden">...</div> <script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));

    function showSection(id) { 
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); 
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active'); 
        document.getElementById('link-' + id).classList.add('active');
        if(id === 'markets' || id === 'history') loadMarkets();
        if(id === 'account') updateAccountUI();
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        const historyList = document.getElementById('history-list');
        
        list.innerHTML = "";
        historyList.innerHTML = "";

        markets.forEach(m => {
            const card = document.createElement('div');
            card.className = 'market-card';

            if(m.status === 'settled') {
                card.innerHTML = `
                    <div class="history-badge">✓ CLOSED</div>
                    <div style="padding:10px;">
                        <h3 style="margin:0;">${m.title}</h3>
                        <div class="market-meta"><span>Host: <b>${m.creator_name}</b> | Type: <b>${m.type}</b></span></div>
                        <div class="winner-display">WINNER: ${m.winner || '---'}</div>
                        <button class="btn-outline" onclick="viewAllBets('${m.id}', '${m.title}')">👁 View All Bets</button>
                    </div>`;
                historyList.appendChild(card);
            } else {
                // Aktív piacok kódja (leegyszerűsítve a helytakarékosság miatt, de a funkció ugyanaz)
                card.innerHTML = `<div style="padding:10px;"><h3>${m.title}</h3><p>Active Market</p></div>`;
                list.appendChild(card);
            }
        });
    }

    // --- ÚJ FUNKCIÓ: MINDEN FOGADÁS MEGTEKINTÉSE ---
    async function viewAllBets(marketId, marketTitle) {
        const modal = document.getElementById('historyBetsModal');
        const content = document.getElementById('history-bets-content');
        modal.classList.remove('hidden');
        content.innerHTML = `<p style="color:var(--primary)">Fetching data for: ${marketTitle}...</p>`;

        // Lekérjük az összes fogadást ehhez a piachoz
        // Megjegyzés: A 'profiles' táblából lekérjük a nevet is a user_id alapján
        const { data: bets, error } = await _supabase
            .from('bets')
            .select(`
                amount,
                odds,
                outcome_name,
                status,
                user_id
            `)
            .eq('market_id', marketId);

        if(error || !bets || bets.length === 0) {
            content.innerHTML = "<p>No bets were placed on this event.</p>";
            return;
        }

        let tableHtml = `
            <table class="bets-table">
                <thead>
                    <tr>
                        <th>Selection</th>
                        <th>Stake</th>
                        <th>Odds</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>
        `;

        bets.forEach(b => {
            const isWin = b.status === 'won';
            const color = isWin ? 'var(--success)' : (b.status === 'lost' ? 'var(--danger)' : '#aaa');
            tableHtml += `
                <tr>
                    <td><b>${b.outcome_name}</b></td>
                    <td>${b.amount.toFixed(2)}</td>
                    <td>x${b.odds.toFixed(2)}</td>
                    <td style="color:${color}; font-weight:bold;">${b.status.toUpperCase()}</td>
                </tr>
            `;
        });

        tableHtml += `</tbody></table>`;
        content.innerHTML = tableHtml;
    }

    function closeHistoryBetsModal() {
        document.getElementById('historyBetsModal').classList.add('hidden');
    }

    function updateAccountUI() {
        if(currentUser) {
            document.getElementById('acc-username').innerText = currentUser.username;
            document.getElementById('acc-email').innerText = currentUser.email;
        }
    }

    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }

    window.onload = () => {
        if(!currentUser) window.location.href="login.html";
        showSection('markets');
    };
</script>
</body>
</html>
