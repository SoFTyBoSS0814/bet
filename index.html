<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Pro Full Version</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #00d4ff; --bg: #0b1218; --text: #fff; --card: #16212a; 
            --danger: #ff4444; --demo: #ffff00; --border: #2c4f60; 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        /* NAVBAR */
        .navbar { background: #111b22; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #8899a6; text-decoration: none; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .nav-links a.active { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }

        /* EGYENLEGEK */
        .wallet-display { display: flex; gap: 20px; font-weight: 800; font-size: 14px; }
        .bal-real { color: var(--primary); }
        .bal-demo { color: var(--demo); }

        .container { max-width: 1100px; margin: auto; padding: 40px; }
        .section { display: none; }
        .section.active { display: block; }

        /* MARKET CARD & MODAL */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: var(--card); width: 100%; max-width: 850px; padding: 30px; border-radius: 20px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input, select, textarea { background: #0b1218; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; }
        label { display: block; font-size: 11px; color: #8899a6; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }

        .outcome-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        
        .market-item { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div style="display:flex; align-items:center; gap:40px;">
        <div style="font-weight:900; color:var(--primary); font-size:24px;">STAKEFORGE</div>
        <div class="nav-links" id="nav-links">
            <a onclick="showSection('markets')" id="l-markets" class="active">Markets</a>
            <a onclick="showSection('wallet')" id="l-wallet">Wallet</a>
            <a onclick="showSection('account')" id="l-account">Account</a>
            <a onclick="showSection('settings')" id="l-settings">Settings</a>
        </div>
    </div>
    <div id="nav-right">
        <button class="btn btn-primary" onclick="toggleModal('auth-modal', true)">Bejelentkezés</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1 id="m-count">Live Markets (0/8)</h1>
            <button id="create-btn" class="btn btn-primary hidden" onclick="toggleModal('market-modal', true)">+ Új Piac</button>
        </div>
        <div id="market-list">Piacok betöltése...</div>
    </div>

    <div id="section-wallet" class="section">
        <h1>Wallet</h1>
        <div class="market-item">Egyenlegkezelés és tranzakciók hamarosan.</div>
    </div>

    <div id="section-account" class="section">
        <h1>Account</h1>
        <div id="profile-card" class="market-item">Profil adatok betöltése...</div>
    </div>

    <div id="section-settings" class="section">
        <h1>Settings</h1>
        <div class="market-item">Alapvető beállítások és biztonság.</div>
    </div>
</div>

<div id="market-modal" class="modal-bg hidden">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0">Create New Market</h2>
            <button class="btn btn-danger" onclick="toggleModal('market-modal', false)">✕</button>
        </div>

        <label>Esemény Neve *</label>
        <input id="f-title" placeholder="pl. Luke Littler vs Michael Smith">

        <div class="form-grid">
            <div>
                <label>Határidő (Deadline) *</label>
                <input id="f-start" type="datetime-local">
            </div>
            <div>
                <label>Számla típusa</label>
                <select id="f-type">
                    <option value="DEMO">DEMO (D)</option>
                    <option value="REAL">REAL (€)</option>
                </select>
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label>Költségvetés (Take)</label>
                <input id="f-take" type="number" value="1000">
            </div>
            <div>
                <label>Max Stake</label>
                <input id="f-max" type="number" value="100">
            </div>
        </div>

        <label>Kimenetelek (Fülek) - Max 6</label>
        <div id="out-container" style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div class="outcome-card">
                <input class="o-name" placeholder="pl. 1">
                <input class="o-odds" type="number" step="0.01" value="1.85" style="width:80px;">
            </div>
        </div>
        <button class="btn" style="width:100%; background:rgba(255,255,255,0.05); color:#fff; margin-top:15px;" onclick="addOutcome()">+ Kimenetel Hozzáadása</button>

        <button class="btn btn-primary" style="width:100%; margin-top:30px; height:50px;" onclick="saveMarket()">PIAC PUBLIKÁLÁSA</button>
    </div>
</div>

<div id="auth-modal" class="modal-bg hidden">
    <div class="modal-box" style="max-width:350px;">
        <h2 style="text-align:center">Login</h2>
        <input id="auth-email" type="email" placeholder="Email" value="nokilifemta@gmail.com">
        <input id="auth-pass" type="password" placeholder="Password">
        <button class="btn btn-primary" style="width:100%; margin-top:15px;" onclick="login()">Bejelentkezés</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let user = JSON.parse(localStorage.getItem("user"));

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('section-'+id).classList.add('active');
        document.getElementById('l-'+id).classList.add('active');
    }

    function addOutcome() {
        const container = document.getElementById('out-container');
        if(container.children.length >= 6) return;
        const div = document.createElement('div');
        div.className = 'outcome-card';
        div.innerHTML = `<input class="o-name" placeholder="Név"><input class="o-odds" type="number" step="0.01" value="1.00" style="width:80px;"><button onclick="this.parentElement.remove()" style="background:none; border:none; color:var(--danger); cursor:pointer;">✕</button>`;
        container.appendChild(div);
    }

    async function saveMarket() {
        const startTime = document.getElementById('f-start').value; // Deadline
        const title = document.getElementById('f-title').value;

        if(!startTime || !title) return alert("Kérlek töltsd ki a nevet és a határidőt!");

        const outcomes = [];
        document.querySelectorAll('.outcome-card').forEach(card => {
            const n = card.querySelector('.o-name').value;
            const o = card.querySelector('.o-odds').value;
            if(n) outcomes.push({ name: n, odds: parseFloat(o) });
        });

        // Mentés az adatbázisba az összes kötelező mezővel
        const { error } = await _supabase.from('markets').insert([{
            title: title,
            start_time: startTime, // Itt küldjük a deadline-t a DB-nek
            type: document.getElementById('f-type').value,
            take: parseFloat(document.getElementById('f-take').value),
            max_stake: parseFloat(document.getElementById('f-max').value),
            note: JSON.stringify(outcomes),
            creator_name: user.username,
            odd_1: outcomes[0]?.odds || 1.0
        }]);

        if(error) alert("Hiba: " + error.message);
        else location.reload();
    }

    function updateNav() {
        if(user) {
            document.getElementById('create-btn').classList.remove('hidden');
            document.getElementById('nav-right').innerHTML = `
                <div class="wallet-display">
                    <span class="bal-real">${user.real_balance.toFixed(2)} €</span>
                    <span class="bal-demo">${user.demo_balance.toFixed(2)} D</span>
                </div>
            `;
            document.getElementById('profile-card').innerHTML = `<h3>Felhasználó: ${user.username}</h3><p>Email: ${user.email}</p>`;
        }
    }

    async function login() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        const { data } = await _supabase.from('profiles').select('*').eq('email', email).eq('password', pass).single();
        if(data) { localStorage.setItem("user", JSON.stringify(data)); location.reload(); }
        else alert("Hibás adatok!");
    }

    async function loadMarkets() {
        const { data, count } = await _supabase.from('markets').select('*');
        document.getElementById('m-count').innerText = `Live Markets (${count || 0}/8)`;
        document.getElementById('market-list').innerHTML = data?.map(m => {
            const out = JSON.parse(m.note || "[]");
            return `
                <div class="market-item">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <h3 style="margin:0">${m.title}</h3>
                        <span style="font-size:12px; font-weight:bold; color:${m.type === 'DEMO' ? 'var(--demo)' : 'var(--primary)'}">${m.type}</span>
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap:10px;">
                        ${out.map(o => `<div style="background:#0b1218; padding:10px; border-radius:8px; text-align:center; border:1px solid var(--border);"><small style="color:#8899a6; display:block;">${o.name}</small><b>${o.odds}</b></div>`).join('')}
                    </div>
                </div>`;
        }).join('') || "Nincs aktív piac.";
    }

    function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
    window.onload = () => { updateNav(); loadMarkets(); };
</script>
</body>
</html>
