
HTML
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StakeForge | P2P Betting Platform</title>

<style>
:root {
  --primary: #00d4ff;
  --secondary: #2c4f60;
  --dark: #1a2a33;
  --bg: #0f171e;
  --text: #ffffff;
  --card-bg: #1d2d3a;
  --success: #00ff88;
  --error: #ff4444;
  --warning: #ffa500;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* NAVBAR */
.navbar {
  background: var(--dark);
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--secondary);
  position: sticky; top: 0; z-index: 100;
}

.logo { font-weight: 900; font-size: 26px; color: var(--primary); text-transform: uppercase; cursor: pointer; }
.logo span { color: #fff; font-weight: 300; }

.nav-buttons { display: flex; align-items: center; gap: 12px; }

button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
.btn-primary { background: var(--primary); color: #000; }
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,212,255,0.3); }
.btn-primary:disabled { background: #444; cursor: not-allowed; color: #888; }
.btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

/* TABS */
.tabs { background: var(--dark); display: flex; justify-content: center; gap: 30px; border-bottom: 1px solid #334756; }
.tab { padding: 18px 30px; cursor: pointer; color: #a0aab2; font-weight: 600; border-bottom: 3px solid transparent; }
.tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

.container { max-width: 900px; margin: auto; padding: 20px; }
.section { display: none; }
.section.active { display: block; }

/* CARDS */
.card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-top: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

.profile-card {
  background: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 20px;
  border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center;
}

.wallet-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; min-width: 200px; }

.odds { display: flex; gap: 12px; margin-top: 15px; }
.odd { flex: 1; background: #2a3e4d; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #3d5a6d; }
.odd:hover { border-color: var(--primary); background: #344a5c; }
.odd b { color: var(--primary); font-size: 20px; display: block; margin-top: 5px; }

/* MODALS */
.modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; z-index: 1000; }
.hidden { display:none; }
.modal-box { background: var(--card-bg); padding: 35px; border-radius: 15px; width: 420px; border: 1px solid var(--secondary); }

input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0f171e; border: 1px solid #334756; color: white; border-radius: 8px; box-sizing: border-box; }
label { font-size: 12px; color: #aaa; margin-top: 10px; display: block; }

.status-msg { padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; display: none; }
.status-success { background: rgba(0, 255, 136, 0.15); color: var(--success); border: 1px solid var(--success); }
.status-error { background: rgba(255, 68, 68, 0.15); color: var(--error); border: 1px solid var(--error); }

.badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
.badge-real { background: rgba(0, 212, 255, 0.15); color: var(--primary); }
.badge-demo { background: rgba(255, 165, 0, 0.15); color: var(--warning); }
</style>
</head>

<body>

<div class="navbar">
  <div class="logo" onclick="switchTab('matches')">STAKE<span>FORGE</span></div>
  <div class="nav-buttons">
    <button id="createBtn" class="btn-primary" onclick="openCreate()" style="display:none;">+ Create Market</button>
    <div id="guestButtons">
        <button class="btn-outline" onclick="openLogin()">Login</button>
        <button class="btn-primary" onclick="openRegister()">Register</button>
    </div>
    <div id="userArea" style="display:none;">
        <span id="navUsername" style="margin-right:15px; font-weight:bold; color:var(--primary);"></span>
        <button class="btn-outline" onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-matches" onclick="switchTab('matches')">Matches</div>
  <div class="tab" id="tab-profile" onclick="switchTab('profile')">Profile & Wallet</div>
</div>

<div class="container">
  <div id="matches" class="section active">
    <h2>Live P2P Markets</h2>
    <div id="events"></div>
  </div>
  <div id="profile" class="section">
    <div id="profileContent"></div>
  </div>
</div>

<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <h3>Login</h3>
    <div id="loginStatus" class="status-msg"></div>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Password">
    <button class="btn-primary" style="width:100%" onclick="login()">Sign In</button>
    <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModals()">Close</button>
  </div>
</div>

<div id="registerModal" class="modal hidden">
    <div class="modal-box">
      <h3>Register</h3>
      <div id="regStatus" class="status-msg"></div>
      <input id="regUser" placeholder="Username">
      <input id="regEmail" placeholder="Email">
      <input id="regPass" type="password" placeholder="Password">
      <button class="btn-primary" style="width:100%" onclick="register()">Create Account</button>
      <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModals()">Close</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
  <div class="modal-box">
    <h3>New P2P Market</h3>
    <div id="createStatus" class="status-msg"></div>
    
    <label>Event Name</label>
    <input id="title" placeholder="Arsenal vs Liverpool">
    
    <label>Kick-off / Death Time</label>
    <input id="startTime" type="datetime-local">

    <label>Select Account</label>
    <select id="marketType" onchange="updateCreateBalanceInfo()">
        <option value="REAL">REAL Account (€)</option>
        <option value="DEMO">DEMO Account (Coins)</option>
    </select>
    
    <div id="createBalanceInfo" style="font-size: 13px; color: var(--primary); margin-bottom: 5px; font-weight: bold;"></div>

    <label>Your Initial Liquidity (Stake)</label>
    <input id="liquidity" type="number" placeholder="0.00" oninput="validateLiquidity()">

    <label>Market Odds (1 - X - 2)</label>
    <div style="display:flex; gap:5px;">
        <input id="odd1" placeholder="1.0">
        <input id="oddX" placeholder="1.0">
        <input id="odd2" placeholder="1.0">
    </div>
    
    <button id="submitCreateBtn" class="btn-primary" style="width:100%; margin-top:15px;" onclick="createMarket()">Create & Lock Funds</button>
    <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModals()">Cancel</button>
  </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box">
      <h3 id="betMatchTitle">Place Bet</h3>
      <div id="betStatus" class="status-msg"></div>
      <p id="betSelectionText" style="color:var(--primary); font-weight:bold;"></p>
      
      <div id="betBalanceInfo" style="font-size: 13px; color: var(--primary); font-weight: bold; margin-bottom: 5px;"></div>
      
      <label>Stake Amount</label>
      <input id="betAmount" type="number" placeholder="0.00">
      
      <div id="potentialWin" style="margin: 10px 0; font-size: 14px; color: var(--success);"></div>
      
      <button id="submitBetBtn" class="btn-primary" style="width:100%; margin-top:10px;" onclick="confirmBet()">Confirm Bet</button>
      <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModals()">Cancel</button>
    </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let users = JSON.parse(localStorage.getItem("users") || "[]");
let events = JSON.parse(localStorage.getItem("events") || "[]");
let userCountry = "";
let currentBettingOn = null;

async function checkLocation() {
    try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        userCountry = data.country_code;
    } catch (e) { userCountry = "HU"; }
}

function updateCreateBalanceInfo() {
    if(!user) return;
    const type = document.getElementById("marketType").value;
    const info = document.getElementById("createBalanceInfo");
    if(type === "REAL") info.innerText = `Available: ${user.realBalance.toFixed(2)} €`;
    else info.innerText = `Available: ${user.demoBalance.toLocaleString()} Coins`;
    validateLiquidity();
}

function validateLiquidity() {
    const amount = parseFloat(document.getElementById("liquidity").value);
    const type = document.getElementById("marketType").value;
    const btn = document.getElementById("submitCreateBtn");
    
    if(isNaN(amount) || amount <= 0) {
        btn.disabled = true;
        return;
    }

    if(type === "REAL" && amount > user.realBalance) btn.disabled = true;
    else if(type === "DEMO" && amount > user.demoBalance) btn.disabled = true;
    else btn.disabled = false;
}

function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
    if(tabId === 'profile') renderProfile();
}

function showStatus(elementId, message, isSuccess) {
    const el = document.getElementById(elementId);
    el.innerText = message;
    el.className = `status-msg ${isSuccess ? 'status-success' : 'status-error'}`;
    el.style.display = 'block';
}

function openLogin() { closeModals(); document.getElementById("loginModal").classList.remove("hidden"); }
function openRegister() { closeModals(); document.getElementById("registerModal").classList.remove("hidden"); }
function openCreate() { 
    updateCreateBalanceInfo();
    document.getElementById("createModal").classList.remove("hidden"); 
}
function closeModals() { 
    document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden")); 
    document.querySelectorAll(".status-msg").forEach(s => s.style.display = "none");
}

function register() {
  const username = regUser.value;
  const email = regEmail.value;
  const pass = regPass.value;
  if(!username || !email || !pass) return showStatus("regStatus", "Hiányzó adatok!", false);
  users.push({ username, email, pass, demoBalance: 3000, realBalance: 1000, btcAddress: "bc1q" + Math.random().toString(36).substring(2, 10) });
  localStorage.setItem("users", JSON.stringify(users));
  showStatus("regStatus", "Sikeres! Most jelentkezz be.", true);
  setTimeout(openLogin, 1000);
}

function login() {
  const found = users.find(u => u.email === loginEmail.value && u.pass === loginPass.value);
  if (!found) return showStatus("loginStatus", "Hiba!", false);
  user = found;
  localStorage.setItem("user", JSON.stringify(user));
  updateUI(); closeModals(); renderMatches();
}

function logout() { localStorage.removeItem("user"); location.reload(); }

function updateUI() {
    if(user) {
        document.getElementById("createBtn").style.display = "inline-block";
        document.getElementById("guestButtons").style.display = "none";
        document.getElementById("userArea").style.display = "flex";
        document.getElementById("navUsername").innerText = user.username;
    }
}

function createMarket() {
    const amount = parseFloat(liquidity.value);
    const type = marketType.value;
    const start = startTime.value;

    if(type === "REAL" && amount > user.realBalance) return; 
    if(type === "DEMO" && amount > user.demoBalance) return;

    if(type === "REAL") user.realBalance -= amount; else user.demoBalance -= amount;

    events.push({ id: Date.now(), title: title.value, type: type, stake: amount, startTime: start, odds: [odd1.value || "2.0", oddX.value || "3.0", odd2.value || "2.0"], creator: user.username });
    saveAll(); closeModals(); renderMatches();
}

function openBetModal(eventId, oddIndex) {
    if(!user) return openLogin();
    const ev = events.find(e => e.id === eventId);
    currentBettingOn = { eventId, oddIndex, oddsValue: ev.odds[oddIndex], type: ev.type };
    
    document.getElementById("betMatchTitle").innerText = ev.title;
    const picks = ["1", "X", "2"];
    document.getElementById("betSelectionText").innerText = `Kimenetel: ${picks[oddIndex]} @ ${ev.odds[oddIndex]}`;
    document.getElementById("betBalanceInfo").innerText = currentBettingOn.type === "REAL" ? `Balance: ${user.realBalance.toFixed(2)}€` : `Balance: ${user.demoBalance} Coins`;
    
    document.getElementById("betModal").classList.remove("hidden");
}

function confirmBet() {
    const amount = parseFloat(betAmount.value);
    if(currentBettingOn.type === "REAL" && amount > user.realBalance) return showStatus("betStatus", "Nincs elég pénzed!", false);
    if(currentBettingOn.type === "DEMO" && amount > user.demoBalance) return showStatus("betStatus", "Nincs elég coinod!", false);

    if(currentBettingOn.type === "REAL") user.realBalance -= amount; else user.demoBalance -= amount;
    saveAll(); closeModals(); renderProfile();
}

function saveAll() {
    localStorage.setItem("user", JSON.stringify(user));
    localStorage.setItem("events", JSON.stringify(events));
    const idx = users.findIndex(u => u.email === user.email);
    if(idx !== -1) users[idx] = user;
    localStorage.setItem("users", JSON.stringify(users));
}

function renderMatches() {
  const container = document.getElementById("events");
  container.innerHTML = events.length ? "" : "<p>Nincs aktív piac.</p>";
  events.forEach(e => {
    const isLocked = new Date(e.startTime) < new Date();
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div style="display:flex; justify-content:space-between;">
        <b>${e.title}</b>
        <span class="badge ${e.type === 'REAL' ? 'badge-real' : 'badge-demo'}">${e.type} | Pool: ${e.stake}</span>
      </div>
      <div class="odds" style="${isLocked ? 'pointer-events:none; opacity:0.5;' : ''}">
        <div class="odd" onclick="openBetModal(${e.id}, 0)">1<b>${e.odds[0]}</b></div>
        <div class="odd" onclick="openBetModal(${e.id}, 1)">X<b>${e.odds[1]}</b></div>
        <div class="odd" onclick="openBetModal(${e.id}, 2)">2<b>${e.odds[2]}</b></div>
      </div>`;
    container.appendChild(div);
  });
}

function renderProfile() {
    const container = document.getElementById("profileContent");
    if(!user) return;
    let html = `<div class="profile-card"><div><h2>${user.username}</h2><p>${user.email}</p></div><div class="wallet-box">
                <div style="font-size:11px;">REAL</div><div style="font-size:22px; font-weight:bold;">${user.realBalance.toFixed(2)} €</div>
                <div style="font-size:11px; margin-top:10px;">DEMO</div><div style="font-size:18px;">${user.demoBalance}</div></div></div>`;
    if(userCountry === "HU") html += `<div class="card" style="border:1px solid var(--error)"><h3>⚠️ Korlátozás</h3><p>Befizetés nem elérhető.</p></div>`;
    container.innerHTML = html;
}

checkLocation().then(() => { updateUI(); renderMatches(); });
</script>
</body>
</html>
