<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline';">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; }
        .nav-links span { color: #aaa; margin: 0 10px; cursor: pointer; font-size: 14px; text-transform: uppercase; font-weight: bold; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-group { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 15px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 8px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .settled-badge { position: absolute; top: 10px; left: 10px; background: #555; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; }
        .winner-row { border-left: 3px solid var(--success) !important; background: rgba(40, 167, 69, 0.1) !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 15px; width: 400px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; }
        .hidden { display: none !important; }
        .section { display: none; }
        .section.active { display: block; }
        .history-item { display: flex; justify-content: space-between; padding: 8px; background: rgba(0,0,0,0.2); margin-top: 4px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span onclick="showSection('markets')" class="active" id="link-markets">Piacok</span>
        <span onclick="showSection('history')" id="link-history">Előzmények</span>
        <span onclick="showSection('wallet')" id="link-wallet">Tárca</span>
    </div>
    <div style="font-weight:bold; font-size: 14px;">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span> | 
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>Aktív Piacok</h2>
            <button class="btn-primary" style="width:auto; padding:8px 20px;" onclick="openCreateModal()">+ ÚJ PIAC</button>
        </div>
        <div id="market-list">Betöltés...</div>
    </div>

    <div id="section-history" class="section">
        <h2>Lezárt Események</h2>
        <div id="history-list"></div>
    </div>

    <div id="section-wallet" class="section">
        <div class="market-card" style="max-width:400px; margin:auto; text-align:center;">
            <h3>Egyenleged</h3>
            <div style="margin: 20px 0;">
                <p>Real: <span id="w-real" style="color:var(--primary); font-size:24px; font-weight:bold;">0.00 €</span></p>
                <p>Demo: <span id="w-demo" style="color:var(--demo); font-size:24px; font-weight:bold;">0.00 D</span></p>
            </div>
            <button class="btn-primary" style="background:var(--demo); color:#000;" onclick="claimDaily()">Napi Demo (+1000 D)</button>
            <button class="btn-bet" style="margin-top:20px; color:var(--danger);" onclick="logout()">Kijelentkezés</button>
        </div>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="bet-on"></h3>
        <h2 id="bet-odds" style="color:var(--primary)"></h2>
        <label>Összeg:</label>
        <input type="number" id="bet-amount" value="10">
        <p id="bet-win-text" style="font-size:12px; color:#aaa;">Várható nyeremény: 0.00</p>
        <button class="btn-primary" onclick="placeBet()">FOGADOK</button>
        <button class="btn-bet" style="margin-top:10px; border:none;" onclick="closeModal('betModal')">Mégse</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box" style="width:500px">
        <h3>Új Piac</h3>
        <select id="m-type"><option value="REAL">REAL (EUR)</option><option value="DEMO">DEMO (D)</option></select>
        <input id="m-name" placeholder="Esemény neve">
        <input id="m-budget" type="number" placeholder="Likviditási Alap (Pool)">
        <input id="m-deadline" type="datetime-local">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px; border-style:dashed">+ Kategória</button>
        <button class="btn-primary" onclick="saveMarket()">LÉTREHOZÁS</button>
        <button class="btn-bet" style="margin-top:10px; border:none;" onclick="closeModal('createModal')">Mégse</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="settle-title"></h3>
        <div id="settle-area"></div>
        <button class="btn-primary" id="finalize-btn" style="background:var(--success)" onclick="finalSubmitSettle()">KIFIZETÉS ÉS LEZÁRÁS</button>
        <button class="btn-bet" style="margin-top:10px; border:none;" onclick="closeModal('settleModal')">Vissza</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co';
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let activeBet = null;
    let currentSettleId = null;
    let currentSettleGroups = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
        document.getElementById('bet-amount').oninput = calcWin;
    };

    async function fetchProfile() {
        const { data, error } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(error || !data) { console.error("Profil hiba:", error); return; }
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("w-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("w-demo").innerText = data.demo_balance.toFixed(2) + " D";
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list'), hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            if(m.status === 'active') {
                const card = document.createElement('div'); card.className = 'market-card';
                card.innerHTML = `<div class="market-header"><div><h2>${m.title}</h2><small>Host: ${m.creator_name} | Pool: ${parseFloat(m.take).toFixed(2)}</small></div>
                ${m.creator_name === currentUser.username ? `<button onclick="openSettle('${m.id}','${m.title}')" class="btn-primary" style="width:auto; padding:5px 15px; margin:0">LEZÁRÁS</button>` : ''}</div>
                ${groups.map(g => `<div class="market-group"><small>${g.title}</small><div class="outcomes-grid">
                ${g.outcomes.map(o => `<button class="btn-bet" onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}')">${o.n}<br><b>${o.o}</b></button>`).join('')}</div></div>`).join('')}`;
                mList.appendChild(card);
            } else {
                const card = document.createElement('div'); card.className = 'market-card';
                card.innerHTML = `<div class="settled-badge">Lezárva</div><h2 style="margin-top:15px;">${m.title}</h2>
                ${groups.map(g => `<div class="market-group"><small>${g.title}</small>
                ${g.outcomes.map(o => `<div class="history-item ${o.status==='win'?'winner-row':''}"><span>${o.n}</span><b>${o.status.toUpperCase()}</b></div>`).join('')}</div>`).join('')}`;
                hList.appendChild(card);
            }
        });
    }

    async function finalSubmitSettle() {
        const btn = document.getElementById('finalize-btn');
        btn.disabled = true; btn.innerText = "Feldolgozás...";

        let winners = [];
        document.querySelectorAll('.settle-select').forEach(s => {
            const gi = s.dataset.gi, oi = s.dataset.oi;
            currentSettleGroups[gi].outcomes[oi].status = s.value;
            if(s.value === 'win') winners.push(currentSettleGroups[gi].outcomes[oi].n);
        });

        try {
            const { data: mData } = await _supabase.from('markets').select('*').eq('id', currentSettleId).single();
            if (!mData) throw new Error("A piac nem található!");

            const field = mData.type === 'REAL' ? 'real_balance' : 'demo_balance';
            let hostTotal = parseFloat(mData.take) || 0;

            const { data: bets } = await _supabase.from('bets').select('*').eq('market_id', currentSettleId).eq('status', 'pending');
            
            if(bets && bets.length > 0) {
                for(let bet of bets) {
                    const isWin = winners.includes(bet.outcome_name);
                    if(isWin) {
                        const payout = parseFloat(bet.amount) * parseFloat(bet.odds);
                        const { data: u } = await _supabase.from('profiles').select('*').eq('id', bet.user_id).single();
                        // BIZTONSÁGI ELLENŐRZÉS: Csak akkor frissítünk, ha megvan a profil
                        if (u && u[field] !== undefined) {
                            await _supabase.from('profiles').update({ [field]: (parseFloat(u[field]) || 0) + payout }).eq('id', bet.user_id);
                        }
                    } else {
                        hostTotal += parseFloat(bet.amount);
                    }
                    await _supabase.from('bets').update({ status: isWin ? 'win' : 'loss' }).eq('id', bet.id);
                }
            }

            // Host kifizetése ellenőrzéssel
            const { data: host } = await _supabase.from('profiles').select('*').eq('username', mData.creator_name).single();
            if (host && host[field] !== undefined) {
                await _supabase.from('profiles').update({ [field]: (parseFloat(host[field]) || 0) + hostTotal }).eq('id', host.id);
            }

            await _supabase.from('markets').update({ note: JSON.stringify(currentSettleGroups), status: 'settled', take: 0 }).eq('id', currentSettleId);
            
            location.reload();
        } catch(e) { 
            console.error("Részletes hiba:", e);
            alert("Settle hiba: " + e.message); 
            btn.disabled = false; btn.innerText = "KIFIZETÉS ÉS LEZÁRÁS";
        }
    }

    async function placeBet() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        const field = activeBet.t === 'REAL' ? 'real_balance' : 'demo_balance';
        const potentialProfit = amt * (activeBet.o - 1);
        
        const { data: mData } = await _supabase.from('markets').select('take').eq('id', activeBet.mId).single();
        if(amt > userProfile[field]) return alert("Nincs elég egyenleg!");
        if(potentialProfit > mData.take) return alert("A Pool fedezete kevés!");

        await _supabase.from('bets').insert([{
            user_id: currentUser.id,
            market_id: activeBet.mId,
            outcome_name: activeBet.n,
            amount: amt,
            odds: activeBet.o,
            type: activeBet.t,
            status: 'pending'
        }]);

        await _supabase.from('profiles').update({ [field]: userProfile[field] - amt }).eq('id', currentUser.id);
        await _supabase.from('markets').update({ take: mData.take - potentialProfit }).eq('id', activeBet.mId);
        location.reload();
    }

    function addGroup() {
        const id = "g-" + Date.now();
        const d = document.createElement('div'); d.className = 'market-group'; d.id = id;
        d.innerHTML = `<input class="gt" placeholder="Kategória neve"><div id="o-cont-${id}"></div><button class="btn-bet" onclick="addO('${id}')" style="margin-top:5px;border-style:dashed">+ Opció</button>`;
        document.getElementById('groups-container').appendChild(d); addO(id); addO(id);
    }
    function addO(gid) {
        const c = document.getElementById('o-cont-'+gid);
        const d = document.createElement('div'); d.style.display="flex"; d.style.gap="5px"; d.style.marginTop="5px";
        d.innerHTML = `<input class="on" placeholder="Opció"><input class="oo" type="number" step="0.1" value="2.0" style="width:70px">`;
        c.appendChild(d);
    }
    async function saveMarket() {
        const t = document.getElementById('m-name').value, b = parseFloat(document.getElementById('m-budget').value), dl = document.getElementById('m-deadline').value, type = document.getElementById('m-type').value;
        const field = type === 'REAL' ? 'real_balance' : 'demo_balance';
        if(b > userProfile[field]) return alert("Nincs elég fedezet!");
        const grp = Array.from(document.querySelectorAll('#groups-container .market-group')).map(g => ({
            title: g.querySelector('.gt').value,
            outcomes: Array.from(g.querySelectorAll('div[id^="o-cont-"] > div')).map(o => ({ n: o.querySelector('.on').value, o: parseFloat(o.querySelector('.oo').value), status: 'pending' }))
        }));
        await _supabase.from('profiles').update({ [field]: userProfile[field] - b }).eq('id', currentUser.id);
        await _supabase.from('markets').insert([{ title: t, type, take: b, stake: b, deadline: new Date(dl).toISOString(), note: JSON.stringify(grp), creator_name: currentUser.username, status: 'active' }]);
        location.reload();
    }
    async function openSettle(mId, title) {
        const { data } = await _supabase.from('markets').select('*').eq('id', mId).single();
        currentSettleId = mId; currentSettleGroups = JSON.parse(data.note);
        document.getElementById('settle-title').innerText = title;
        let h = '';
        currentSettleGroups.forEach((g, gi) => {
            h += `<div style="margin-top:15px"><small>${g.title}</small>`;
            g.outcomes.forEach((o, oi) => {
                h += `<div style="display:flex; justify-content:space-between; margin-top:5px"><span>${o.n}</span>
                <select class="settle-select" data-gi="${gi}" data-oi="${oi}" style="width:100px; padding:2px;"><option value="pending">Vár</option><option value="win">NYERT</option><option value="loss">VESZTETT</option></select></div>`;
            });
            h += `</div>`;
        });
        document.getElementById('settle-area').innerHTML = h; document.getElementById('settleModal').classList.remove('hidden');
    }
    async function claimDaily() {
        await _supabase.from('profiles').update({ demo_balance: userProfile.demo_balance + 1000 }).eq('id', currentUser.id);
        location.reload();
    }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('link-' + id).classList.add('active');
    }
    function calcWin() { document.getElementById('bet-win-text').innerText = "Várható nyeremény: " + (parseFloat(document.getElementById('bet-amount').value) * (activeBet?.o || 0)).toFixed(2); }
    function openBet(mId, n, o, t) { activeBet = { mId, n, o, t }; document.getElementById('bet-on').innerText = n; document.getElementById('bet-odds').innerText = "x" + o; document.getElementById('betModal').classList.remove('hidden'); calcWin(); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); if(!document.getElementById('groups-container').innerHTML) addGroup(); }
    function logout() { localStorage.clear(); window.location.href="login.html"; }
</script>
</body>
</html>
