<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Liquidity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .market-info-tag { text-align: right; }
        
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .btn-bet:disabled { opacity: 0.4; cursor: not-allowed; border-color: #222; }
        .btn-create { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-edit { background: #555; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 5px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }

        .settle-btn-toggle { padding: 10px; border-radius: 6px; border: 1px solid #444; cursor: pointer; background: #222; color: #fff; transition: 0.2s; font-weight: bold; }
        .settle-btn-toggle.win { background: var(--success); border-color: #fff; }
        .settle-btn-toggle.lose { background: var(--danger); border-color: #fff; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-create" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>
    <div id="section-history" class="section"><h2>Settled Markets</h2><div id="history-list"></div></div>
    <div id="section-wallet" class="section">...</div>
    <div id="section-account" class="section">...</div>
</div>

<div id="betModal" class="modal hidden"><div class="modal-box" style="width:320px; text-align:center"><h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1><input type="number" id="bet-amount" value="10" oninput="calcWin()"><p id="bet-win-text">Payout: 0.00</p><button class="btn-primary" onclick="placeBet()">PLACE BET</button><button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')">Cancel</button></div></div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h3 id="modal-title">New Market</h3>
            <span id="create-balance-display" style="font-size:12px; font-weight:bold; color:var(--primary)">Balance: 0.00</span>
        </div>
        <input type="hidden" id="edit-market-id">
        <select id="m-type" onchange="updateCreateBalanceDisplay()"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select>
        <input id="m-name" placeholder="Event Name">
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Initial Liquidity Pool">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px; border-style:dashed">+ Add Category</button>
        <button id="save-market-btn" class="btn-primary" style="margin-top:20px" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="settle-title"></h3>
        <p style="font-size: 12px; color: #aaa;">Kattints a kimenetekre a győztes (Zöld) vagy vesztes (Piros) jelöléshez!</p>
        <div id="settle-area"></div>
        <button class="btn-primary" style="margin-top:20px; background:var(--success)" onclick="finalSubmitSettle()">FINALIZE & SETTLE</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('settleModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let currentSettleId = null;
    let currentSettleGroups = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
        setInterval(checkDeadlines, 1000);
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        updateCreateBalanceDisplay();
    }

    function updateCreateBalanceDisplay() {
        if(!userProfile) return;
        const type = document.getElementById('m-type').value;
        const bal = type === 'REAL' ? userProfile.real_balance.toFixed(2) + " €" : userProfile.demo_balance.toFixed(2) + " D";
        document.getElementById('create-balance-display').innerText = "Balance: " + bal;
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list');
        mList.innerHTML = "";

        markets.forEach(m => {
            if(m.status !== 'active') return;
            const groups = JSON.parse(m.note || "[]");
            const isOwner = m.creator_name === currentUser.username;
            const isPastDeadline = new Date(m.deadline) < new Date();
            const typeColor = m.type === 'REAL' ? 'var(--primary)' : 'var(--demo)';

            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <div class="market-header">
                    <div>
                        <h2 style="margin:0;">${m.title}</h2>
                        <small style="color:#aaa">Host: ${m.creator_name} | Deadline: ${new Date(m.deadline).toLocaleString()}</small>
                    </div>
                    <div class="market-info-tag">
                        <div style="color:${typeColor}; font-weight:bold; font-size:14px;">${m.type}</div>
                        <div style="font-size:11px; color:#aaa;">Pool: ${parseFloat(m.take).toFixed(2)}</div>
                        ${isOwner ? (isPastDeadline 
                            ? `<button onclick="openSettle('${m.id}','${m.title}')" class="btn-create" style="background:var(--success)">SETTLE</button>` 
                            : `<button onclick="openEdit('${m.id}')" class="btn-edit">EDIT</button>`) 
                        : ''}
                    </div>
                </div>
                ${groups.map(g => `<div class="market-group"><small>${g.title}</small><div class="outcomes-grid">
                    ${g.outcomes.map(o => `<button class="btn-bet" data-deadline="${m.deadline}" onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}','${m.deadline}')">${o.n}<br><b>${o.o}</b></button>`).join('')}
                </div></div>`).join('')}`;
            mList.appendChild(card);
        });
    }

    // --- EDIT FUNKCIÓ ---
    async function openEdit(mId) {
        const { data: m } = await _supabase.from('markets').select('*').eq('id', mId).single();
        if(!m) return;

        document.getElementById('modal-title').innerText = "Edit Market";
        document.getElementById('edit-market-id').value = m.id;
        document.getElementById('m-name').value = m.title;
        document.getElementById('m-type').value = m.type;
        document.getElementById('m-type').disabled = true; // Típust nem váltunk
        document.getElementById('m-deadline').value = new Date(m.deadline).toISOString().slice(0,16);
        document.getElementById('m-budget').value = m.stake;
        document.getElementById('m-budget').disabled = true; // Alaptőkét nem módosítunk itt

        const container = document.getElementById('groups-container');
        container.innerHTML = "";
        const groups = JSON.parse(m.note);
        groups.forEach(g => {
            const gid = "g-" + Math.random().toString(16).slice(2);
            addGroup(gid, g.title);
            const oCont = document.getElementById('o-cont-' + gid);
            oCont.innerHTML = ""; // Alapokat ürítjük, amiket az addGroup tett be
            g.outcomes.forEach(o => addO(gid, o.n, o.o));
        });

        document.getElementById('save-market-btn').onclick = updateMarket;
        document.getElementById('createModal').classList.remove('hidden');
    }

    async function updateMarket() {
        const mId = document.getElementById('edit-market-id').value;
        const title = document.getElementById('m-name').value;
        const deadline = new Date(document.getElementById('m-deadline').value).toISOString();

        const groups = [];
        document.querySelectorAll('#groups-container .market-group').forEach(g => {
            const outcomes = [];
            g.querySelectorAll('.outcome-row').forEach(row => {
                outcomes.push({ n: row.querySelector('.on').value, o: parseFloat(row.querySelector('.oo').value), status: 'pending' });
            });
            groups.push({ title: g.querySelector('.gt').value, outcomes });
        });

        await _supabase.from('markets').update({ title, deadline, note: JSON.stringify(groups) }).eq('id', mId);
        location.reload();
    }

    // --- SETTLE FUNKCIÓ VIZUÁLISAN ---
    function openSettle(mId, title) {
        currentSettleId = mId;
        _supabase.from('markets').select('*').eq('id', mId).single().then(({data}) => {
            currentSettleGroups = JSON.parse(data.note);
            document.getElementById('settle-title').innerText = title;
            let html = "";
            currentSettleGroups.forEach((g, gi) => {
                html += `<div class='market-group'><p>${g.title}</p><div class="outcomes-grid">`;
                g.outcomes.forEach((o, oi) => {
                    html += `<div class="settle-btn-toggle lose" id="s-btn-${gi}-${oi}" onclick="toggleSettleState(${gi}, ${oi})">${o.n}</div>`;
                    o.status = 'lose'; // Default
                });
                html += `</div></div>`;
            });
            document.getElementById('settle-area').innerHTML = html;
            document.getElementById('settleModal').classList.remove('hidden');
        });
    }

    function toggleSettleState(gi, oi) {
        const btn = document.getElementById(`s-btn-${gi}-${oi}`);
        if(btn.classList.contains('lose')) {
            btn.classList.remove('lose'); btn.classList.add('win');
            currentSettleGroups[gi].outcomes[oi].status = 'win';
        } else {
            btn.classList.remove('win'); btn.classList.add('lose');
            currentSettleGroups[gi].outcomes[oi].status = 'lose';
        }
    }

    // --- HELPEREK A MODALOKHOZ ---
    function addGroup(manualId = null, title = "") {
        const id = manualId || "g-" + Date.now();
        const container = document.getElementById('groups-container');
        const d = document.createElement('div'); d.className = 'market-group'; d.id = id;
        d.innerHTML = `<input class="gt" placeholder="Category Name" value="${title}"><div id="o-cont-${id}"></div><button class="btn-bet" onclick="addO('${id}')" style="font-size:10px;margin-top:5px;border-style:dashed">+ Add Option</button>`;
        container.appendChild(d);
        if(!manualId) { addO(id); addO(id); }
    }

    function addO(groupId, name = "", odds = 2.0) {
        const cont = document.getElementById('o-cont-' + groupId);
        const d = document.createElement('div'); d.className = "outcome-row"; d.style.display="flex"; d.style.gap="5px"; d.style.marginTop="5px";
        d.innerHTML = `<input class="on" placeholder="Outcome" value="${name}"><input class="oo" type="number" step="0.1" value="${odds}" style="width:70px">`;
        cont.appendChild(d);
    }

    function openCreateModal() {
        document.getElementById('modal-title').innerText = "New Market";
        document.getElementById('m-type').disabled = false;
        document.getElementById('m-budget').disabled = false;
        document.getElementById('edit-market-id').value = "";
        document.getElementById('save-market-btn').onclick = saveMarket;
        document.getElementById('groups-container').innerHTML = "";
        document.getElementById('createModal').classList.remove('hidden');
        addGroup();
    }
    
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function showSection(s) { document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active')); document.getElementById('section-' + s).classList.add('active'); }
    // (A placeBet, finalSubmitSettle és egyéb logikák maradtak az előző verzióból)
</script>
</body>
</html>
