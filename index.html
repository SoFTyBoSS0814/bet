<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Liquidity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .right-panel { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; align-items: center; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; gap: 12px; }
        .wallet-sep { width: 1px; height: 18px; background: #334756; }
        .lang-select { background: #0b1218; color: var(--primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; outline: none; height: 38px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .balance-item { flex: 1; padding: 20px; border: 1px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; align-items: center; }
        .balance-value-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .balance-value-row h2 { margin: 0; line-height: 1; }

        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; gap: 15px; }
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .btn-create { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

        /* MY BETS JAVÍTOTT TÁBLÁZAT */
        .bet-history-table { width: 100%; border-collapse: collapse; min-width: 600px; table-layout: fixed; }
        .bet-history-table th { text-align: left; color: #888; padding: 12px 10px; border-bottom: 2px solid var(--border); font-size: 11px; text-transform: uppercase; }
        .bet-history-table td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .col-event { width: 30%; }
        .col-pick  { width: 20%; }
        .col-stake { width: 15%; }
        .col-odds  { width: 10%; }
        .col-payout{ width: 15%; font-weight: bold; }
        .col-status{ width: 10%; text-align: right; }

        .status-win { color: var(--success); }
        .status-loss { color: var(--danger); }
        .status-pending { color: var(--demo); font-style: italic; }

        .reward-box { background: linear-gradient(145deg, rgba(255, 204, 0, 0.1), rgba(0,0,0,0.4)); border: 1px dashed var(--demo); padding: 25px; border-radius: 16px; margin-top: 20px; text-align: center; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .hidden { display: none !important; }
        .btc-address { background: #0b1218; padding: 10px; border: 1px dashed var(--primary); border-radius: 6px; font-size: 11px; word-break: break-all; color: var(--primary); cursor: pointer; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')" data-i18n="nav_markets">Markets</span>
        <span id="link-mybets" onclick="showSection('mybets')" data-i18n="nav_mybets">My Bets</span>
        <span id="link-history" onclick="showSection('history')" data-i18n="nav_history">History</span>
        <span id="link-wallet" onclick="showSection('wallet')" data-i18n="nav_wallet">Wallet</span>
        <span id="link-account" onclick="showSection('account')" data-i18n="nav_account">Account</span>
    </div>
    <div class="right-panel">
        <div class="wallet-display">
            <span style="color:var(--primary)"><span id="nav-real">0.00</span> €</span>
            <div class="wallet-sep"></div>
            <span style="color:var(--demo)"><span id="nav-demo">0.00</span> DEMO</span>
        </div>
        <select class="lang-select" onchange="changeLang(this.value)">
            <option value="en">EN</option>
            <option value="hu">HU</option>
        </select>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2 data-i18n="live_markets">Live Markets</h2>
            <button class="btn-create" onclick="openCreateModal()" data-i18n="btn_create">+ Create</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>

    <div id="section-mybets" class="section">
        <h2 data-i18n="nav_mybets">My Bets</h2>
        <div class="market-card" style="padding:0; overflow-x:auto;">
             <table class="bet-history-table">
                <thead>
                    <tr>
                        <th class="col-event" data-i18n="h_event">Event</th>
                        <th class="col-pick" data-i18n="h_pick">Pick</th>
                        <th class="col-stake" data-i18n="h_stake">Stake</th>
                        <th class="col-odds" data-i18n="h_odds">Odds</th>
                        <th class="col-payout" data-i18n="h_payout">Payout</th>
                        <th class="col-status" data-i18n="h_status">Status</th>
                    </tr>
                </thead>
                <tbody id="bet-history-body"></tbody>
            </table>
        </div>
    </div>

    <div id="section-history" class="section">
        <h2 data-i18n="nav_history">Settled Markets</h2>
        <div id="history-list"></div>
    </div>

    <div id="section-wallet" class="section">
        <div class="market-card" style="max-width:500px; margin:auto; text-align:center;">
            <h2 data-i18n="balances">Balances</h2>
            <div style="display:flex; gap:10px; margin:20px 0;">
                <div class="balance-item"><small>REAL</small><div class="balance-value-row"><h2 id="w-real">0.00</h2><span>€</span></div></div>
                <div class="balance-item"><small>DEMO</small><div class="balance-value-row"><h2 id="w-demo">0.00</h2><span>DEMO</span></div></div>
            </div>
            <div id="btc-wallet-area"></div>
            <div class="reward-box">
                <h3 data-i18n="mystery_box">Daily Mystery Box</h3>
                <div id="reward-msg"></div>
                <button class="btn-primary" onclick="claimDailyDemo()" data-i18n="btn_luck">TRY MY LUCK</button>
            </div>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="market-card" style="max-width:400px; margin:auto; text-align:center;">
            <h2 data-i18n="nav_account">Account</h2>
            <p id="acc-username" style="font-weight:bold; font-size:20px"></p>
            <p id="acc-email" style="color:#aaa"></p>
            <button class="btn-bet" onclick="logout()" style="color:var(--danger); border-color:var(--danger); margin-top:20px">LOG OUT</button>
        </div>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10" oninput="calcWin()">
        <p id="bet-win-text">Payout: 0.00</p>
        <button class="btn-primary" onclick="placeBet()" data-i18n="btn_place_bet">PLACE BET</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3 data-i18n="btn_create">New Market</h3>
        <select id="m-type"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select>
        <input id="m-name" placeholder="Event Name">
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Initial Pool">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()">+ Add Group</button>
        <button class="btn-primary" style="margin-top:20px" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    const i18n = {
        en: { nav_markets: "Markets", nav_mybets: "My Bets", nav_history: "History", nav_wallet: "Wallet", nav_account: "Account", live_markets: "Live Markets", btn_create: "Create Market", h_event: "Event", h_pick: "Pick", h_stake: "Stake", h_odds: "Odds", h_payout: "Payout", h_status: "Status", balances: "Balances", mystery_box: "Daily Mystery Box", btn_luck: "TRY MY LUCK", btn_place_bet: "PLACE BET", cancel: "Cancel" },
        hu: { nav_markets: "Piacok", nav_mybets: "Fogadásaim", nav_history: "Előzmények", nav_wallet: "Tárca", nav_account: "Fiók", live_markets: "Élő Piacok", btn_create: "Piac Létrehozása", h_event: "Esemény", h_pick: "Tipp", h_stake: "Tét", h_odds: "Odds", h_payout: "Kifizetés", h_status: "Állapot", balances: "Egyenlegek", mystery_box: "Napi Meglepetés", btn_luck: "SZERENCSE PRÓBA", btn_place_bet: "FOGADÁS", cancel: "Mégse" }
    };

    let currentLang = 'en';
    let currentUser = null;
    let userProfile = null;
    let activeBet = null;

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'login17.html'; return; }
        currentUser = session.user;
        fetchProfile();
        fetchMarkets();
    }

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById('nav-real').innerText = data.balance.toFixed(2);
        document.getElementById('nav-demo').innerText = data.demo_balance.toFixed(2);
        document.getElementById('w-real').innerText = data.balance.toFixed(2);
        document.getElementById('w-demo').innerText = data.demo_balance.toFixed(2);
        document.getElementById('acc-username').innerText = data.username;
        document.getElementById('acc-email').innerText = currentUser.email;
        renderBTCSection();
    }

    async function fetchMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        const hist = document.getElementById('history-list');
        list.innerHTML = ''; hist.innerHTML = '';
        data.forEach(m => {
            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `<h3>${m.name}</h3><p>Pool: ${m.pool.toFixed(2)} ${m.type}</p>`;
            m.groups.forEach(g => {
                g.outcomes.forEach(o => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-bet';
                    btn.innerHTML = `${o.name} <b>${o.odds.toFixed(2)}</b>`;
                    btn.onclick = () => openBetModal(m.id, m.name, o.name, o.odds, m.type);
                    card.appendChild(btn);
                });
            });
            if (m.settled_at) hist.appendChild(card); else list.appendChild(card);
        });
    }

    async function fetchUserBets() {
        const { data } = await _supabase.from('bets').select('*, markets(name)').eq('user_id', currentUser.id).order('created_at', { ascending: false });
        const body = document.getElementById('bet-history-body');
        body.innerHTML = '';
        if (data) {
            data.forEach(b => {
                const tr = document.createElement('tr');
                const sym = b.type === 'REAL' ? '€' : 'DEMO';
                const status = b.status || 'PENDING';
                const payout = b.status === 'WINNER' ? (b.amount * b.odds).toFixed(2) : (b.status === 'LOSS' ? "0.00" : "-");
                tr.innerHTML = `
                    <td class="col-event">${b.markets ? b.markets.name : 'Unknown'}</td>
                    <td class="col-pick">${b.outcome_name}</td>
                    <td class="col-stake">${b.amount.toFixed(2)} ${sym}</td>
                    <td class="col-odds">${b.odds.toFixed(2)}</td>
                    <td class="col-payout status-${status.toLowerCase()}">${payout}</td>
                    <td class="col-status status-${status.toLowerCase()}">${status}</td>
                `;
                body.appendChild(tr);
            });
        }
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('link-' + id).classList.add('active');
        if (id === 'mybets') fetchUserBets();
    }

    function changeLang(l) {
        currentLang = l;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.innerText = i18n[l][key] || key;
        });
    }

    function openBetModal(mid, mname, oname, odds, type) {
        activeBet = { id: mid, o: odds, t: type };
        document.getElementById('bet-on').innerText = oname;
        document.getElementById('bet-odds').innerText = odds.toFixed(2);
        document.getElementById('betModal').classList.remove('hidden');
    }

    async function placeBet() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        await _supabase.from('bets').insert({ user_id: currentUser.id, market_id: activeBet.id, amount: amt, odds: activeBet.o, type: activeBet.t, outcome_name: document.getElementById('bet-on').innerText });
        closeModal('betModal'); fetchProfile();
    }

    function renderBTCSection() {
        document.getElementById('btc-wallet-area').innerHTML = `<div class="btc-address">${currentUser.id.replace(/-/g,'').slice(0,24)}</div>`;
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function logout() { _supabase.auth.signOut(); location.reload(); }
    function calcWin() { document.getElementById('bet-win-text').innerText = "Payout: " + (document.getElementById('bet-amount').value * (activeBet?.o || 0)).toFixed(2); }

    checkAuth();
    changeLang('en');
</script>
</body>
</html>
