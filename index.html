<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --success: #00ff88; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; height: 70px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; }
        
        .container { max-width: 1100px; margin: auto; padding: 30px; text-align: center; }
        .auth-box { background: var(--card); padding: 30px; border-radius: 15px; width: 350px; margin: 50px auto; border: 1px solid #2c4f60; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: #000; }
        
        .msg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; font-weight: bold; }
        .msg-success { display: block; background: rgba(0, 255, 136, 0.1); color: var(--success); border: 1px solid var(--success); }
        .msg-danger { display: block; background: rgba(255, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        
        .market-card { background: var(--card); padding: 15px; border-radius: 10px; text-align: left; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334756; }
        .tab { padding: 10px; cursor: pointer; color: #888; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <span style="font-weight:900; color:var(--primary); font-size:22px;">STAKEFORGE</span>
    <div id="nav-user-info">
        <button class="btn-primary" style="padding: 8px 15px; width: auto;" onclick="showAuth()">Login / Register</button>
    </div>
</div>

<div class="container">
    <h1>Üdvözlünk a StakeForge-on!</h1>
    <p>Nézd meg az aktuális piacokat, vagy jelentkezz be a fogadáshoz.</p>
    
    <div id="public-markets" style="margin-top: 40px;">
        <h3>Aktuális Piacok</h3>
        <div id="market-list">Betöltés...</div>
    </div>
</div>

<div id="auth-modal" class="auth-box hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; box-shadow: 0 0 50px rgba(0,0,0,0.8);">
    <div class="tabs">
        <div id="tab-login" class="tab active" onclick="switchTab('login')">Bejelentkezés</div>
        <div id="tab-reg" class="tab" onclick="switchTab('reg')">Regisztráció</div>
        <div style="flex-grow:1; text-align:right; cursor:pointer;" onclick="closeAuth()">✕</div>
    </div>

    <div id="form-login">
        <input type="email" id="login-email" placeholder="Email cím" value="nokilifemta@gmail.com">
        <input type="password" id="login-pass" placeholder="Jelszó">
        <button class="btn btn-primary" onclick="handleLogin()">Bejelentkezés</button>
    </div>

    <div id="form-reg" class="hidden">
        <input type="text" id="reg-user" placeholder="Felhasználónév">
        <input type="email" id="reg-email" placeholder="Email cím">
        <input type="password" id="reg-pass" placeholder="Jelszó">
        <button class="btn btn-primary" onclick="handleRegister()">Fiók létrehozása</button>
    </div>

    <div id="auth-msg" class="msg"></div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function loadPublicMarkets() {
        const { data } = await _supabase.from('markets').select('*').limit(5);
        const list = document.getElementById('market-list');
        list.innerHTML = "";
        data?.forEach(m => {
            list.innerHTML += `<div class="market-card"><b>${m.title}</b><br><small>${m.type} | 1: ${m.odd_1} X: ${m.odd_x} 2: ${m.odd_2}</small></div>`;
        });
    }

    function showMessage(text, type) {
        const msgDiv = document.getElementById('auth-msg');
        msgDiv.innerText = text;
        msgDiv.className = 'msg msg-' + type;
        if(type === 'success') setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
    }

    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;

        const { data, error } = await _supabase.from('profiles').select('*').eq('email', email).eq('password', pass).single();

        if (error || !data) {
            showMessage("Hibás adatok!", "danger");
        } else {
            localStorage.setItem("user", JSON.stringify(data));
            showMessage("Sikeres belépés, üdv " + data.username + "!", "success");
        }
    }

    async function handleRegister() {
        const user = document.getElementById('reg-user').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;

        const { error } = await _supabase.from('profiles').insert([{ 
            username: user, 
            email: email, 
            password: pass, 
            demo_balance: 5000, 
            real_balance: 0 
        }]);

        if (error) showMessage("Hiba: " + error.message, "danger");
        else showMessage("Sikeres regisztráció! Most jelentkezz be.", "success");
    }

    function switchTab(type) {
        document.getElementById('form-login').classList.toggle('hidden', type === 'reg');
        document.getElementById('form-reg').classList.toggle('hidden', type === 'login');
        document.getElementById('tab-login').classList.toggle('active', type === 'login');
        document.getElementById('tab-reg').classList.toggle('active', type === 'reg');
    }

    function showAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
    function closeAuth() { document.getElementById('auth-modal').classList.add('hidden'); }

    window.onload = () => {
        loadPublicMarkets();
        const user = JSON.parse(localStorage.getItem("user"));
        if(user) {
            document.getElementById('nav-user-info').innerHTML = `<span style="color:var(--primary); font-weight:bold; margin-right:15px;">${user.username}</span><button onclick="window.location.href='dashboard.html'" class="btn-primary" style="width:auto; padding:5px 10px;">Dashboard</button>`;
        }
    };
</script>
</body>
</html>
