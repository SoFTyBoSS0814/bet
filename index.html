<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Betting Platform</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,255,255,0.2);
}

.logo {
  color: #00f5ff;
  font-weight: bold;
  font-size: 20px;
}

.nav-buttons button {
  margin-left: 10px;
}

/* MAIN */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
  box-shadow: 0 0 15px rgba(0,255,255,0.1);
}

/* INPUTS */
input {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

/* BUTTON */
button {
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  background: #00f5ff;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #00c3cc;
}

.hidden {
  display: none;
}

.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: #111;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">BET WARS DEMO</div>
  <div class="nav-buttons">
    <button onclick="openLogin()">Login</button>
    <button onclick="openRegister()">Register</button>
  </div>
</div>

<!-- CONTENT -->
<div class="container">

  <h2>Live Markets</h2>

  <!-- CREATE MARKET (csak login után) -->
  <div id="createBox" class="hidden">
    <h3>Create Market</h3>
    <input id="title" placeholder="Liverpool vs Arsenal">
    <button onclick="createMarket()">Create</button>
  </div>

  <div id="markets"></div>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <h3>Login</h3>
    <input id="loginEmail" placeholder="email"><br>
    <input id="loginPass" type="password" placeholder="password"><br>
    <button onclick="login()">Login</button>
    <button onclick="closeModals()">Close</button>
  </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal hidden">
  <div class="modal-box">
    <h3>Register</h3>
    <input id="regEmail" placeholder="email"><br>
    <input id="regPass" type="password" placeholder="password"><br>
    <button onclick="register()">Register</button>
    <button onclick="closeModals()">Close</button>
  </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let users = JSON.parse(localStorage.getItem("users") || "[]");
let markets = JSON.parse(localStorage.getItem("markets") || "[]");

// MODALS
function openLogin() {
  document.getElementById("loginModal").classList.remove("hidden");
}
function openRegister() {
  document.getElementById("registerModal").classList.remove("hidden");
}
function closeModals() {
  document.getElementById("loginModal").classList.add("hidden");
  document.getElementById("registerModal").classList.add("hidden");
}

// REGISTER
function register() {
  const email = document.getElementById("regEmail").value;
  const pass = document.getElementById("regPass").value;

  const newUser = { email, pass, balance: 1000 };
  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  alert("Registered!");
  closeModals();
}

// LOGIN
function login() {
  const email = document.getElementById("loginEmail").value;
  const pass = document.getElementById("loginPass").value;

  const found = users.find(u => u.email === email && u.pass === pass);

  if (!found) {
    alert("Wrong login");
    return;
  }

  user = found;
  localStorage.setItem("user", JSON.stringify(user));

  document.getElementById("createBox").classList.remove("hidden");
  closeModals();
}

// CREATE MARKET
function createMarket() {
  const title = document.getElementById("title").value;

  const market = {
    id: Date.now(),
    title,
    creator: user.email
  };

  markets.push(market);
  localStorage.setItem("markets", JSON.stringify(markets));

  renderMarkets();
}

// RENDER
function renderMarkets() {
  const container = document.getElementById("markets");
  container.innerHTML = "";

  markets.forEach(m => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <b>${m.title}</b><br>
      <small>by ${m.creator}</small>
    `;
    container.appendChild(div);
  });
}

// INIT
renderMarkets();
if (user) {
  document.getElementById("createBox").classList.remove("hidden");
}
</script>

</body>
</html>
