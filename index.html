<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .nav-links span { color: #aaa; text-decoration: none; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; }
        .nav-links span.active { color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid #2c4f60; }
        
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; }

        .market-group { background: rgba(255,255,255,0.03); border: 1px solid #2c4f60; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .outcome-item { background: #14212b; padding: 12px; border-radius: 8px; border: 1px solid #253948; position: relative; }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: none; border: 1px dashed #444; color: #888; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; }
        
        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; }
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-bet:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <span style="font-weight:900; color:var(--primary); font-size:22px; margin-right:30px;">STAKEFORGE</span>
        <div class="nav-links">
            <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
            <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
            <span id="link-account" onclick="showSection('account')">Account</span>
            <span id="link-settings" onclick="showSection('settings')">Settings</span>
        </div>
    </div>
    <div class="nav-right" id="auth-area">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button id="logout-btn" class="btn-danger" style="background:#441111" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Betöltés...</div>
    </div>
    <div id="section-wallet" class="section"><h2>Wallet</h2></div>
    <div id="section-account" class="section"><h2>Account</h2></div>
    <div id="section-settings" class="section"><h2>Settings</h2></div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0; color:var(--primary);">New Event</h2>
            <div style="display:flex; gap:10px;">
                <button class="btn-primary" onclick="saveMarket()">💾 Save</button>
                <button class="btn-danger" onclick="closeModal()">Cancel</button>
            </div>
        </div>
        <label>Event Name</label><input id="m-name" placeholder="City - Real">
        <label>Deadline</label><input id="m-date" type="datetime-local">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; margin-bottom:20px;">
            <div><label>Type</label><select id="m-type" onchange="updateBalanceHint()"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select></div>
            <div><label>Budget</label><input id="m-budget" type="number" value="1000" oninput="updateBalanceHint()"><small id="balance-hint"></small></div>
        </div>
        <div id="groups-container"></div>
        <button class="btn-outline" onclick="addGroup()">+ Add Group</button>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width: 320px;">
        <h3 id="bet-outcome-name" style="margin:0; color:var(--primary);">Outcome</h3>
        <p id="bet-odds-display" style="font-size:24px; font-weight:bold; margin:10px 0;"></p>
        <label>Stake Amount</label><input id="bet-amount" type="number" value="100" oninput="calculateWin()">
        <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #334756;">
            <small>Potential Win:</small><div id="potential-win" style="font-size:18px; font-weight:bold; color:var(--demo);">0.00</div>
        </div>
        <button class="btn-primary" style="width:100%" onclick="placeFinalBet()">Place Bet</button>
        <button onclick="closeBetModal()" style="background:none; border:none; color:#888; width:100%; cursor:pointer; margin-top:10px;">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let groupIdx = 0;
    let activeBetData = null;

    async function fetchProfile() {
        if(!currentUser) return;
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            userProfile = data;
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        }
    }

    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        list.innerHTML = data?.length ? "" : "Nincsenek piacok.";
        data?.forEach(m => {
            let groups = JSON.parse(m.note || "[]");
            const card = document.createElement('div');
            card.className = 'market-card';
            card.innerHTML = `
                <div style="padding:20px;">
                    <div style="display:flex; justify-content:space-between;">
                        <h3>${m.title}</h3><b style="color:var(--demo)">${m.type}</b>
                    </div>
                    ${groups.map(g => `
                        <div style="margin-top:10px; border-top:1px solid #2c4f60; padding-top:10px;">
                            <small>${g.title}</small>
                            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-top:10px;">
                                ${g.outcomes.map(o => `
                                    <button class="btn-bet" onclick="handleBet('${m.id}', '${o.n}', ${o.o}, '${m.type}')">
                                        <div style="font-size:10px; color:#888;">${o.n}</div>
                                        <div style="font-weight:bold; color:var(--primary);">${o.o}</div>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>`;
            list.appendChild(card);
        });
    }

    function handleBet(id, name, odds, mType) {
        if(!currentUser) return window.location.href="login.html";
        activeBetData = { id, name, odds, mType };
        document.getElementById('bet-outcome-name').innerText = name;
        document.getElementById('bet-odds-display').innerText = odds.toFixed(2);
        document.getElementById('betModal').classList.remove('hidden');
        calculateWin();
    }

    async function placeFinalBet() {
        const amount = parseFloat(document.getElementById('bet-amount').value);
        if (isNaN(amount) || amount <= 0) return alert("Helytelen összeg!");

        // Ellenőrzés profilból
        const balanceField = activeBetData.mType === 'REAL' ? 'real_balance' : 'demo_balance';
        const currentBal = userProfile[balanceField];

        if(amount > currentBal) {
            return alert(`Nincs elég fedezeted! Egyenleged: ${currentBal.toFixed(2)}`);
        }

        // Levonás
        const { error } = await _supabase.from('profiles')
            .update({ [balanceField]: currentBal - amount })
            .eq('id', currentUser.id);

        if(!error) {
            alert("Fogadás elfogadva!");
            closeBetModal();
            fetchProfile(); // Navbar frissítése
        } else {
            alert("Hiba: " + error.message);
        }
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-'+id).classList.add('active');
        if(id === 'markets') loadMarkets();
    }

    function addGroup() {
        groupIdx++;
        const div = document.createElement('div');
        div.className = 'market-group';
        div.innerHTML = `<input class="g-title" placeholder="Market Group"><div id="grid-${groupIdx}" class="outcomes-grid"></div><button class="btn-outline" onclick="addOutcome(${groupIdx})">+ Add Outcome</button>`;
        document.getElementById('groups-container').appendChild(div);
        addOutcome(groupIdx);
    }

    function addOutcome(id) {
        const div = document.createElement('div');
        div.className = 'outcome-item';
        div.innerHTML = `<input class="o-n" placeholder="Name"><input class="o-o" type="number" step="0.01" value="1.50">`;
        document.getElementById(`grid-${id}`).appendChild(div);
    }

    async function saveMarket() {
        if(!currentUser) return alert("Login required!");
        const groups = [];
        document.querySelectorAll('.market-group').forEach(g => {
            const outcomes = [];
            g.querySelectorAll('.outcome-item').forEach(i => {
                outcomes.push({ n: i.querySelector('.o-n').value, o: i.querySelector('.o-o').value });
            });
            groups.push({ title: g.querySelector('.g-title').value, outcomes });
        });
        await _supabase.from('markets').insert([{
            title: document.getElementById('m-name').value,
            type: document.getElementById('m-type').value,
            take: document.getElementById('m-budget').value,
            note: JSON.stringify(groups),
            creator_name: currentUser.username
        }]);
        closeModal(); loadMarkets();
    }

    function calculateWin() { document.getElementById('potential-win').innerText = (parseFloat(document.getElementById('bet-amount').value) * activeBetData.odds).toFixed(2); }
    function openCreateModal() { if(!currentUser) return window.location.href="login.html"; document.getElementById("createModal").classList.remove("hidden"); document.getElementById('groups-container').innerHTML = ""; addGroup(); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function closeBetModal() { document.getElementById('betModal').classList.add('hidden'); }
    function logout() { localStorage.removeItem("user"); window.location.reload(); }

    window.onload = () => { 
        if(!currentUser) {
            document.getElementById('logout-btn').innerText = "Login";
            document.getElementById('logout-btn').onclick = () => window.location.href="login.html";
        }
        fetchProfile(); 
        loadMarkets(); 
    };
</script>
</body>
</html>
