<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --warning: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* FIX: A Navbar most már nem takarja el a kattintásokat */
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 70px; }
        
        /* FIX: A container lejjebb került, hogy ne csússzon a navbar alá */
        .container { max-width: 1100px; margin: 80px auto 0 auto; padding: 30px; position: relative; z-index: 1; }
        
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links span { color: #aaa; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; transition: 0.2s; }
        .nav-links span:hover { color: #fff; }
        .nav-links span.active { color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .section { display: none; }
        .section.active { display: block; }

        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transform: translateY(100px); transition: 0.4s; z-index: 10000; }
        #toast.show { transform: translateY(0); }

        .market-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c4f60; position: relative; }
        .market-meta { display: flex; flex-wrap: wrap; gap: 15px; font-size: 11px; color: #8899a6; margin-top: 8px; text-transform: uppercase; }
        .market-group { background: rgba(255,255,255,0.03); border: 1px solid #2c4f60; border-radius: 10px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
        
        /* Gombok javítása */
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; position: relative; z-index: 10; }
        .btn-bet:hover:not(:disabled) { border-color: var(--primary); background: #14212b; transform: translateY(-2px); }
        .btn-bet:active { transform: translateY(0); }
        .btn-bet:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
        
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; z-index: 10; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: none; border: 1px dashed #444; color: #888; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid #2c4f60; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="toast">✅ Action Successful!</div>

<div class="navbar">
    <div class="nav-left">
        <div class="logo" onclick="window.location.reload()">STAKEFORGE</div>
        <div class="nav-links">
            <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
            <span id="link-history" onclick="showSection('history')">History</span>
            <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
            <span id="link-account" onclick="showSection('account')">Account</span>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-danger" style="background:#441111" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0;">Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Create Market</button>
        </div>
        <div id="market-list">Loading markets...</div>
    </div>

    </div>

<script>
    // A Script rész marad az általad írt, de a window.onload-ba érdemes beletenni egy kis extra ellenőrzést
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // ... (összes függvényed: fetchProfile, loadMarkets, saveMarket stb.) ...
    
    // CSAK EZT AZ EGY RÉSZT JAVÍTSD A SCRIPTED VÉGÉN:
    async function saveMarket() {
        console.log("Save initiated..."); // Ellenőrzés a konzolban
        const name = document.getElementById('m-name').value;
        const date = document.getElementById('m-date').value;
        if(!name || !date) return alert("Fill Name and Deadline!");

        const groups = [];
        document.querySelectorAll('.market-group').forEach(g => {
            const outcomes = [];
            g.querySelectorAll('.outcome-item').forEach(i => { 
                const oName = i.querySelector('.o-n').value;
                const oOdds = parseFloat(i.querySelector('.o-o').value);
                if(oName) outcomes.push({ n: oName, o: oOdds || 1.0 }); 
            });
            const gTitle = g.querySelector('.g-title').value;
            if(outcomes.length > 0) groups.push({ title: gTitle || "Market", outcomes });
        });

        try {
            if(editingMarketId) {
                await _supabase.from('markets').update({ note: JSON.stringify(groups) }).eq('id', editingMarketId);
            } else {
                const budget = parseFloat(document.getElementById('m-budget').value);
                const type = document.getElementById('m-type').value;
                const bal = type === 'REAL' ? userProfile.real_balance : userProfile.demo_balance;
                if(budget > bal) return alert("No funds!");
                
                await _supabase.from('profiles').update({ [type === 'REAL' ? 'real_balance' : 'demo_balance']: bal - budget }).eq('id', currentUser.id);
                await _supabase.from('markets').insert([{ title: name, type, take: budget, note: JSON.stringify(groups), creator_name: currentUser.username, status: 'active', created_at: new Date(date).toISOString() }]);
            }
            showToast("Market Action Successful!"); 
            closeModal(); 
            loadMarkets(); 
            fetchProfile();
        } catch (err) {
            console.error(err);
            alert("Error: " + err.message);
        }
    }

    // Modal kezelők és egyéb függvények...
    // ... (Marad a te verziód)
</script>
</body>
</html>
