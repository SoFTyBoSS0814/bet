
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Stable Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0b1218; --text: #fff; --card: #16212a; --danger: #ff4444; --demo: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        .navbar { background: #111b22; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; border-bottom: 1px solid #2c4f60; position: sticky; top: 0; z-index: 1000; }
        .nav-left { display: flex; align-items: center; gap: 40px; }
        .logo { font-weight: 900; color: var(--primary); font-size: 24px; cursor: pointer; }
        .nav-links a { color: #8899a6; text-decoration: none; font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 20px; text-transform: uppercase; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { background: rgba(0,0,0,0.4); border: 1px solid #2c4f60; padding: 8px 16px; border-radius: 10px; display: flex; gap: 20px; font-weight: bold; font-size: 14px; height: 38px; align-items: center; box-sizing: border-box; }

        .container { max-width: 1200px; margin: auto; padding: 40px; }
        .btn { height: 38px; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* MODAL & GRID */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: var(--card); width: 100%; max-width: 600px; padding: 30px; border-radius: 16px; border: 1px solid #2c4f60; box-shadow: 0 10px 50px rgba(0,0,0,0.6); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .odds-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 10px; }
        
        input, select { width: 100%; background: #0b1218; border: 1px solid #2c4f60; color: #fff; padding: 12px; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        label { display: block; font-size: 11px; color: #8899a6; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }

        .balance-info { font-size: 14px; font-weight: bold; text-align: right; margin-top: 5px; min-height: 20px; }
        .hidden { display: none !important; }
        
        .market-card { background: var(--card); padding: 25px; border-radius: 14px; margin-bottom: 15px; border: 1px solid #2c4f60; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <div class="logo">STAKEFORGE</div>
        <div id="main-menu" class="nav-links hidden">
            <a onclick="location.reload()">Markets</a>
            <a>Wallet</a>
            <a>Account</a>
        </div>
    </div>
    <div class="nav-right" id="nav-tools">
        <button class="btn btn-primary" onclick="toggleModal('auth-modal', true)">Login</button>
    </div>
</div>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h1 style="margin:0;">P2P Markets</h1>
        <button id="create-btn" class="btn btn-primary hidden" onclick="toggleModal('market-modal', true)">+ Create Market</button>
    </div>
    <div id="market-list">Piacok betöltése...</div>
</div>

<div id="market-modal" class="modal-bg hidden">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0">Új Piac Létrehozása</h2>
            <span style="cursor:pointer; font-size:28px;" onclick="toggleModal('market-modal', false)">×</span>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>ESEMÉNY NEVE (TITLE) *</label>
            <input id="m-title" placeholder="pl. Manchester City - Real Madrid">
        </div>

        <div class="form-grid">
            <div>
                <label>HATÁRIDŐ (START TIME)</label>
                <input id="m-start" type="datetime-local">
            </div>
            <div>
                <label>SZÁMLA TÍPUSA (TYPE)</label>
                <select id="m-type" onchange="updateCreationBalance()">
                    <option value="DEMO">DEMO (D)</option>
                    <option value="REAL">REAL (€)</option>
                </select>
                <div id="creation-balance" class="balance-info" style="color:var(--demo)">
                    ELÉRHETŐ: 0.00 D
                </div>
            </div>
        </div>

        <div class="form-grid">
            <div><label>KÖLTSÉGVETÉS (TAKE)</label><input id="m-take" type="number" value="1000"></div>
            <div><label>MAX TÉT (MAX STAKE)</label><input id="m-max" type="number" value="100"></div>
        </div>

        <label>KIMENETELEK / ODDSZOK (1 - X - 2)</label>
        <div class="odds-grid">
            <div><label style="color:#555">HAZAI (1)</label><input id="m-o1" type="number" step="0.01" value="2.00"></div>
            <div><label style="color:#555">DÖNTETLEN (X)</label><input id="m-ox" type="number" step="0.01" value="3.00"></div>
            <div><label style="color:#555">VENDÉG (2)</label><input id="m-o2" type="number" step="0.01" value="2.50"></div>
        </div>

        <button class="btn btn-primary" style="width:100%; height:45px; margin-top:30px; font-size:16px;" onclick="submitMarket()">
            PIAC LÉTREHOZÁSA
        </button>
    </div>
</div>

<div id="auth-modal" class="modal-bg hidden">
    <div class="modal-box" style="max-width:350px;">
        <h2 style="text-align:center; color:var(--primary)">Login</h2>
        <input id="auth-email" type="email" placeholder="Email" value="nokilifemta@gmail.com">
        <input id="auth-pass" type="password" placeholder="Password">
        <button class="btn btn-primary" style="width:100%; margin-top:15px;" onclick="login()">Sign In</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let user = JSON.parse(localStorage.getItem("user"));

    // 1. EGYENLEG FRISSÍTÉSE LÉTREHOZÁSNÁL
    function updateCreationBalance() {
        const type = document.getElementById('m-type').value;
        const display = document.getElementById('creation-balance');
        if(!user) return;
        if(type === 'DEMO') {
            display.innerText = `ELÉRHETŐ: ${user.demo_balance.toFixed(2)} D`;
            display.style.color = "var(--demo)";
        } else {
            display.innerText = `ELÉRHETŐ: ${user.real_balance.toFixed(2)} €`;
            display.style.color = "var(--primary)";
        }
    }

    // 2. STABIL MENTÉS - PONTOSAN AZ ADATBÁZIS OSZLOPAIHOZ IGAZÍTVA
    async function submitMarket() {
        const payload = {
            title: document.getElementById('m-title').value,
            start_time: document.getElementById('m-start').value,
            type: document.getElementById('m-type').value,
            take: parseFloat(document.getElementById('m-take').value),
            max_stake: parseFloat(document.getElementById('m-max').value),
            odd_1: parseFloat(document.getElementById('m-o1').value),
            odd_x: parseFloat(document.getElementById('m-ox').value),
            odd_2: parseFloat(document.getElementById('m-o2').value),
            creator_name: user.username
        };

        const { error } = await _supabase.from('markets').insert([payload]);
        if(error) {
            alert("Hiba történt: " + error.message);
        } else {
            alert("Sikeresen létrehozva!");
            location.reload();
        }
    }

    // UI ÉS MENÜ KEZELÉS
    function updateNav() {
        if (user) {
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('create-btn').classList.remove('hidden');
            document.getElementById('nav-tools').innerHTML = `
                <div class="wallet-display">
                    <span style="color:var(--primary)">${user.real_balance.toFixed(2)} €</span>
                    <span style="color:var(--demo)">${user.demo_balance.toFixed(2)} D</span>
                </div>
                <button class="btn btn-danger" onclick="localStorage.removeItem('user'); location.reload();">Logout</button>
            `;
            updateCreationBalance();
        }
    }

    async function login() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        const { data } = await _supabase.from('profiles').select('*').eq('email', email).eq('password', pass).single();
        if (data) { localStorage.setItem("user", JSON.stringify(data)); location.reload(); }
        else alert("Login failed!");
    }

    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        list.innerHTML = data?.map(m => `
            <div class="market-card">
                <div>
                    <h3 style="margin:0">${m.title}</h3>
                    <small style="color:#8899a6">${m.type} | Take: ${m.take} | Creator: ${m.creator_name}</small>
                </div>
                <div style="display:flex; gap:15px; font-weight:bold;">
                    <div style="text-align:center"><div style="font-size:10px; color:#8899a6">1</div>${m.odd_1}</div>
                    <div style="text-align:center"><div style="font-size:10px; color:#8899a6">X</div>${m.odd_x}</div>
                    <div style="text-align:center"><div style="font-size:10px; color:#8899a6">2</div>${m.odd_2}</div>
                </div>
            </div>
        `).join('') || 'Nincsenek aktív piacok.';
    }

    function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
    window.onload = () => { updateNav(); loadMarkets(); };
</script>
</body>
</html>
