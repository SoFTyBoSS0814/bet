
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; height: 70px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 14px; cursor: pointer; margin-right: 20px; font-weight: bold; }
        .nav-links a.active { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        
        .container { max-width: 1100px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 650px; border: 1px solid #2c4f60; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 11px; color: #888; font-weight: bold; }
        
        .hidden { display: none !important; }
        .market-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

<div id="app-content" class="hidden">
    <div class="navbar">
        <div style="display:flex; align-items:center; gap:30px;">
            <span style="font-weight:900; color:var(--primary); font-size:22px;">STAKEFORGE</span>
            <div class="nav-links">
                <a onclick="showSection('markets')" id="link-markets" class="active">Markets</a>
                <a onclick="showSection('wallet')" id="link-wallet">Wallet</a>
                <a onclick="showSection('account')" id="link-account">Account</a>
                <a onclick="showSection('settings')" id="link-settings">Settings</a>
            </div>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div style="background:rgba(0,0,0,0.3); padding:8px 15px; border-radius:8px; border:1px solid #334756; font-weight:bold; font-size:14px;">
                <span id="nav-real" style="color:var(--primary); margin-right:10px;">0.00 €</span>
                <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
            </div>
            <button class="btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="section-markets" class="section active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>Live P2P Markets</h2>
                <button class="btn-primary" onclick="openModal()">+ Create Market</button>
            </div>
            <div id="market-list">Loading...</div>
        </div>
        <div id="section-wallet" class="section"><h2>Wallet</h2></div>
        <div id="section-account" class="section"><h2>Account</h2></div>
        <div id="section-settings" class="section"><h2>Settings</h2></div>
    </div>
</div>

<div id="login-error" class="hidden" style="text-align:center; margin-top:100px;">
    <h2>Hiba: Nem vagy bejelentkezve!</h2>
    <p>Kérlek jelentkezz be újra az index oldalon.</p>
    <button class="btn-primary" onclick="window.location.href='index.html'">Vissza a főoldalra</button>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h3 style="margin:0;">Új Piac</h3>
            <div>
                <button class="btn-primary" onclick="saveMarket()">Mentés</button>
                <button class="btn-danger" onclick="closeModal()">Mégse</button>
            </div>
        </div>
        
        <label>Esemény Neve (Title) *</label>
        <input id="m-title" placeholder="pl. Man City - Real Madrid">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div><label>Kezdés *</label><input id="m-start" type="datetime-local"></div>
            <div><label>Típus</label><select id="m-type"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select></div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div><label>Take (Költségvetés)</label><input id="m-take" type="number" value="1000"></div>
            <div><label>Max Stake</label><input id="m-max" type="number" value="100"></div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
            <div><label>Odds 1</label><input id="m-o1" type="number" step="0.01" value="2.00"></div>
            <div><label>Odds X</label><input id="m-ox" type="number" step="0.01" value="3.00"></div>
            <div><label>Odds 2</label><input id="m-o2" type="number" step="0.01" value="2.50"></div>
        </div>
        
        <label>Megjegyzés (Note)</label>
        <textarea id="m-note" rows="2"></textarea>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = JSON.parse(localStorage.getItem("user"));

    async function checkUser() {
        if(!currentUser) {
            document.getElementById('login-error').classList.remove('hidden');
            return;
        }
        document.getElementById('app-content').classList.remove('hidden');
        refreshBalances();
        loadMarkets();
    }

    async function refreshBalances() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if(data) {
            document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
            document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        }
    }

    async function saveMarket() {
        // CSAK AZOKAT AZ OSZLOPOKAT HASZNÁLJUK, AMIK LÉTEZNEK
        const payload = {
            title: document.getElementById('m-title').value,
            creator_name: currentUser.email,
            type: document.getElementById('m-type').value,
            take: parseInt(document.getElementById('m-take').value),
            start_time: document.getElementById('m-start').value,
            odd_1: parseFloat(document.getElementById('m-o1').value),
            odd_x: parseFloat(document.getElementById('m-ox').value),
            odd_2: parseFloat(document.getElementById('m-o2').value),
            max_stake: parseInt(document.getElementById('m-max').value),
            note: document.getElementById('m-note').value
        };

        const { error } = await _supabase.from('markets').insert([payload]);

        if(error) {
            alert("Hiba: " + error.message);
        } else {
            alert("Sikeres mentés!");
            closeModal();
            loadMarkets();
        }
    }

    async function loadMarkets() {
        const { data } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('market-list');
        list.innerHTML = data?.length ? "" : "No active markets.";
        data?.forEach(m => {
            list.innerHTML += `<div class="market-card"><b>${m.title}</b><br><small>Odds: ${m.odd_1} - ${m.odd_x} - ${m.odd_2}</small></div>`;
        });
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.getElementById('link-' + id).classList.add('active');
    }

    function openModal() { document.getElementById("createModal").classList.remove("hidden"); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function logout() { localStorage.removeItem("user"); window.location.href = "index.html"; }

    window.onload = checkUser;
</script>
</body>
</html>
