<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Betting Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
      color: white;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    input {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #00f5ff;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #00c3cc;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      box-shadow: 0 0 10px rgba(0,255,255,0.1);
    }

    .hidden {
      display: none;
    }

    h2 {
      color: #00f5ff;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>Login</h2>
    <input id="email" placeholder="email">
    <input id="password" type="password" placeholder="password">
    <button onclick="login()">Login</button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <h2 id="welcome"></h2>
    <p id="balance"></p>

    <h3>Create Market</h3>
    <input id="title" placeholder="Match (pl. Liverpool vs Arsenal)">
    <button onclick="createMarket()">Create</button>

    <h3>Markets</h3>
    <div id="markets"></div>
  </div>

</div>

<script>
let user = null;
let markets = JSON.parse(localStorage.getItem("markets") || "[]");

function login() {
  const email = document.getElementById("email").value;

  user = { email, balance: 1000 };
  localStorage.setItem("user", JSON.stringify(user));

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("welcome").innerText = "Welcome " + email;
  document.getElementById("balance").innerText = "Balance: " + user.balance;

  renderMarkets();
}

function createMarket() {
  const title = document.getElementById("title").value;

  const market = {
    id: Date.now(),
    title,
    creator: user.email
  };

  markets.push(market);
  localStorage.setItem("markets", JSON.stringify(markets));

  renderMarkets();
}

function renderMarkets() {
  const container = document.getElementById("markets");
  container.innerHTML = "";

  markets.forEach(m => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <b>${m.title}</b><br>
      <small>by ${m.creator}</small>
    `;
    container.appendChild(div);
  });
}
</script>

</body>
</html>
