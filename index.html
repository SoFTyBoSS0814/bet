
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }

        .settled-badge { position: absolute; top: 20px; left: 20px; background: #555; color: #fff; font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; z-index: 1; }
        .history-category-box { background: rgba(0,0,0,0.25); border-radius: 10px; padding: 12px; margin-top: 12px; border-left: 3px solid #334756; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 10px; background: rgba(255,255,255,0.03); margin-top: 4px; border-radius: 6px; font-size: 13px; }

        .reward-box { background: linear-gradient(145deg, rgba(255, 204, 0, 0.1), rgba(0,0,0,0.4)); border: 1px dashed var(--demo); padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }
        #reward-display { font-size: 24px; font-weight: 900; color: var(--demo); margin: 10px 0; min-height: 32px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        .hidden { display: none !important; }
        .btn-del-group { position: absolute; top: 10px; right: 10px; font-size: 16px; background:none; border:none; color:var(--danger); cursor:pointer; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()" style="width:auto; padding:8px 16px; font-size:12px;">+ Create</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>

    <div id="section-history" class="section">
        <h2>Settled Markets</h2>
        <div id="history-list"></div>
    </div>

    <div id="section-wallet" class="section">
        <div class="market-card" style="max-width:500px; margin:auto; text-align:center;">
            <h2>Balances</h2>
            <div style="display:flex; gap:10px; margin:20px 0;">
                <div style="flex:1; padding:20px; border:1px solid var(--border); border-radius:15px;"><small>REAL</small><h2 id="w-real" style="color:var(--primary)">0.00 €</h2></div>
                <div style="flex:1; padding:20px; border:1px solid var(--border); border-radius:15px;"><small>DEMO</small><h2 id="w-demo" style="color:var(--demo)">0.00 D</h2></div>
            </div>
            <div class="reward-box">
                <h3 style="margin:0; color:var(--demo)">Daily Mystery Box</h3>
                <div id="reward-display">???? D</div>
                <button id="btn-claim-reward" class="btn-primary" style="background:var(--demo)" onclick="claimDailyDemo()">TRY MY LUCK</button>
            </div>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="market-card" style="max-width:400px; margin:auto; text-align:center;">
            <h3>Profile Settings</h3>
            <div style="text-align:left; background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; margin-bottom:20px;">
                <p><b>Username:</b> <span id="acc-username">...</span></p>
                <p><b>Email:</b> <span id="acc-email" style="color:#aaa;">...</span></p>
            </div>
            <button class="btn-bet" onclick="logout()" style="color:var(--danger); border-color: var(--danger);">LOGOUT</button>
        </div>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10">
        <button class="btn-primary" onclick="placeBet()">PLACE BET</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')">Cancel</button>
    </div>
</div>

<div id="editModal" class="modal hidden">
    <div class="modal-box">
        <h3>Edit Odds</h3>
        <div id="edit-container"></div>
        <button class="btn-primary" onclick="saveOdds()">SAVE CHANGES</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('editModal')">Cancel</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3>Settle Market</h3>
        <div id="settle-container"></div>
        <button class="btn-primary" style="background:var(--success)" onclick="submitSettle()">FINALIZE & PAYOUT</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('settleModal')">Cancel</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>New Market</h3>
        <select id="m-type"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select>
        <input id="m-name" placeholder="Event Name">
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Liquidity Pool">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px; border-style:dashed">+ Add Category</button>
        <button class="btn-primary" style="margin-top:20px" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let activeBet = null;
    let currentEditMarket = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("w-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("w-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("acc-username").innerText = currentUser.username;
        document.getElementById("acc-email").innerText = currentUser.email || "N/A";
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list');
        const hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            const isDemo = m.type === 'DEMO';
            const isHost = m.creator_name === currentUser.username;
            const isLive = new Date(m.deadline) > new Date();

            if(m.status === 'active') {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.innerHTML = `
                    <div class="market-header">
                        <div><h2>${m.title}</h2><small>Host: ${m.creator_name} | Pool: ${m.take} ${m.type}</small></div>
                        <div style="display:flex; gap:5px;">
                            ${isHost && isLive ? `<button onclick="openEdit('${m.id}')" class="btn-bet" style="width:auto">EDIT</button>` : ''}
                            ${isHost ? `<button onclick="openSettle('${m.id}')" class="btn-primary" style="width:auto; background:var(--success)">SETTLE</button>` : ''}
                        </div>
                    </div>
                    ${groups.map(g => `<div class="market-group"><small>${g.title}</small><div class="outcomes-grid">
                        ${g.outcomes.map(o => `<button class="btn-bet" onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}')">${o.n}<br><b>${o.o}</b></button>`).join('')}
                    </div></div>`).join('')}`;
                mList.appendChild(card);
            } else {
                const card = document.createElement('div'); card.className = 'market-card';
                card.innerHTML = `<div class="settled-badge">Settled</div>
                    <div class="market-header" style="margin-top:20px;"><div><h3>${m.title}</h3><small>Host: ${m.creator_name}</small></div></div>
                    ${groups.map(g => `<div class="history-category-box"><small style="color:var(--primary); font-weight:bold">${g.title}</small>
                        ${g.outcomes.map(o => `<div class="history-item"><span>${o.n}</span><b style="color:${o.status==='win'?'var(--success)':'var(--danger)'}">${o.status.toUpperCase()}</b></div>`).join('')}
                    </div>`).join('')}`;
                hList.appendChild(card);
            }
        });
    }

    async function submitSettle() {
        const groups = JSON.parse(currentEditMarket.note);
        let win = false, loss = false;
        document.querySelectorAll('.settle-select').forEach(s => { 
            const val = s.value; groups[s.dataset.gi].outcomes[s.dataset.oi].status = val;
            if(val==='win') win=true; if(val==='loss') loss=true;
        });
        if(!win || !loss) { alert("Válassz legalább egy WINNER-t és egy LOSS-t!"); return; }
        
        const { error: updErr } = await _supabase.from('markets').update({ note: JSON.stringify(groups), status: 'settled' }).eq('id', currentEditMarket.id);
        if(updErr) return alert("Hiba a mentésnél!");

        const { error: payErr } = await _supabase.rpc('settle_market_payouts', { m_id: currentEditMarket.id });
        if(payErr) alert("Hiba a kifizetésnél: " + payErr.message);
        else { alert("Sikeres lezárás és kifizetés!"); location.reload(); }
    }

    async function claimDailyDemo() {
        const display = document.getElementById('reward-display');
        const now = new Date();
        const last = userProfile.last_claim ? new Date(userProfile.last_claim) : new Date(0);
        if (now - last < 86400000) { alert("Várj holnapig!"); return; }
        let c = 0; const iv = setInterval(() => {
            display.innerText = Math.floor(Math.random() * 50000) + " D";
            if(++c > 20) { clearInterval(iv); const final = Math.floor(Math.random() * 49000 + 1000); display.innerText = final + " D";
                _supabase.from('profiles').update({ demo_balance: userProfile.demo_balance + final, last_claim: now.toISOString() }).eq('id', currentUser.id).then(() => location.reload());
            }
        }, 50);
    }

    // Helper functions
    function addGroup() {
        const container = document.getElementById('groups-container');
        const id = "g-" + Date.now();
        const d = document.createElement('div'); d.className = 'market-group'; d.id = id;
        d.innerHTML = `<button class="btn-del-group" onclick="this.parentElement.remove()">✕</button><input class="gt" placeholder="Category Name"><div id="o-cont-${id}"></div>
            <button class="btn-bet" onclick="addO('${id}')" style="font-size:10px; margin-top:5px; border-style:dashed">+ Add Option</button>`;
        container.appendChild(d); addO(id); addO(id);
    }
    function addO(groupId) {
        const cont = document.getElementById('o-cont-' + groupId);
        const d = document.createElement('div'); d.style.display="flex"; d.style.gap="5px"; d.style.marginTop="5px";
        d.innerHTML = `<input class="on" placeholder="Outcome" style="margin:0"><input class="oo" type="number" step="0.1" value="2.0" style="width:70px; margin:0"><button onclick="this.parentElement.remove()">✕</button>`;
        cont.appendChild(d);
    }
    async function saveMarket() {
        const t = document.getElementById('m-name').value;
        const b = parseFloat(document.getElementById('m-budget').value);
        const dl = document.getElementById('m-deadline').value;
        const type = document.getElementById('m-type').value;
        const grp = Array.from(document.querySelectorAll('#groups-container .market-group')).map(g => ({
            title: g.querySelector('.gt').value,
            outcomes: Array.from(g.querySelectorAll('div[id^="o-cont-"] > div')).map(o => ({ n: o.querySelector('.on').value, o: parseFloat(o.querySelector('.oo').value), status: 'pending' }))
        }));
        await _supabase.from('markets').insert([{ title: t, type, take: b, deadline: dl, note: JSON.stringify(grp), creator_name: currentUser.username, status: 'active' }]);
        location.reload();
    }
    async function openEdit(id) {
        const { data } = await _supabase.from('markets').select('*').eq('id', id).single();
        currentEditMarket = data;
        const groups = JSON.parse(data.note);
        let html = '';
        groups.forEach((g, gi) => {
            html += `<div style="margin-bottom:10px;"><small>${g.title}</small>`;
            g.outcomes.forEach((o, oi) => { html += `<div style="display:flex; gap:10px; margin-top:5px;"><span>${o.n}</span><input type="number" step="0.1" value="${o.o}" class="edit-odds-input" data-gi="${gi}" data-oi="${oi}" style="width:80px; margin:0;"></div>`; });
            html += `</div>`;
        });
        document.getElementById('edit-container').innerHTML = html;
        document.getElementById('editModal').classList.remove('hidden');
    }
    async function saveOdds() {
        const groups = JSON.parse(currentEditMarket.note);
        document.querySelectorAll('.edit-odds-input').forEach(i => { groups[i.dataset.gi].outcomes[i.dataset.oi].o = parseFloat(i.value); });
        await _supabase.from('markets').update({ note: JSON.stringify(groups) }).eq('id', currentEditMarket.id);
        location.reload();
    }
    async function openSettle(id) {
        const { data } = await _supabase.from('markets').select('*').eq('id', id).single();
        currentEditMarket = data;
        const groups = JSON.parse(data.note);
        let html = '';
        groups.forEach((g, gi) => {
            html += `<div style="margin-bottom:10px;"><small>${g.title}</small>`;
            g.outcomes.forEach((o, oi) => { html += `<div style="display:flex; justify-content:space-between; margin-top:5px;"><span>${o.n}</span><select class="settle-select" data-gi="${gi}" data-oi="${oi}" style="width:120px; margin:0;"><option value="pending">Pending</option><option value="win">WINNER</option><option value="loss">LOSS</option></select></div>`; });
            html += `</div>`;
        });
        document.getElementById('settle-container').innerHTML = html;
        document.getElementById('settleModal').classList.remove('hidden');
    }
    function openBet(mId, n, o, t) { activeBet = { mId, n, o, t }; document.getElementById('bet-on').innerText = n; document.getElementById('bet-odds').innerText = "x" + o; document.getElementById('betModal').classList.remove('hidden'); }
    async function placeBet() {
        const amt = parseFloat(document.getElementById('bet-amount').value);
        const f = activeBet.t === 'REAL' ? 'real_balance' : 'demo_balance';
        const potentialWin = amt * (activeBet.o - 1);
        const { error: liqErr } = await _supabase.rpc('decrease_market_liq', { m_id: activeBet.mId, amount: potentialWin });
        if(liqErr) return alert("Nincs elég likviditás!");
        await _supabase.from('profiles').update({ [f]: userProfile[f] - amt }).eq('id', currentUser.id);
        await _supabase.from('bets').insert([{ user_id: currentUser.id, market_id: activeBet.mId, outcome_name: activeBet.n, amount: amt, odds: activeBet.o, type: activeBet.t, status: 'pending' }]);
        location.reload();
    }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('link-' + id).classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); if(!document.getElementById('groups-container').innerHTML) addGroup(); }
    function logout() { localStorage.clear(); window.location.href="login.html"; }
</script>
</body>
</html>
