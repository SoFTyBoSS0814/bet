<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Liquidity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 0; transition: 0.2s; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); position: relative; }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; font-size: 13px; }
        .btn-bet:disabled { opacity: 0.4; cursor: not-allowed; border-color: #222; }
        .btn-create { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }

        /* Admin Gomb stílus */
        .admin-view-btn { position: absolute; top: 15px; right: 15px; background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 10; }
        .admin-view-btn:hover { background: #ff1a1a; transform: scale(1.05); }

        .settled-badge { position: absolute; top: 15px; left: 15px; background: #555; color: #fff; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .history-type { position: absolute; top: 15px; right: 15px; font-weight: 900; font-size: 14px; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); margin-top: 5px; border-radius: 8px; font-size: 13px; border-left: 3px solid transparent; }
        
        .history-item.winner-row { border-left-color: var(--success); background: rgba(40, 167, 69, 0.15); }
        .history-item.loss-row { border-left-color: var(--danger); background: rgba(255, 68, 68, 0.1); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        input.invalid { border-color: var(--danger) !important; background: rgba(255, 68, 68, 0.05); }
        .error-hint { color: var(--danger); font-size: 11px; font-weight: bold; margin-bottom: 10px; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-create" onclick="openCreateModal()">+ Create</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>

    <div id="section-history" class="section">
        <h2>Settled Markets</h2>
        <div id="history-list"></div>
    </div>
    </div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3><h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10" oninput="calcWin()">
        <p id="bet-win-text">Payout: 0.00</p>
        <button class="btn-primary" onclick="placeBet()">PLACE BET</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('betModal')">Cancel</button>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>New Market</h3>
        <div id="create-error-msg" class="error-hint">Tölts ki minden mezőt! Üres sor nem maradhat.</div>
        <select id="m-type" onchange="updateCreateBalanceDisplay()">
            <option value="DEMO">DEMO</option>
            <option value="REAL">REAL</option>
        </select>
        <input id="m-name" placeholder="Event Name">
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Initial Liquidity Pool">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-top:10px; border-style:dashed">+ Add Category</button>
        <button class="btn-primary" style="margin-top:20px" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<div id="settleModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="settle-title"></h3>
        <p id="settle-error-msg" class="error-hint">Hiba: Minden kimenetelt le kell zárni (WIN/LOSS), a PENDING nem maradhat!</p>
        <div id="settle-area"></div>
        <button class="btn-primary" style="margin-top:20px; background:var(--success)" onclick="finalSubmitSettle()">FINALIZE</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('settleModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let activeBet = null;
    let currentSettleId = null;
    let currentSettleGroups = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile(); // Ez megvárja, amíg meglesz a 'role'
        loadMarkets();        // Csak ezután tölti a piacokat
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list');
        const hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";
        
        // KRITIKUS: Itt ellenőrizzük az admint
        const isAdmin = userProfile && userProfile.role === 'admin';

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            const symbol = m.type === 'REAL' ? '€' : 'D';
            const dlDate = new Date(m.deadline);
            const dlString = dlDate.toLocaleString('hu-HU', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });

            if(m.status === 'active') {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.innerHTML = `
                    ${isAdmin ? `<button class="admin-view-btn" onclick="viewAllBets('${m.id}','${m.title}')">🔍 VIEW ALL BETS</button>` : ''}
                    <div class="market-header">
                        <div>
                            <h2 style="margin:0;">${m.title}</h2>
                            <small style="color:#aaa">Host: ${m.creator_name} | <b>Pool: ${parseFloat(m.take).toFixed(2)} ${symbol}</b></small><br>
                            <small style="color:var(--danger); font-weight:bold;">Ends: ${dlString}</small>
                        </div>
                        ${m.creator_name === currentUser.username ? `<button onclick="openSettle('${m.id}','${m.title}')" class="btn-create">SETTLE</button>` : ''}
                    </div>
                    ${groups.map(g => `<div class="market-group"><small>${g.title}</small><div class="outcomes-grid">
                        ${g.outcomes.map(o => `<button class="btn-bet" onclick="openBet('${m.id}','${o.n}',${o.o},'${m.type}','${m.deadline}')">${o.n}<br><b>${o.o}</b></button>`).join('')}
                    </div></div>`).join('')}`;
                mList.appendChild(card);
            } else {
                // History rész...
                const hCard = document.createElement('div');
                hCard.className = 'market-card';
                hCard.innerHTML = `
                    <div class="settled-badge">Settled</div>
                    <div class="history-type">${m.type}</div>
                    ${isAdmin ? `<button class="admin-view-btn" onclick="viewAllBets('${m.id}','${m.title}')">🔍 VIEW ALL BETS</button>` : ''}
                    <div class="market-header" style="margin-top:15px;">
                        <div>
                            <h2 style="margin:0;">${m.title}</h2>
                            <small style="color:#aaa">Host: ${m.creator_name} | <b>Pool: ${parseFloat(m.stake).toFixed(2)} ${symbol}</b></small><br>
                            <small style="color:#888;">Deadline: ${dlString}</small>
                        </div>
                    </div>
                    ${groups.map(g => `<div class="market-group"><small>${g.title}</small>
                        ${g.outcomes.map(o => `<div class="history-item ${o.status==='win'?'winner-row':o.status==='loss'?'loss-row':''}"><span>${o.n}</span><b>${o.status.toUpperCase()}</b></div>`).join('')}
                    </div>`).join('')}`;
                hList.appendChild(hCard);
            }
        });
    }

    // --- ADMIN BET VIEW ---
    async function viewAllBets(mId, mTitle) {
        const { data: bets } = await _supabase.from('bets').select('*, profiles(username)').eq('market_id', mId).order('created_at', { ascending: false });
        let html = bets.map(b => `
            <div style="border-bottom:1px solid #334756; padding:8px 0; font-size:12px;">
                <b>${b.profiles?.username}</b>: ${b.amount} ${b.type==='REAL'?'€':'D'} ➔ ${b.outcome_name} (x${b.odds})
            </div>`).join('') || '<p>Nincsenek fogadások.</p>';
        
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-box"><h3>${mTitle} - Bets</h3><div style="max-height:300px; overflow-y:auto">${html}</div><button class="btn-primary" style="margin-top:20px" onclick="this.parentElement.parentElement.remove()">CLOSE</button></div>`;
        document.body.appendChild(modal);
    }

    // --- SETTLE VALIDATION JAVÍTÁS ---
    async function finalSubmitSettle() {
        const selects = document.querySelectorAll('.settle-select');
        let hasPending = false;
        
        selects.forEach(s => { if(s.value === 'pending') hasPending = true; });

        if(hasPending) {
            document.getElementById('settle-error-msg').style.display = 'block';
            return; // Megállítjuk a folyamatot
        }

        // Ha nincs pending, mehet tovább a beküldés...
        document.getElementById('settle-error-msg').style.display = 'none';
        
        // Itt jön a meglévő settle logikád (winCount ellenőrzés, update, RPC hívás stb.)
        // ... (a korábbi kódod folytatása)
        let winners = [];
        let isValid = true;
        currentSettleGroups.forEach((g, gi) => {
            const catSelects = document.querySelectorAll(`.settle-select[data-gi="${gi}"]`);
            let winCount = 0;
            catSelects.forEach(s => { 
                const val = s.value;
                currentSettleGroups[gi].outcomes[s.dataset.oi].status = val;
                if(val === 'win') { winCount++; winners.push(currentSettleGroups[gi].outcomes[s.dataset.oi].n); }
            });
            if (winCount !== 1) { alert(`Kategória hiba: "${g.title}" - Pontosan 1 győztes kell!`); isValid = false; }
        });

        if (!isValid) return;

        // Adatbázis mentés...
        await _supabase.from('markets').update({ 
            note: JSON.stringify(currentSettleGroups), 
            status: 'settled', 
            start_time: new Date().toISOString() 
        }).eq('id', currentSettleId);
        
        await _supabase.rpc('settle_market_payouts', { m_id: currentSettleId });
        location.reload();
    }

    // A többi segédfüggvény (openSettle, addGroup, addO, saveMarket) maradhat a legutóbbi verzióból.
</script>
</body>
</html>
