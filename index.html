<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* NAVBAR */
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .nav-left-group { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 15px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; text-decoration: none; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334756; font-size: 14px; font-weight: bold; }

        .container { max-width: 900px; margin: auto; padding: 40px 20px; }
        .section { display: none; }
        .section.active { display: block; }

        /* MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 15px; width: 850px; max-width: 95vw; border: 1px solid #2c4f60; max-height: 90vh; overflow-y: auto; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; }

        /* KIMENETEL RÁCS */
        .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .odd-card { background: rgba(0,0,0,0.2); border: 1px solid #334756; padding: 15px; border-radius: 10px; }
        .add-btn { grid-column: span 2; background: none; border: 2px dashed #334756; color: #888; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .add-btn:hover { border-color: var(--primary); color: var(--primary); }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left-group">
        <a href="#" class="logo">STAKEFORGE</a>
        <div class="nav-links">
            <a onclick="showSection('markets')" id="nav-markets" class="active">Markets</a>
            <a onclick="showSection('wallet')" id="nav-wallet">Wallet</a>
            <a onclick="showSection('account')" id="nav-account">Account</a>
            <a onclick="showSection('settings')" id="nav-settings">Settings</a>
        </div>
    </div>
    <div class="nav-right">
        <div class="wallet-display">
            <span id="nav-real" style="color:var(--primary)">0.00 €</span>
            <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
        </div>
        <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2>Live P2P Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ Piac Létrehozása</button>
        </div>
        <div id="market-list">Piacok betöltése...</div>
    </div>
    </div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px;">
             <button class="btn-primary" style="background:#334756; color:#fff;">📋 Beillesztés</button>
             <button class="btn-primary" onclick="saveMarket()">💾 Piac Mentése</button>
             <button class="btn-danger" onclick="closeModal()">Mégse</button>
        </div>
        
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
            <div><label>Esemény Neve *</label><input id="m-name" placeholder="pl. Manchester City vs Real Madrid"></div>
            <div><label>Határidő (Deadline) *</label><input id="m-date" type="datetime-local"></div>
        </div>
        
        <label>Leírás / Megjegyzés</label>
        <textarea id="m-desc" rows="2" placeholder="Szabályok..."></textarea>

        <div style="display:flex; align-items:center; gap:20px; background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; border:1px solid #334756; margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:8px;"><input type="checkbox" style="width:20px; margin:0;"> <label style="margin:0;">Teljes egyenleg</label></div>
            <div style="flex:1;"><label>Költségvetés</label><input type="number" value="1000" style="margin:0;"></div>
            <div style="flex:1;"><label>Típus</label><select style="margin:0;"><option>DEMO (D)</option><option>REAL (€)</option></select></div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>Kimenetelek és Oddsok</label>
            <span id="counter" style="font-size:10px; color:#555;">0/8 extra</span>
        </div>
        
        <div class="odds-grid" id="odds-container">
            <div class="odd-card"><label>Hazai (1)</label><div style="display:flex; gap:10px;"><input placeholder="Név" value="Hazai"><input type="number" step="0.01" value="1.00" style="width:80px;"></div></div>
            <div class="odd-card"><label>Vendég (2)</label><div style="display:flex; gap:10px;"><input placeholder="Név" value="Vendég"><input type="number" step="0.01" value="1.00" style="width:80px;"></div></div>
            <button class="add-btn" id="add-odd-btn" onclick="addOutcome()">+ Kimenetel Hozzáadása</button>
        </div>
    </div>
</div>

<script>
    let outcomeCount = 0;
    const maxOutcomes = 8;

    function addOutcome() {
        if(outcomeCount >= maxOutcomes) return alert("Maximum 8 extra kimenetelt adhatsz hozzá!");
        
        outcomeCount++;
        const container = document.getElementById('odds-container');
        const btn = document.getElementById('add-odd-btn');
        
        const div = document.createElement('div');
        div.className = 'odd-card';
        div.innerHTML = `<label>Extra Kimenetel (${outcomeCount})</label>
                         <div style="display:flex; gap:10px;">
                            <input placeholder="Kimenetel neve">
                            <input type="number" step="0.01" value="1.00" style="width:80px;">
                         </div>`;
        
        container.insertBefore(div, btn);
        document.getElementById('counter').innerText = `${outcomeCount}/8 extra`;
        
        if(outcomeCount === maxOutcomes) btn.classList.add('hidden');
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
    }

    function openCreateModal() { document.getElementById("createModal").classList.remove("hidden"); }
    function closeModal() { document.getElementById("createModal").classList.add("hidden"); }
    function logout() { localStorage.removeItem("user"); window.location.href="login.html"; }
</script>
</body>
</html>
