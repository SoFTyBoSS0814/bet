
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | P2P Cloud Betting</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1a2a33; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c4f60; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 24px; color: var(--primary); text-transform: uppercase; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .odds { display: flex; gap: 10px; margin-top: 15px; }
        .odd { flex: 1; background: #2a3e4d; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .odd b { color: var(--primary); font-size: 20px; display: block; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 15px; width: 400px; border: 1px solid #2c4f60; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 12px; color: #888; font-weight: bold; }
        .balance-info { font-weight: bold; padding: 10px 0; font-size: 20px; }
        .type-label { font-size: 10px; padding: 2px 5px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">STAKEFORGE</div>
    <div id="logged-out-ui">
        <button onclick="openModal('loginModal')" style="background:none; color:white; border:none; cursor:pointer; margin-right:15px;">Login</button>
        <button class="btn-primary" onclick="openModal('regModal')">Register</button>
    </div>
    <div id="logged-in-ui" class="hidden">
        <button class="btn-primary" onclick="openModal('createModal')">+ Create Market</button>
        <span id="user-display" style="font-weight: bold; color: var(--primary); margin-left: 15px;"></span>
        <button onclick="logout()" style="background:none; border: 1px solid #ff4444; color:#ff4444; padding:5px 10px; border-radius:4px; cursor:pointer; margin-left:10px;">Logout</button>
    </div>
</div>

<div class="container">
    <h2>Live P2P Markets</h2>
    <div id="market-list">Betöltés...</div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>Új Piac Létrehozása</h3>
        <label>Esemény neve</label>
        <input id="m-title" placeholder="pl. Taktaszada vs Taktaharkány">
        
        <div style="display:flex; gap:15px; align-items: flex-end;">
            <div style="flex:1.2;">
                <label>Számla típusa</label>
                <select id="m-type" onchange="updateAvailableBalance()">
                    <option value="REAL">REAL Account</option>
                    <option value="DEMO">DEMO Account</option>
                </select>
            </div>
            <div style="flex:1;">
                <label>Max Volatility</label>
                <div id="m-balance-display" class="balance-info">---</div>
            </div>
        </div>

        <label>Fogadási határidő (Deadline)</label>
        <input id="m-deadline" type="datetime-local">
        
        <label>Oddsok (1 - X - 2)</label>
        <div style="display:flex; gap:5px;">
            <input id="m-o1" type="number" step="0.01" placeholder="1.00">
            <input id="m-ox" type="number" step="0.01" placeholder="1.00">
            <input id="m-o2" type="number" step="0.01" placeholder="1.00">
        </div>
        
        <button class="btn-primary" style="width:100%; margin-top:20px; font-size: 16px;" onclick="handleCreateMarket()">Piac Megnyitása</button>
        <p onclick="closeModals()" style="text-align:center; cursor:pointer; color:#888; margin-top:15px;">Mégse</p>
    </div>
</div>

<div id="regModal" class="modal hidden"><div class="modal-box"><h3>Register</h3><input id="r-user" placeholder="Username"><input id="r-email" placeholder="Email"><input id="r-pass" type="password" placeholder="Pass"><button class="btn-primary" style="width:100%" onclick="handleRegister()">Go</button><p onclick="closeModals()" style="text-align:center; cursor:pointer;">Cancel</p></div></div>
<div id="loginModal" class="modal hidden"><div class="modal-box"><h3>Login</h3><input id="l-email" placeholder="Email"><input id="l-pass" type="password" placeholder="Pass"><button class="btn-primary" style="width:100%" onclick="handleLogin()">Login</button><p onclick="closeModals()" style="text-align:center; cursor:pointer;">Cancel</p></div></div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));

    window.onload = () => { updateUI(); fetchMarkets(); };

    function updateUI() {
        if (currentUser) {
            document.getElementById("logged-out-ui").classList.add("hidden");
            document.getElementById("logged-in-ui").classList.remove("hidden");
            document.getElementById("user-display").innerText = currentUser.username;
        }
    }

    // EGYENLEG LEKÉRÉSE ÉS JELZÉSE (DEMO/REAL)
    async function updateAvailableBalance() {
        if (!currentUser) return;
        const type = document.getElementById("m-type").value;
        const field = (type === "REAL") ? "real_balance" : "demo_balance";
        const display = document.getElementById("m-balance-display");

        const { data, error } = await _supabase.from('profiles').select(field).eq('id', currentUser.id).single();
        if (data) {
            const val = data[field] || 0;
            // Itt adjuk hozzá a prefixet (DEMO vagy REAL)
            display.innerText = `${type} ${val}`;
            display.style.color = (type === "DEMO") ? "#ffcc00" : "#00d4ff";
            display.dataset.amount = val;
        }
    }

    async function handleCreateMarket() {
        const title = document.getElementById("m-title").value;
        const deadline = document.getElementById("m-deadline").value;
        const balance = parseFloat(document.getElementById("m-balance-display").dataset.amount || 0);
        const type = document.getElementById("m-type").value;

        if(!title || !deadline) { alert("Minden mezőt tölts ki!"); return; }

        const { error } = await _supabase.from('markets').insert([{
            title: title,
            creator_name: currentUser.username,
            type: type,
            stake: 0, 
            max_stake: balance,
            start_time: new Date(deadline).toISOString(),
            odd_1: parseFloat(document.getElementById("m-o1").value) || 1,
            odd_x: parseFloat(document.getElementById("m-ox").value) || 1,
            odd_2: parseFloat(document.getElementById("m-o2").value) || 1
        }]);

        if (error) alert(error.message);
        else { closeModals(); fetchMarkets(); alert(`Piac létrehozva ${type} számlával!`); }
    }

    async function fetchMarkets() {
        const { data, error } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const list = document.getElementById("market-list");
        if (error) return;
        list.innerHTML = data.length ? "" : "Nincsenek aktív piacok.";
        data.forEach(m => {
            const isMe = currentUser && m.creator_name === currentUser.username;
            const typeColor = m.type === "DEMO" ? "#ffcc00" : "#00d4ff";
            
            list.innerHTML += `<div class="card">
                <div style="display:flex; justify-content:space-between; align-items: center;">
                    <b>${m.title}</b>
                    <span style="color:${typeColor}; font-size:12px; font-weight:bold; border: 1px solid ${typeColor}; padding: 2px 5px; border-radius: 4px;">
                        ${m.type} ${m.max_stake}
                    </span>
                </div>
                <div class="odds" style="${isMe ? 'opacity:0.3; pointer-events:none;' : ''}">
                    <div class="odd">1<b>${m.odd_1}</b></div>
                    <div class="odd">X<b>${m.odd_x}</b></div>
                    <div class="odd">2<b>${m.odd_2}</b></div>
                </div>
            </div>`;
        });
    }

    // AUTH (Regisztrációnál alap DEMO egyenleg beállítva)
    async function handleRegister() {
        const u = document.getElementById("r-user").value;
        const e = document.getElementById("r-email").value;
        const p = document.getElementById("r-pass").value;
        const { error } = await _supabase.from('profiles').insert([{ 
            username: u, email: e, password: p, real_balance: 0, demo_balance: 5000 
        }]);
        if (error) alert(error.message); else { alert("Siker! Jelentkezz be."); closeModals(); }
    }

    async function handleLogin() {
        const e = document.getElementById("l-email").value;
        const p = document.getElementById("l-pass").value;
        const { data } = await _supabase.from('profiles').select('*').eq('email', e).eq('password', p).single();
        if (data) { localStorage.setItem("user", JSON.stringify(data)); location.reload(); } else alert("Hiba!");
    }

    function openModal(id) { 
        document.getElementById(id).classList.remove("hidden"); 
        if(id === 'createModal') updateAvailableBalance(); 
    }
    function closeModals() { document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden")); }
    function logout() { localStorage.removeItem("user"); location.reload(); }
</script>
</body>
</html>
