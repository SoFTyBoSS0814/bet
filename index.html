<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Final System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --text: #fff; --card: #1d2d3a; --demo: #ffcc00; --danger: #ff4444; --success: #28a745; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .navbar { background: #1a2a33; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--primary); font-size: 22px; cursor: pointer; }
        .nav-links span { color: #aaa; font-size: 13px; cursor: pointer; font-weight: bold; text-transform: uppercase; padding: 10px 15px; }
        .nav-links span.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .wallet-display { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; }

        .container { max-width: 1000px; margin: auto; padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }

        .market-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 25px; border: 1px solid var(--border); }
        .market-group { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 4px solid var(--primary); }
        .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        
        .btn-bet { background: #0b1218; border: 1px solid #334756; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-bet.selected-win { background: var(--success) !important; color: #000; font-weight: bold; border-color: #fff; }
        .btn-bet.selected-loss { background: var(--danger) !important; color: #fff; font-weight: bold; border-color: #fff; }
        .btn-bet:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

        .settle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 8px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0b1218; border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="location.reload()">STAKEFORGE</div>
    <div class="nav-links">
        <span id="link-markets" class="active" onclick="showSection('markets')">Markets</span>
        <span id="link-history" onclick="showSection('history')">History</span>
        <span id="link-wallet" onclick="showSection('wallet')">Wallet</span>
        <span id="link-account" onclick="showSection('account')">Account</span>
    </div>
    <div class="wallet-display">
        <span id="nav-real" style="color:var(--primary)">0.00 €</span>
        <span id="nav-demo" style="color:var(--demo)">0.00 D</span>
    </div>
</div>

<div class="container">
    <div id="section-markets" class="section active">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2>Live Markets</h2>
            <button class="btn-primary" onclick="openCreateModal()">+ CREATE</button>
        </div>
        <div id="market-list">Loading...</div>
    </div>

    <div id="section-history" class="section">
        <h2>Market History</h2>
        <div id="history-list">Loading closed events...</div>
    </div>

    <div id="section-wallet" class="section">
        <div class="market-card" style="text-align:center">
            <h2>Wallet</h2>
            <div style="display:flex; gap:20px; justify-content:center; margin:20px 0;">
                <div style="padding:20px; border:1px solid var(--primary); border-radius:12px; flex:1">
                    <small>REAL</small><h2 id="w-real-val">0.00 €</h2>
                </div>
                <div style="padding:20px; border:1px solid var(--demo); border-radius:12px; flex:1">
                    <small>DEMO</small><h2 id="w-demo-val">0.00 D</h2>
                </div>
            </div>
            <div id="wallet-status">Locating...</div>
        </div>
    </div>

    <div id="section-account" class="section">
        <div class="market-card">
            <h2>Account</h2>
            <p>User: <b id="acc-username"></b></p>
            <p>Email: <b id="acc-email"></b></p>
            <button class="btn-danger" onclick="logout()">LOGOUT</button>
        </div>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-box">
        <h3>New Market</h3>
        <select id="m-type"><option value="DEMO">DEMO</option><option value="REAL">REAL</option></select>
        <input id="m-name" placeholder="Event Name">
        <label>Deadline</label>
        <input id="m-deadline" type="datetime-local">
        <input id="m-budget" type="number" placeholder="Initial Liquidity">
        <div id="groups-container"></div>
        <button class="btn-bet" onclick="addGroup()" style="margin-bottom:10px">+ Add Category</button>
        <button class="btn-primary" style="width:100%" onclick="saveMarket()">PUBLISH</button>
        <button class="btn-bet" style="border:none" onclick="closeModal('createModal')">Cancel</button>
    </div>
</div>

<div id="editModal" class="modal hidden">
    <div class="modal-box">
        <h3 id="edit-title"></h3>
        <div id="settle-area"></div>
        <hr style="border:0.5px solid var(--border); margin:20px 0;">
        <button class="btn-primary" style="width:100%; background:var(--success)" onclick="finalSubmitSettle()">RESOLVE ALL & PAYOUT</button>
        <button class="btn-bet" style="border:none; margin-top:10px" onclick="closeModal('editModal')">Cancel</button>
    </div>
</div>

<div id="betModal" class="modal hidden">
    <div class="modal-box" style="width:320px; text-align:center">
        <h3 id="bet-on"></h3>
        <h1 id="bet-odds" style="color:var(--primary)"></h1>
        <input type="number" id="bet-amount" value="10" oninput="calcWin()">
        <p id="bet-win-text">Win: 0.00</p>
        <button class="btn-primary" style="width:100%" onclick="placeBet()">CONFIRM</button>
        <button class="btn-bet" style="border:none" onclick="closeModal('betModal')">Cancel</button>
    </div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = JSON.parse(localStorage.getItem("user"));
    let userProfile = null;
    let currentSettleData = { mId: null, groups: [] };
    let activeBet = null;

    window.onload = async () => {
        if(!currentUser) { window.location.href="login.html"; return; }
        await fetchProfile();
        loadMarkets();
        fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=> document.getElementById('wallet-status').innerText = `Location: ${d.city}, ${d.country_name}`);
    };

    async function fetchProfile() {
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        document.getElementById("nav-real").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("nav-demo").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("w-real-val").innerText = data.real_balance.toFixed(2) + " €";
        document.getElementById("w-demo-val").innerText = data.demo_balance.toFixed(2) + " D";
        document.getElementById("acc-username").innerText = currentUser.username;
        document.getElementById("acc-email").innerText = currentUser.email;
    }

    async function loadMarkets() {
        const { data: markets } = await _supabase.from('markets').select('*').order('created_at', { ascending: false });
        const mList = document.getElementById('market-list');
        const hList = document.getElementById('history-list');
        mList.innerHTML = ""; hList.innerHTML = "";
        const now = new Date();

        markets.forEach(m => {
            const groups = JSON.parse(m.note || "[]");
            const isHost = m.creator_name === currentUser.username;
            const deadline = m.deadline ? new Date(m.deadline) : null;
            const expired = deadline && now > deadline;

            if(m.status === 'active') {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between">
                        <div>
                            <h3 style="margin:0">${m.title}</h3>
                            <small>Host: ${m.creator_name}</small><br>
                            <span style="font-size:10px; color:${expired?'var(--danger)':'#aaa'}">${expired?'⌛ EXPIRED':'⏳ Ends: '+m.deadline.replace('T',' ')}</span>
                        </div>
                        <div style="text-align:right">
                            <b style="color:var(--primary)">${m.type}</b><br>
                            ${isHost ? `<button class="btn-primary" style="font-size:10px; padding:4px 8px; margin-top:5px;" onclick="openSettle('${m.id}', '${m.title}')">SETTLE</button>` : ''}
                        </div>
                    </div>
                    ${groups.map(g => `
                        <div class="market-group">
                            <b>${g.title}</b>
                            <div class="outcomes-grid">
                                ${g.outcomes.map(o => `<button class="btn-bet" ${expired?'disabled':''} onclick="openBet('${m.id}', '${o.n}', ${o.o}, '${m.type}', '${m.deadline}')">${o.n}<br><b>${o.o}</b></button>`).join('')}
                            </div>
                        </div>
                    `).join('')}`;
                mList.appendChild(card);
            } else {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.style.opacity = "0.8";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>${m.title} (Closed)</h3>
                        <span style="color:var(--success); font-weight:bold;">RESOLVED ✔</span>
                    </div>
                    ${groups.map(g => `
                        <div style="font-size:12px; margin-top:10px; color:#aaa;">
                            <b>${g.title}:</b> 
                            ${g.outcomes.filter(o => o.status === 'win').map(o => `<span style="color:var(--success)">${o.n} (Winner)</span>`).join(', ') || 'No winner marked'}
                        </div>
                    `).join('')}
                `;
                hList.appendChild(card);
            }
        });
    }

    function openSettle(mId, title) {
        currentSettleData.mId = mId;
        document.getElementById('edit-title').innerText = title;
        _supabase.from('markets').select('note').eq('id', mId).single().then(({data}) => {
            currentSettleData.groups = JSON.parse(data.note);
            renderSettleUI();
            document.getElementById('editModal').classList.remove('hidden');
        });
    }

    function renderSettleUI() {
        const container = document.getElementById('settle-area');
        container.innerHTML = "";
        currentSettleData.groups.forEach((g, gIdx) => {
            const gDiv = document.createElement('div');
            gDiv.style.marginTop = "15px";
            gDiv.innerHTML = `<div style="color:var(--primary); font-weight:bold; margin-bottom:5px;">${g.title}</div>`;
            g.outcomes.forEach((o, oIdx) => {
                const row = document.createElement('div');
                row.className = 'settle-row';
                row.innerHTML = `
                    <span>${o.n}</span>
                    <div style="display:flex; gap:5px;">
                        <button class="btn-bet ${o.status==='win'?'selected-win':''}" style="width:60px; font-size:10px;" onclick="updateLocalStatus(${gIdx},${oIdx},'win')">WIN</button>
                        <button class="btn-bet ${o.status==='loss'?'selected-loss':''}" style="width:60px; font-size:10px;" onclick="updateLocalStatus(${gIdx},${oIdx},'loss')">LOSS</button>
                    </div>`;
                gDiv.appendChild(row);
            });
            container.appendChild(gDiv);
        });
    }

    function updateLocalStatus(gIdx, oIdx, status) {
        currentSettleData.groups[gIdx].outcomes[oIdx].status = status;
        renderSettleUI(); // Azonnal újrarajzolja a gombokat a kijelöléssel
    }

    async function finalSubmitSettle() {
        if(!confirm("Biztosan lezárod az összes kimenetelt? Ez kifizeti a nyerteseket!")) return;
        const mId = currentSettleData.mId;
        const groups = currentSettleData.groups;

        const { data: bets } = await _supabase.from('bets').select('*').eq('market_id', mId).eq('status', 'pending');
        
        for (let bet of (bets || [])) {
            let result = 'loss';
            groups.forEach(g => g.outcomes.forEach(o => {
                if(o.n === bet.outcome_name && o.status === 'win') result = 'win';
            }));

            if(result === 'win') {
                const field = bet.type === 'REAL' ? 'real_balance' : 'demo_balance';
                const { data: p } = await _supabase.from('profiles').select(field).eq('id', bet.user_id).single();
                await _supabase.from('profiles').update({ [field]: p[field] + (bet.amount * bet.odds) }).eq('id', bet.user_id);
                await _supabase.from('bets').update({ status: 'won' }).eq('id', bet.id);
            } else {
                await _supabase.from('bets').update({ status: 'lost' }).eq('id', bet.id);
            }
        }
        await _supabase.from('markets').update({ status: 'closed', note: JSON.stringify(groups) }).eq('id', mId);
        location.reload();
    }

    // CREATE / BET / NAV (Standard logikák)
    function openBet(mId, n, o, t, dl) {
        if(new Date() > new Date(dl)) return alert("Deadline passed!");
        activeBet = { mId, n, o, t };
        document.getElementById('bet-on').innerText = n;
        document.getElementById('bet-odds').innerText = "x" + o;
        document.getElementById('betModal').classList.remove('hidden');
        calcWin();
    }
    function calcWin() { document.getElementById('bet-win-text').innerText = "Win: "+(document.getElementById('bet-amount').value * activeBet.o).toFixed(2); }
    async function placeBet() {
        const a = parseFloat(document.getElementById('bet-amount').value);
        const f = activeBet.t === 'REAL' ? 'real_balance' : 'demo_balance';
        if(a > userProfile[f]) return alert("No money!");
        await _supabase.from('profiles').update({ [f]: userProfile[f] - a }).eq('id', currentUser.id);
        await _supabase.from('bets').insert([{ user_id: currentUser.id, market_id: activeBet.mId, outcome_name: activeBet.n, amount: a, odds: activeBet.o, type: activeBet.t, status: 'pending' }]);
        location.reload();
    }
    function addGroup() {
        const id = Date.now();
        const div = document.createElement('div'); div.className = 'market-group';
        div.innerHTML = `<input class="g-t" placeholder="Category"><div id="grid-${id}"></div><button class="btn-bet" style="font-size:10px" onclick="addO('${id}')">+ Option</button>`;
        document.getElementById('groups-container').appendChild(div);
        addO(id);
    }
    function addO(id) {
        const d = document.createElement('div'); d.style.display="flex"; d.style.gap="5px";
        d.innerHTML = `<input class="o-n" placeholder="Name"><input class="o-o" type="number" step="0.1" value="2.0" style="width:70px">`;
        document.getElementById('grid-'+id).appendChild(d);
    }
    async function saveMarket() {
        const t = document.getElementById('m-name').value;
        const b = parseFloat(document.getElementById('m-budget').value);
        const dl = document.getElementById('m-deadline').value;
        const type = document.getElementById('m-type').value;
        const groups = Array.from(document.querySelectorAll('.market-group')).map(g => ({
            title: g.querySelector('.g-t').value,
            outcomes: Array.from(g.querySelectorAll('[id^="grid-"] > div')).map(o => ({
                n: o.querySelector('.o-n').value, o: parseFloat(o.querySelector('.o-o').value), status: 'pending'
            }))
        }));
        await _supabase.from('markets').insert([{ title: t, type, take: b, deadline: dl, note: JSON.stringify(groups), creator_name: currentUser.username, status: 'active' }]);
        location.reload();
    }
    function showSection(id) { 
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); 
        document.getElementById('section-'+id).classList.add('active');
        document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
        document.getElementById('link-'+id).classList.add('active');
    }
    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); if(!document.getElementById('groups-container').innerHTML) addGroup(); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function logout() { localStorage.clear(); window.location.href="login.html"; }
</script>
</body>
</html>
