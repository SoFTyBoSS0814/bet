<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Fiók Felfüggesztve</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --danger: #ff4646;
            --bg: #0f212e;
            --card: #1a2c38;
            --text: #b1bad3;
            --accent: #00e701;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .banned-container {
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 450px;
            text-align: center;
            border-top: 4px solid var(--danger);
        }

        .icon {
            font-size: 50px;
            color: var(--danger);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        p {
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .info-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 25px;
            border: 1px dashed #2f4553;
        }

        .btn-logout {
            background: transparent;
            color: var(--text);
            border: 1px solid #2f4553;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="banned-container">
        <div class="icon">🚫</div>
        <h1>FIÓK FELFÜGGESZTVE</h1>
        <p>A rendszereink szabályszegést vagy gyanús aktivitást észleltek, ezért a hozzáférésedet korlátoztuk.</p>
        
        <div class="info-box">
            Ha úgy gondolod, hogy ez tévedés, kérjük, vedd fel a kapcsolatot a támogatási részleggel az ügyfél-azonosítód megadásával.
        </div>

        <button class="btn-logout" onclick="handleLogout()">Kijelentkezés</button>
    </div>

    <script>
        // 1. Supabase KONFIGURÁCIÓ (Pótold a saját adataiddal!)
        const SUPABASE_URL = "https://ldcrycuoynashsqlosae.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Automatikus ellenőrzés: ha már nem tiltott, engedjük vissza
        async function checkStatus() {
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (!session) return; // Nincs belépve, maradjon itt vagy jelentkezzen be

            const { data: profile } = await _supabase
                .from('profiles')
                .select('is_banned')
                .eq('id', session.user.id)
                .single();

            // Ha az admin feloldotta (is_banned immár false)
            if (profile && profile.is_banned === false) {
                window.location.href = "login.html";
            }
        }

        // 3. Kijelentkezés kezelése
        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.href = "login.html";
        }

        // Futtatás betöltéskor
        checkStatus();
    </script>
</body>
</html>
