<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Login & Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --card: #1d2d3a; --text: #fff; --input: #0b1218; --border: #2c4f60; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; position: relative; }
        
        /* Nyelvválasztó a sarokban */
        .lang-selector { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1001; }
        .lang-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .lang-btn:hover { background: var(--primary); color: #000; }

        .auth-box { background: var(--card); padding: 40px; border-radius: 20px; width: 380px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center; }
        h2 { color: var(--primary); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 3px; font-weight: 900; }
        p { color: #8899a6; font-size: 14px; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; margin-left: 5px; }
        input { width: 100%; padding: 14px; margin-top: 5px; background: var(--input); border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn-auth { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 15px; text-transform: uppercase; }
        .toggle-link { margin-top: 25px; font-size: 13px; color: #8899a6; }
        .toggle-link span { color: var(--primary); cursor: pointer; font-weight: bold; text-decoration: underline; }
        .hidden { display: none !important; }
        #msg { color: #ff4444; font-size: 12px; margin-top: 15px; display: none; padding: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.05); }

        /* Jogi lábléc */
        .login-footer { position: fixed; bottom: 20px; right: 20px; font-size: 11px; color: #666; background: rgba(29, 45, 58, 0.8); padding: 8px 15px; border-radius: 8px; border: 1px solid var(--border); z-index: 1000; backdrop-filter: blur(5px); }
        .login-footer a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .login-footer .sep { margin: 0 5px; color: #444; }
        @media (max-width: 600px) { .login-footer { right: 0; left: 0; bottom: 0; text-align: center; border-radius: 0; border-left: none; border-right: none; } }
    </style>
</head>
<body>

<div class="lang-selector">
    <button class="lang-btn" onclick="changeLoginLang('hu')">HU 🇭🇺</button>
    <button class="lang-btn" onclick="changeLoginLang('en')">EN 🇺🇸</button>
    <button class="lang-btn" onclick="changeLoginLang('de')">DE 🇺🇸</button>
    <button class="lang-btn" onclick="changeLoginLang('ru')">RU 🇺🇸</button>
    <button class="lang-btn" onclick="changeLoginLang('zn')">ZN 🇺🇸</button>
</div>

<div class="auth-box">
    <h2>STAKEFORGE</h2>
    <p id="auth-desc">Lépj be az arénába!</p>

    <div id="login-form">
        <div class="form-group">
            <label id="lbl-login-user">Email vagy Felhasználónév</label>
            <input type="text" id="login-input" placeholder="email@cim.hu vagy felhasznalonev">
        </div>
        <div class="form-group">
            <label id="lbl-login-pw">Jelszó</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-auth" id="btn-login-action" onclick="handleLogin()">Bejelentkezés</button>
        <div class="toggle-link"><span id="txt-no-account">Nincs még fiókod?</span> <span id="btn-toggle-reg" onclick="toggleAuth()">Regisztráció</span></div>
    </div>

    <div id="register-form" class="hidden">
        <div class="form-group">
            <label id="lbl-reg-user">Felhasználónév</label>
            <input type="text" id="reg-user" placeholder="username">
        </div>
        <div class="form-group">
            <label id="lbl-reg-email">Email cím</label>
            <input type="email" id="reg-email" placeholder="mail@mail.com">
        </div>
        <div class="form-group">
            <label id="lbl-reg-pw">Jelszó</label>
            <input type="password" id="reg-password" placeholder="Minimum 6 karakter">
        </div>
        <button class="btn-auth" id="btn-reg-action" onclick="handleRegister()">Fiók létrehozása</button>
        <div class="toggle-link"><span id="txt-has-account">Van már fiókod?</span> <span id="btn-toggle-login" onclick="toggleAuth()">Jelentkezz be</span></div>
    </div>
    
    <div id="msg"></div>
</div>

<footer class="login-footer">
    <a id="lnk-tos" href="tos.html" target="_blank">Terms of Service (ÁSZF)</a>
    <span class="sep">|</span>
    <a id="lnk-gdpr" href="gdpr.html" target="_blank">Privacy Policy (GDPR)</a>
</footer>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    const loginDicts = {
        hu: {
            desc_login: "Lépj be az arénába!",
            desc_reg: "Hozd létre a profilod!",
            lbl_user: "Email vagy Felhasználónév",
            lbl_pw: "Jelszó",
            lbl_reg_user: "Felhasználónév",
            lbl_email: "Email cím",

        },

        },

        },
         ru: {

            desc_reg: "Создайте свой профиль!",

        },
         zn: {
            desc_login: "进入区域",
            desc_reg: "创建您的个人资料",

            btn_login: "登录",
            btn_reg: "创建账户",
            no_acc: "您还没有账号吗",
            has_acc: "您已经有账号了吗？",
            link_reg: "注册",
            link_login: "登录",
            tos: "使用条款",
            gdpr: "隐私政策",
            tos_url: "tos_en.html",
            gdpr_url: "gdpr_en.html",
            err_fill: "请填写所有字段！",
            err_user: "无效的用户名",
            msg_success: "注册成功完成"
        }
    };

    let currentLang = 'hu';

    function changeLoginLang(lang) {
        currentLang = lang;
        const d = loginDicts[lang];
        const isLogin = !document.getElementById('login-form').classList.contains('hidden');
        
        document.getElementById('auth-desc').innerText = isLogin ? d.desc_login : d.desc_reg;
        
        // Login form
        document.getElementById('lbl-login-user').innerText = d.lbl_user;
        document.getElementById('lbl-login-pw').innerText = d.lbl_pw;
        document.getElementById('login-input').placeholder = d.ph_user;
        document.getElementById('btn-login-action').innerText = d.btn_login;
        document.getElementById('txt-no-account').innerText = d.no_acc;
        document.getElementById('btn-toggle-reg').innerText = d.link_reg;

        // Reg form
        document.getElementById('lbl-reg-user').innerText = d.lbl_reg_user;
        document.getElementById('lbl-reg-email').innerText = d.lbl_email;
        document.getElementById('lbl-reg-pw').innerText = d.lbl_pw;
        document.getElementById('reg-password').placeholder = d.ph_pw;
        document.getElementById('btn-reg-action').innerText = d.btn_reg;
        document.getElementById('txt-has-account').innerText = d.has_acc;
        document.getElementById('btn-toggle-login').innerText = d.link_login;

        // Footer links
        const tos = document.getElementById('lnk-tos');
        const gdpr = document.getElementById('lnk-gdpr');
        tos.innerText = d.tos; tos.href = d.tos_url;
        gdpr.innerText = d.gdpr; gdpr.href = d.gdpr_url;
    }

    function toggleAuth() {
        const d = loginDicts[currentLang];
        document.getElementById('login-form').classList.toggle('hidden');
        document.getElementById('register-form').classList.toggle('hidden');
        const isLogin = !document.getElementById('login-form').classList.contains('hidden');
        document.getElementById('auth-desc').innerText = isLogin ? d.desc_login : d.desc_reg;
        document.getElementById('msg').style.display = 'none';
    }

    function showMsg(text, isError = true) {
        const m = document.getElementById('msg');
        m.innerText = text;
        m.style.display = 'block';
        m.style.color = isError ? '#ff4444' : '#00ff88';
        m.style.background = isError ? 'rgba(255,68,68,0.1)' : 'rgba(0,255,136,0.1)';
    }

    async function handleLogin() {
        const d = loginDicts[currentLang];
        const loginVal = document.getElementById('login-input').value.trim();
        const password = document.getElementById('login-password').value;

        if(!loginVal || !password) return showMsg(d.err_fill);

        let emailToAuth = loginVal;
        if (!loginVal.includes('@')) {
            const { data: profile, error: pError } = await _supabase
                .from('profiles')
                .select('email')
                .eq('username', loginVal)
                .single();

            if (pError || !profile) return showMsg(d.err_user);
            emailToAuth = profile.email;
        }

        const { data, error } = await _supabase.auth.signInWithPassword({ 
            email: emailToAuth, 
            password: password 
        });

        if (error) {
            showMsg(error.message);
        } else {
            const { data: prof } = await _supabase.from('profiles').select('*').eq('id', data.user.id).single();
            localStorage.setItem("user", JSON.stringify({ 
                id: data.user.id, 
                username: prof?.username || "Felhasználó" 
            }));
            window.location.href = "index.html";
        }
    }

    async function handleRegister() {
        const d = loginDicts[currentLang];
        const user = document.getElementById('reg-user').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const pw = document.getElementById('reg-password').value;

        if(!user || !email || !pw) return showMsg(d.err_fill);

        const { data, error } = await _supabase.auth.signUp({ email, password: pw });
        if (error) return showMsg(error.message);

        if (data.user) {
            const { error: dbErr } = await _supabase.from('profiles').insert([
                { 
                    id: data.user.id, 
                    username: user, 
                    email: email, 
                    password: pw, 
                    demo_balance: 10000, 
                    real_balance: 0 
                }
            ]);

            if (dbErr) {
                showMsg(dbErr.message);
            } else {
                localStorage.setItem("user", JSON.stringify({ id: data.user.id, username: user }));
                showMsg(d.msg_success, false);
                setTimeout(() => { window.location.href = "index.html"; }, 1000);
            }
        }
    }
</script>
