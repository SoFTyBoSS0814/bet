<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeForge | Login & Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0f171e; --card: #1d2d3a; --text: #fff; --input: #0b1218; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .auth-box { background: var(--card); padding: 40px; border-radius: 20px; width: 380px; border: 1px solid #2c4f60; box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center; }
        h2 { color: var(--primary); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 3px; font-weight: 900; }
        p { color: #8899a6; font-size: 14px; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; margin-left: 5px; }
        input { width: 100%; padding: 14px; margin-top: 5px; background: var(--input); border: 1px solid #334756; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn-auth { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 15px; text-transform: uppercase; }
        .toggle-link { margin-top: 25px; font-size: 13px; color: #8899a6; }
        .toggle-link span { color: var(--primary); cursor: pointer; font-weight: bold; text-decoration: underline; }
        .hidden { display: none !important; }
        #msg { color: #ff4444; font-size: 12px; margin-top: 15px; display: none; padding: 10px; background: rgba(255,68,68,0.1); border-radius: 5px; }
    </style>
</head>
<body>

<div class="auth-box">
    <h2>STAKEFORGE</h2>
    <p id="auth-desc">Lépj be az arénába!</p>

    <div id="login-form">
        <div class="form-group">
            <label>Email cím</label>
            <input type="email" id="login-email" placeholder="pelda@email.hu">
        </div>
        <div class="form-group">
            <label>Jelszó</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-auth" onclick="handleLogin()">Bejelentkezés</button>
        <div class="toggle-link">Nincs még fiókod? <span onclick="toggleAuth()">Regisztráció</span></div>
    </div>

    <div id="register-form" class="hidden">
        <div class="form-group">
            <label>Felhasználónév</label>
            <input type="text" id="reg-user" placeholder="SzerencsesJanos">
        </div>
        <div class="form-group">
            <label>Email cím</label>
            <input type="email" id="reg-email" placeholder="pelda@email.hu">
        </div>
        <div class="form-group">
            <label>Jelszó</label>
            <input type="password" id="reg-password" placeholder="Minimum 6 karakter">
        </div>
        <button class="btn-auth" onclick="handleRegister()">Fiók létrehozása</button>
        <div class="toggle-link">Van már fiókod? <span onclick="toggleAuth()">Jelentkezz be</span></div>
    </div>
    
    <div id="msg"></div>
</div>

<script>
    const SB_URL = 'https://ldcrycuoynashsqlosae.supabase.co'; 
    const SB_KEY = 'sb_publishable_Jdda8r4L3n-CkQPLX4qsPA_A5kRJy1b'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    function toggleAuth() {
        document.getElementById('login-form').classList.toggle('hidden');
        document.getElementById('register-form').classList.toggle('hidden');
        const isLogin = !document.getElementById('login-form').classList.contains('hidden');
        document.getElementById('auth-desc').innerText = isLogin ? "Lépj be az arénába!" : "Hozd létre a profilod!";
        document.getElementById('msg').style.display = 'none';
    }

    function showMsg(text, isError = true) {
        const m = document.getElementById('msg');
        m.innerText = text;
        m.style.display = 'block';
        m.style.color = isError ? '#ff4444' : '#00ff88';
        m.style.background = isError ? 'rgba(255,68,68,0.1)' : 'rgba(0,255,136,0.1)';
    }

    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        if(!email || !password) return showMsg("Töltsd ki a mezőket!");

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            showMsg(error.message);
        } else {
            // Profil adat betöltése a tábládból
            const { data: prof } = await _supabase.from('profiles').select('*').eq('id', data.user.id).single();
            localStorage.setItem("user", JSON.stringify({ 
                id: data.user.id, 
                username: prof?.username || "Felhasználó" 
            }));
            window.location.href = "index.html";
        }
    }

    async function handleRegister() {
        const username = document.getElementById('reg-user').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        if(!username || !email || !password) return showMsg("Minden mezőt tölts ki!");

        // 1. Auth regisztráció
        const { data, error } = await _supabase.auth.signUp({ email, password });

        if (error) {
            showMsg(error.message);
            return;
        }

        if (data.user) {
            // 2. Profil létrehozása (MINDEN mezőt beküldünk, hogy ne legyen null hiba)
            const { error: profileError } = await _supabase.from('profiles').insert([
                { 
                    id: data.user.id, 
                    username: username, 
                    email: email, 
                    password: password, 
                    demo_balance: 10000, 
                    real_balance: 0 
                }
            ]);

            if (profileError) {
                showMsg("Adatbázis hiba: " + profileError.message);
            } else {
                // 3. Automatikus beléptetés, mivel a Confirm Email ki van kapcsolva
                localStorage.setItem("user", JSON.stringify({ 
                    id: data.user.id, 
                    username: username 
                }));
                showMsg("Sikeres regisztráció! Belépés...", false);
                setTimeout(() => { window.location.href = "index.html"; }, 1500);
            }
        }
    }
</script>
</body>
</html>
